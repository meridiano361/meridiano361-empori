<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/faviconm361.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../../assets/style/nav-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Meridiano 361 — Dati Azienda</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'CenturyGothic','Century Gothic',sans-serif;background:#f8fafc}
    .page-wrap{padding-top:56px;padding-bottom:72px;min-height:100vh}
    .content{max-width:600px;margin:0 auto;padding:24px 16px}

    .logo-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 20px 24px;text-align:center}
    .logo-wrap img{width:80px;height:80px;border-radius:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
    .az-name{font-size:17px;font-weight:900;color:#1e293b;line-height:1.3;margin-bottom:4px}
    .az-sub{font-size:12px;color:#64748b;font-weight:600;letter-spacing:.03em}

    .card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;overflow:hidden;margin-bottom:16px}
    .card-title{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;padding:14px 16px 0}
    .row{display:flex;align-items:flex-start;gap:12px;padding:11px 16px;border-bottom:1px solid #f1f5f9}
    .row:last-child{border-bottom:none}
    .row-icon{width:32px;height:32px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .row-icon i{font-size:13px;color:#64748b}
    .row-body{flex:1;min-width:0}
    .row-lbl{font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
    .row-val{font-size:14px;font-weight:600;color:#1e293b;line-height:1.4;word-break:break-word}
    .row-val a{color:#B5453A;text-decoration:none}
    .row-val a:hover{text-decoration:underline}

    .copy-btn{background:#f1f5f9;border:none;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:700;color:#64748b;cursor:pointer;font-family:inherit;margin-top:4px;display:inline-flex;align-items:center;gap:5px;transition:background .12s}
    .copy-btn:hover{background:#e2e8f0}
    .copy-btn.copied{background:#dcfce7;color:#15803d}
    .az-loading{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
  </style>
</head>
<body>
<script src="../../scripts/nav-script.js"></script>

<div class="page-wrap">
  <div class="content" id="az-content">
    <div class="az-loading"><i class="fas fa-spinner fa-spin"></i> Caricamento…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
function copia(testo, btn) {
  navigator.clipboard.writeText(testo).then(() => {
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Copiato';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
  });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyBtn(val) {
  return `<button class="copy-btn" onclick="copia('${esc(val)}',this)"><i class="fas fa-copy"></i> Copia</button>`;
}

(async function() {
  try {
    const u = JSON.parse(localStorage.getItem('m361_user') || 'null');
    const ruolo = (u && u.ruolo || '').toLowerCase();
    const showBanca = ['admin','dipendente'].includes(ruolo);

    // Supabase
    const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzYWx5bnZ4YXp4cXRtc3ZqcnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ3MjcsImV4cCI6MjA5MzMwMDcyN30.JW4nsMrrfuI8BTg4bn2v74seVJ-_prfxZ1PQp5T18a8';
    const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data: d } = await sb.from('dati_azienda').select('*').eq('id',1).single();

    if (!d) {
      document.getElementById('az-content').innerHTML = '<p style="padding:40px;color:#94a3b8;text-align:center">Dati non disponibili.</p>';
      return;
    }

    const indirizzo = [d.indirizzo, [d.cap, d.citta].filter(Boolean).join(' ') + (d.provincia ? ` (${d.provincia})` : '')].filter(Boolean).join('<br>');
    const mapsUrl = encodeURIComponent([d.indirizzo, d.cap, d.citta].filter(Boolean).join(', '));

    document.getElementById('az-content').innerHTML = `
      <div class="logo-wrap">
        <img src="/icons/icon-192.png" alt="Logo Meridiano 361">
        <div class="az-name">${esc(d.nome||'MERIDIANO 361')}</div>
        <div class="az-sub">${esc(d.tipo||'')}</div>
      </div>

      <!-- Sede -->
      <div class="card">
        <div class="card-title">Sede</div>
        <div class="row">
          <div class="row-icon"><i class="fas fa-location-dot"></i></div>
          <div class="row-body">
            <div class="row-lbl">Indirizzo</div>
            <div class="row-val">${indirizzo}
              ${d.indirizzo ? `<br><a href="https://www.google.com/maps/search/${mapsUrl}" target="_blank"><i class="fas fa-diamond-turn-right"></i> Google Maps</a>` : ''}
            </div>
          </div>
        </div>
      </div>

      <!-- Contatti -->
      <div class="card">
        <div class="card-title">Contatti</div>
        ${d.telefono ? `<div class="row">
          <div class="row-icon"><i class="fas fa-phone"></i></div>
          <div class="row-body">
            <div class="row-lbl">Telefono</div>
            <div class="row-val"><a href="tel:${esc(d.telefono.replace(/\s/g,''))}">${esc(d.telefono)}</a></div>
          </div>
        </div>` : ''}
        ${d.fax ? `<div class="row">
          <div class="row-icon"><i class="fas fa-fax"></i></div>
          <div class="row-body">
            <div class="row-lbl">Fax</div>
            <div class="row-val">${esc(d.fax)}</div>
          </div>
        </div>` : ''}
        ${d.pec ? `<div class="row">
          <div class="row-icon"><i class="fas fa-envelope"></i></div>
          <div class="row-body">
            <div class="row-lbl">PEC</div>
            <div class="row-val"><a href="mailto:${esc(d.pec)}">${esc(d.pec)}</a>
              ${copyBtn(d.pec)}
            </div>
          </div>
        </div>` : ''}
      </div>

      <!-- Dati Fiscali -->
      <div class="card">
        <div class="card-title">Dati Fiscali</div>
        ${d.cf_piva ? `<div class="row">
          <div class="row-icon"><i class="fas fa-id-card"></i></div>
          <div class="row-body">
            <div class="row-lbl">C.F. e P.IVA</div>
            <div class="row-val">${esc(d.cf_piva)} ${copyBtn(d.cf_piva)}</div>
          </div>
        </div>` : ''}
        ${d.sdi ? `<div class="row">
          <div class="row-icon"><i class="fas fa-file-invoice"></i></div>
          <div class="row-body">
            <div class="row-lbl">Codice SDI</div>
            <div class="row-val">${esc(d.sdi)} ${copyBtn(d.sdi)}</div>
          </div>
        </div>` : ''}
        ${d.rea ? `<div class="row">
          <div class="row-icon"><i class="fas fa-building-columns"></i></div>
          <div class="row-body">
            <div class="row-lbl">Numero REA</div>
            <div class="row-val">${esc(d.rea)}</div>
          </div>
        </div>` : ''}
        ${d.registro_imprese ? `<div class="row">
          <div class="row-icon"><i class="fas fa-registered"></i></div>
          <div class="row-body">
            <div class="row-lbl">Iscrizione Registro Imprese</div>
            <div class="row-val">${esc(d.registro_imprese)}</div>
          </div>
        </div>` : ''}
      </div>

      <!-- Bancario (solo admin/dipendente) -->
      ${showBanca && (d.banca||d.iban) ? `<div class="card">
        <div class="card-title">Dati bancari</div>
        ${d.banca ? `<div class="row">
          <div class="row-icon"><i class="fas fa-university"></i></div>
          <div class="row-body">
            <div class="row-lbl">Banca di appoggio</div>
            <div class="row-val">${esc(d.banca)}</div>
          </div>
        </div>` : ''}
        ${d.iban ? `<div class="row">
          <div class="row-icon"><i class="fas fa-credit-card"></i></div>
          <div class="row-body">
            <div class="row-lbl">IBAN</div>
            <div class="row-val">${esc(d.iban)} ${copyBtn(d.iban)}</div>
          </div>
        </div>` : ''}
      </div>` : ''}
    `;
  } catch(e) {
    document.getElementById('az-content').innerHTML = '<p style="padding:40px;color:#94a3b8;text-align:center">Errore caricamento dati.</p>';
  }
})();
</script>
</body>
</html>
