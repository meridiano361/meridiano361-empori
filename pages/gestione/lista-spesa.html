<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" href="/faviconm361.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../../assets/style/nav-style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Spesa</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --R:#B5453A;--Rd:#8c362d;--Rl:rgba(181,69,58,.08);
      --S:#1e293b;--S2:#334155;--S3:#475569;
      --G:#94a3b8;--Gl:#e2e8f0;--bg:#f1f5f9;
      --c-pulizie:#059669;   --c-pulizie-bg:#ecfdf5;
      --c-cancel:#2563eb;    --c-cancel-bg:#eff6ff;
      --c-attr:#d97706;      --c-attr-bg:#fffbeb;
      --c-altro:#7c3aed;     --c-altro-bg:#f5f3ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'CenturyGothic','Century Gothic',sans-serif;background:var(--bg);
      padding-bottom:120px;color:var(--S)}

    /* ── Header ── */
    .hd{position:sticky;top:56px;z-index:200;background:#fff;
      border-bottom:1px solid var(--Gl);padding:10px 14px;
      display:flex;align-items:center;gap:10px}
    .btn-ico{background:none;border:none;cursor:pointer;color:var(--G);font-size:17px;
      padding:5px 8px 5px 0;display:flex;align-items:center;flex-shrink:0;
      transition:color .12s;line-height:1}
    .btn-ico:hover{color:var(--R)}
    .hd-inner{flex:1;min-width:0}
    .hd-title{font-size:15px;font-weight:800;color:var(--S);
      display:flex;align-items:center;gap:8px}
    .hd-cnt{background:var(--R);color:#fff;border-radius:20px;padding:1px 9px;
      font-size:11px;font-weight:800;letter-spacing:.02em;display:none}
    .hd-sub{font-size:11px;color:var(--G);font-weight:600;margin-top:1px;display:none}
    .btn-svuota{background:none;border:1.5px solid var(--Gl);border-radius:8px;
      padding:5px 11px;font-size:11px;font-weight:800;color:var(--G);cursor:pointer;
      font-family:inherit;text-transform:uppercase;letter-spacing:.06em;
      transition:all .12s;white-space:nowrap;flex-shrink:0}
    .btn-svuota:hover{border-color:var(--R);color:var(--R)}

    /* ── Empori selector ── */
    .sel-wrap{padding:24px 16px 32px;max-width:900px;margin:0 auto}
    .sel-title{font-size:13px;font-weight:900;color:var(--S3);text-transform:uppercase;
      letter-spacing:.08em;margin-bottom:14px}
    .sel-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    @media(max-width:600px){.sel-grid{grid-template-columns:repeat(3,1fr)}}
    .emp-btn{padding:20px 12px;border-radius:16px;border:2px solid var(--Gl);background:#fff;
      cursor:pointer;text-align:center;transition:all .15s;display:flex;flex-direction:column;
      align-items:center;gap:8px;font-family:inherit}
    .emp-btn:hover{border-color:var(--R);transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(181,69,58,.12)}
    .emp-btn img{width:48px;height:48px;object-fit:contain;border-radius:12px}
    .emp-btn span{font-size:12px;font-weight:800;color:var(--S2)}

    /* ── Add form ── */
    .add-panel{background:#fff;border-bottom:1px solid var(--Gl);padding:14px 14px 10px}
    .add-row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
    .add-inp{flex:1;border:2px solid var(--Gl);border-radius:12px;padding:11px 14px;
      font-size:14px;font-weight:600;font-family:inherit;color:var(--S);outline:none;
      transition:border-color .15s,box-shadow .15s;background:#fff}
    .add-inp:focus{border-color:var(--R);box-shadow:0 0 0 3px var(--Rl)}
    .add-inp::placeholder{color:var(--G);font-weight:500}
    .btn-aggiungi{background:var(--R);color:#fff;border:none;border-radius:12px;
      padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;
      transition:background .12s;display:flex;align-items:center;gap:6px;flex-shrink:0;
      white-space:nowrap}
    .btn-aggiungi:hover{background:var(--Rd)}
    .btn-aggiungi:disabled{opacity:.4;cursor:not-allowed}

    /* category chips in form */
    .cat-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
    .cat-chip{border:2px solid;border-radius:12px;padding:6px 12px;font-size:12px;
      font-weight:800;cursor:pointer;font-family:inherit;transition:all .12s;
      white-space:nowrap;display:flex;align-items:center;gap:5px;background:#fff}
    .cat-chip i{font-size:11px}
    .cat-chip.on{color:#fff!important;border-color:transparent!important}
    .cat-chip[data-cat="Pulizie"]{color:var(--c-pulizie);border-color:var(--c-pulizie)}
    .cat-chip[data-cat="Pulizie"].on{background:var(--c-pulizie)}
    .cat-chip[data-cat="Cancelleria"]{color:var(--c-cancel);border-color:var(--c-cancel)}
    .cat-chip[data-cat="Cancelleria"].on{background:var(--c-cancel)}
    .cat-chip[data-cat="Attrezzature"]{color:var(--c-attr);border-color:var(--c-attr)}
    .cat-chip[data-cat="Attrezzature"].on{background:var(--c-attr)}
    .cat-chip[data-cat="Altro"]{color:var(--c-altro);border-color:var(--c-altro)}
    .cat-chip[data-cat="Altro"].on{background:var(--c-altro)}

    /* optional qty row */
    .qty-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .qty-lbl{font-size:11px;font-weight:700;color:var(--G);text-transform:uppercase;letter-spacing:.06em}
    .qty-inp{width:70px;border:1.5px solid var(--Gl);border-radius:9px;padding:6px 8px;
      font-size:13px;font-weight:700;font-family:inherit;text-align:center;outline:none;
      transition:border-color .12s;color:var(--S)}
    .qty-inp:focus{border-color:var(--R)}
    .unit-sel{border:1.5px solid var(--Gl);border-radius:9px;padding:6px 8px;font-size:13px;
      font-weight:700;font-family:inherit;color:var(--S);background:#fff;cursor:pointer;
      outline:none;transition:border-color .12s}
    .unit-sel:focus{border-color:var(--R)}
    .toggle-qty{background:none;border:none;cursor:pointer;font-size:11px;font-weight:700;
      color:var(--G);font-family:inherit;padding:0;display:flex;align-items:center;gap:4px;
      margin-top:2px;transition:color .1s;text-decoration:underline;text-underline-offset:2px}
    .toggle-qty:hover{color:var(--S3)}

    /* ── Filter bar ── */
    .filter-bar{background:#fff;border-bottom:1px solid var(--Gl);
      padding:7px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
      align-items:center;position:sticky;top:calc(56px + 50px);z-index:100}
    .filter-bar::-webkit-scrollbar{display:none}
    .fp{border:1.5px solid var(--Gl);background:#fff;border-radius:20px;padding:4px 12px;
      font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--G);
      transition:all .12s;white-space:nowrap;letter-spacing:.03em;display:flex;
      align-items:center;gap:5px}
    .fp:hover:not(.on){border-color:#cbd5e1;color:var(--S3)}
    .fp.on{color:#fff;border-color:transparent}
    .fp[data-f="tutti"].on{background:var(--S)}
    .fp[data-f="Pulizie"].on{background:var(--c-pulizie)}
    .fp[data-f="Cancelleria"].on{background:var(--c-cancel)}
    .fp[data-f="Attrezzature"].on{background:var(--c-attr)}
    .fp[data-f="Altro"].on{background:var(--c-altro)}
    .fp-cnt{background:rgba(0,0,0,.12);border-radius:10px;padding:0 6px;font-size:10px}

    /* ── List ── */
    .list-wrap{padding:10px 12px;max-width:800px;margin:0 auto}
    .sec-hd{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
      color:var(--G);padding:14px 4px 7px;display:flex;align-items:center;gap:8px}
    .sec-hd .cnt{background:var(--Gl);border-radius:8px;padding:1px 8px;font-size:10px;color:var(--S3)}
    .btn-coll{background:none;border:none;cursor:pointer;color:var(--G);font-size:12px;
      padding:0 2px;transition:color .1s;font-family:inherit;line-height:1}
    .btn-coll:hover{color:var(--S3)}
    .cat-group-hd{display:flex;align-items:center;gap:7px;padding:10px 4px 5px;
      font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
    .cat-group-hd i{font-size:12px}

    .item-card{background:#fff;border-radius:12px;border:1px solid var(--Gl);
      margin-bottom:7px;display:flex;align-items:center;gap:10px;padding:12px 13px;
      transition:opacity .15s,transform .1s;border-left:4px solid var(--Gl)}
    .item-card.done{background:#f8fafc;border-left-color:var(--Gl)!important;opacity:.7}
    .item-card.done .item-nome{text-decoration:line-through;color:var(--G)}
    .item-card[data-cat="Pulizie"]{border-left-color:var(--c-pulizie)}
    .item-card[data-cat="Cancelleria"]{border-left-color:var(--c-cancel)}
    .item-card[data-cat="Attrezzature"]{border-left-color:var(--c-attr)}
    .item-card[data-cat="Altro"]{border-left-color:var(--c-altro)}

    .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--Gl);
      display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
      transition:all .12s;font-size:13px}
    .chk:hover:not(.on){border-color:#94a3b8}
    .chk.on{background:#059669;border-color:#059669;color:#fff}

    .item-body{flex:1;min-width:0}
    .item-nome{font-size:14px;font-weight:700;color:var(--S);line-height:1.3;word-break:break-word}
    .item-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
    .meta-qty{font-size:11px;font-weight:800;color:var(--S2);background:#f1f5f9;
      border-radius:6px;padding:2px 7px;letter-spacing:.01em}
    .meta-cat{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;
      display:flex;align-items:center;gap:3px}
    .meta-chi{font-size:10px;color:var(--G);font-weight:600}
    .meta-time{font-size:10px;color:#cbd5e1;font-weight:500}
    .meta-new{font-size:10px;font-weight:800;color:var(--R);letter-spacing:.04em;
      background:var(--Rl);border-radius:5px;padding:1px 6px;animation:pulse 1.5s ease infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

    .item-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
    .btn-del{background:none;border:none;cursor:pointer;color:#cbd5e1;font-size:14px;
      padding:5px 4px;flex-shrink:0;transition:color .12s;line-height:1}
    .btn-del:hover{color:#ef4444}

    .empty{text-align:center;padding:50px 20px}
    .empty i{font-size:36px;opacity:.2;margin-bottom:12px;display:block}
    .empty-title{font-size:15px;font-weight:800;color:var(--S3);margin-bottom:6px}
    .empty-sub{font-size:13px;color:var(--G);line-height:1.5}
    .loader{text-align:center;padding:40px;color:var(--G)}

    /* ── Toast ── */
    #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      background:#1e293b;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;
      font-weight:700;font-family:inherit;pointer-events:none;opacity:0;transition:opacity .2s;
      z-index:9999;white-space:nowrap}
    #toast.show{opacity:1}

    /* ── Confirm dialog ── */
    .dlg-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;
      align-items:center;justify-content:center}
    .dlg-box{background:#fff;border-radius:16px;padding:26px 22px 18px;max-width:340px;
      width:90%;box-shadow:0 12px 40px rgba(0,0,0,.2)}
    .dlg-title{font-size:15px;font-weight:800;color:var(--S);margin-bottom:8px}
    .dlg-msg{font-size:13px;color:var(--S3);line-height:1.5;margin-bottom:20px}
    .dlg-btns{display:flex;gap:8px}
    .dlg-btn-s{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;
      cursor:pointer;border:1.5px solid var(--Gl);background:#fff;color:var(--S3);font-family:inherit}
    .dlg-btn-p{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;
      cursor:pointer;border:none;background:var(--R);color:#fff;font-family:inherit}

    @media(max-width:420px){
      .cat-chip{padding:5px 9px;font-size:11px}
      .btn-aggiungi{padding:11px 12px}
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="hd">
  <button class="btn-ico" id="btn-back-home" onclick="history.back()">
    <i class="fas fa-chevron-left"></i>
  </button>
  <button class="btn-ico" id="btn-back-emp" onclick="tornaEmpori()" style="display:none">
    <i class="fas fa-arrow-left"></i>
  </button>
  <div class="hd-inner">
    <div class="hd-title">
      <i class="fas fa-cart-shopping" style="color:var(--R)"></i>
      Lista Spesa
      <span class="hd-cnt" id="hd-cnt"></span>
    </div>
    <div class="hd-sub" id="hd-sub"></div>
  </div>
  <button class="btn-svuota" onclick="confermaSvuota()" id="btn-svuota" style="display:none">
    <i class="fas fa-check-double"></i> Svuota acquisiti
  </button>
</div>

<!-- Screen 1: Empori selector -->
<div id="screen-empori" style="display:none">
  <div class="sel-wrap">
    <div class="sel-title">Seleziona emporio</div>
    <div class="sel-grid" id="sel-grid"></div>
  </div>
</div>

<!-- Screen 2: Main -->
<div id="screen-main" style="display:none">

  <!-- Add panel -->
  <div class="add-panel">
    <div class="add-row">
      <input id="inp-nome" class="add-inp" type="text"
        placeholder="Cosa serve acquistare?" maxlength="120"
        onkeydown="if(event.key==='Enter')aggiungi()"
        oninput="aggiornaBtnAdd()">
      <button class="btn-aggiungi" id="btn-add-submit" onclick="aggiungi()" disabled>
        <i class="fas fa-plus"></i> Aggiungi
      </button>
    </div>
    <!-- Category chips (required) -->
    <div class="cat-row" id="cat-chips"></div>
    <!-- Optional qty row -->
    <div id="qty-row" style="display:none" class="qty-row">
      <span class="qty-lbl">Quantità:</span>
      <input id="inp-qty" class="qty-inp" type="number" min="0" step="any" placeholder="—">
      <select id="inp-unit" class="unit-sel">
        <option value="">—</option>
        <option value="pz">pz</option>
        <option value="kg">kg</option>
        <option value="g">g</option>
        <option value="l">l</option>
        <option value="ml">ml</option>
        <option value="bottiglie">bottiglie</option>
        <option value="pacchi">pacchi</option>
        <option value="rotoli">rotoli</option>
        <option value="scatole">scatole</option>
        <option value="flaconi">flaconi</option>
      </select>
    </div>
    <button class="toggle-qty" id="btn-toggle-qty" onclick="toggleQty()">
      <i class="fas fa-ruler-horizontal" style="font-size:10px"></i> Specifica quantità
    </button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filter-bar"></div>

  <!-- List -->
  <div class="list-wrap" id="list-wrap">
    <div class="loader"><i class="fas fa-spinner fa-spin"></i></div>
  </div>

</div><!-- /screen-main -->

<!-- Confirm dialog -->
<div class="dlg-bg" id="dlg" onclick="if(event.target===this)chiudiDlg()">
  <div class="dlg-box">
    <div class="dlg-title" id="dlg-title"></div>
    <div class="dlg-msg"   id="dlg-msg"></div>
    <div class="dlg-btns">
      <button class="dlg-btn-s" onclick="chiudiDlg()">Annulla</button>
      <button class="dlg-btn-p" id="dlg-ok">Conferma</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzYWx5bnZ4YXp4cXRtc3ZqcnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ3MjcsImV4cCI6MjA5MzMwMDcyN30.JW4nsMrrfuI8BTg4bn2v74seVJ-_prfxZ1PQp5T18a8';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

const CAT_DEFS = [
  { nome:'Pulizie',      icon:'fa-broom',               color:'var(--c-pulizie)', bg:'var(--c-pulizie-bg)' },
  { nome:'Cancelleria',  icon:'fa-pen',                 color:'var(--c-cancel)',  bg:'var(--c-cancel-bg)'  },
  { nome:'Attrezzature', icon:'fa-screwdriver-wrench',  color:'var(--c-attr)',    bg:'var(--c-attr-bg)'    },
  { nome:'Altro',        icon:'fa-box',                 color:'var(--c-altro)',   bg:'var(--c-altro-bg)'   },
];
function catDef(nome) { return CAT_DEFS.find(c => c.nome === nome) || { nome, icon:'fa-tag', color:'#64748b', bg:'#f1f5f9' }; }

const EMPORI = [
  {nome:'Casalmaggiore', img:'../../assets/images/logo_casalmaggiore.png'},
  {nome:'Cremona',       img:'../../assets/images/logo_cremona.png'},
  {nome:'Mantova',       img:'../../assets/images/logo_mantova.png'},
  {nome:'Reggio Emilia', img:'../../assets/images/logo_reggio_emilia.png'},
  {nome:'Viadana',       img:'../../assets/images/logo_viadana.png'},
];

const ADMIN_EMAILS = ['e.mazzolari@meridiano361.it','emilio.mazzolari@gmail.com'];

// ── State ─────────────────────────────────────────────────────────────────────
let currentEmporio   = '';
let currentNome      = '';
let isAdmin          = false;
let _selettoreEmpori = false;
let voci             = [];
let selectedCat      = '';
let filtroAttivo     = 'tutti';
let acqCollapsed     = true;
let qtyOpen          = false;
let realtimeCh       = null;
let _newIds          = new Set(); // IDs arrivati via realtime (mostra badge "nuovo")

// ── Screen management ─────────────────────────────────────────────────────────
function mostraEmpori() {
  document.getElementById('screen-empori').style.display = 'block';
  document.getElementById('screen-main').style.display   = 'none';
  document.getElementById('btn-back-emp').style.display  = 'none';
  document.getElementById('btn-back-home').style.display = '';
  document.getElementById('hd-sub').style.display        = 'none';
  document.getElementById('hd-cnt').style.display        = 'none';
  document.getElementById('btn-svuota').style.display    = 'none';
}

function mostraMain() {
  document.getElementById('screen-empori').style.display = 'none';
  document.getElementById('screen-main').style.display   = 'block';
  if (_selettoreEmpori) {
    document.getElementById('btn-back-emp').style.display  = '';
    document.getElementById('btn-back-home').style.display = 'none';
  }
  const sub = document.getElementById('hd-sub');
  sub.textContent   = currentEmporio;
  sub.style.display = currentEmporio ? '' : 'none';
}

function tornaEmpori() {
  currentEmporio = '';
  if (realtimeCh) { db.removeChannel(realtimeCh); realtimeCh = null; }
  filtroAttivo = 'tutti';
  mostraEmpori();
}

function selezionaEmporio(emp) {
  currentEmporio = emp;
  filtroAttivo   = 'tutti';
  mostraMain();
  carica();
  subscribeRealtime();
}

function buildEmpiGrid(filtro = null) {
  const g = document.getElementById('sel-grid');
  g.innerHTML = '';
  const lista = filtro
    ? EMPORI.filter(e => filtro.some(f => f.toLowerCase() === e.nome.toLowerCase()))
    : EMPORI;
  lista.forEach(e => {
    const c = document.createElement('div');
    c.className = 'emp-btn';
    c.innerHTML = `<img src="${e.img}" alt="${e.nome}"><span>${e.nome}</span>`;
    c.onclick = () => selezionaEmporio(e.nome);
    g.appendChild(c);
  });
}

// ── Category chips (add form) ─────────────────────────────────────────────────
function buildCatChips() {
  const wrap = document.getElementById('cat-chips');
  if (wrap.children.length) return;
  CAT_DEFS.forEach(c => {
    const btn = document.createElement('button');
    btn.className  = 'cat-chip';
    btn.dataset.cat = c.nome;
    btn.innerHTML  = `<i class="fas ${c.icon}"></i> ${c.nome}`;
    btn.onclick    = () => selectCat(c.nome);
    wrap.appendChild(btn);
  });
}

function selectCat(nome) {
  if (selectedCat === nome) {
    selectedCat = '';
    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('on'));
    return;
  }
  selectedCat = nome;
  document.querySelectorAll('.cat-chip').forEach(c => {
    c.classList.toggle('on', c.dataset.cat === nome);
  });
}

// ── Filter bar ────────────────────────────────────────────────────────────────
function buildFilterBar() {
  const bar = document.getElementById('filter-bar');
  const daAcq = voci.filter(v => !v.acquisito);
  const counts = {};
  CAT_DEFS.forEach(c => { counts[c.nome] = daAcq.filter(v => v.categoria === c.nome).length; });
  const noCat = daAcq.filter(v => !v.categoria || !CAT_DEFS.find(c=>c.nome===v.categoria)).length;

  const totalDa = daAcq.length;
  bar.innerHTML = `
    <button class="fp ${filtroAttivo==='tutti'?'on':''}" data-f="tutti" onclick="setFiltro('tutti')">
      Tutti <span class="fp-cnt">${totalDa}</span>
    </button>
    ${CAT_DEFS.map(c => `
    <button class="fp ${filtroAttivo===c.nome?'on':''}" data-f="${c.nome}"
      onclick="setFiltro('${c.nome}')"
      style="${filtroAttivo===c.nome?'':''}">
      <i class="fas ${c.icon}"></i> ${c.nome}
      ${counts[c.nome]>0?`<span class="fp-cnt">${counts[c.nome]}</span>`:''}
    </button>`).join('')}
  `;
}

function setFiltro(f) {
  filtroAttivo = f;
  render();
}

// ── Qty toggle ────────────────────────────────────────────────────────────────
function toggleQty() {
  qtyOpen = !qtyOpen;
  document.getElementById('qty-row').style.display = qtyOpen ? '' : 'none';
  const btn = document.getElementById('btn-toggle-qty');
  btn.innerHTML = qtyOpen
    ? '<i class="fas fa-chevron-up" style="font-size:10px"></i> Nascondi quantità'
    : '<i class="fas fa-ruler-horizontal" style="font-size:10px"></i> Specifica quantità';
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function carica() {
  document.getElementById('list-wrap').innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i></div>';
  const { data, error } = await db
    .from('lista_spesa_voci')
    .select('*')
    .eq('emporio', currentEmporio)
    .order('created_at', { ascending: false });
  if (error) {
    document.getElementById('list-wrap').innerHTML = `<div class="empty"><i class="fas fa-circle-exclamation"></i><div class="empty-title">Errore di caricamento</div><div class="empty-sub">${escHtml(error.message)}</div></div>`;
    return;
  }
  voci = data || [];
  _newIds.clear();
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  buildFilterBar();

  let daAcq = voci.filter(v => !v.acquisito);
  const acqSi = voci.filter(v => v.acquisito);

  // apply category filter
  if (filtroAttivo !== 'tutti') {
    daAcq = daAcq.filter(v => v.categoria === filtroAttivo);
  }

  // header count
  const cntEl = document.getElementById('hd-cnt');
  const totDa = voci.filter(v => !v.acquisito).length;
  cntEl.textContent   = totDa;
  cntEl.style.display = totDa > 0 ? '' : 'none';

  const svuota = document.getElementById('btn-svuota');
  if (svuota) svuota.style.display = acqSi.length ? '' : 'none';

  let html = '';

  if (!daAcq.length && !acqSi.length && filtroAttivo === 'tutti') {
    html = `<div class="empty">
      <i class="fas fa-cart-shopping"></i>
      <div class="empty-title">Lista vuota</div>
      <div class="empty-sub">Aggiungi il primo articolo qui sopra.<br>La lista è condivisa con tutti gli operatori dell'emporio.</div>
    </div>`;
  } else {
    if (filtroAttivo !== 'tutti') {
      const def = catDef(filtroAttivo);
      html += `<div class="cat-group-hd" style="color:${def.color}">
        <i class="fas ${def.icon}"></i> ${def.nome}
        <span style="font-size:11px;color:var(--G);font-weight:600">${daAcq.length} articol${daAcq.length===1?'o':'i'}</span>
      </div>`;
      if (!daAcq.length) {
        html += `<div class="empty" style="padding:30px 20px">
          <i class="fas ${def.icon}" style="color:${def.color}"></i>
          <div class="empty-title">Nessun articolo in "${filtroAttivo}"</div>
          <div class="empty-sub">Gli articoli acquisiti potrebbero essere stati spostati in basso.</div>
        </div>`;
      }
    } else if (daAcq.length) {
      html += `<div class="sec-hd">Da acquistare <span class="cnt">${daAcq.length}</span></div>`;
    }

    html += daAcq.map(v => renderVoce(v)).join('');

    if (acqSi.length && filtroAttivo === 'tutti') {
      html += `<div class="sec-hd" style="cursor:pointer;margin-top:8px" onclick="toggleAcq()">
        Già acquisiti <span class="cnt">${acqSi.length}</span>
        <button class="btn-coll"><i class="fas fa-chevron-${acqCollapsed?'down':'up'}"></i></button>
      </div>`;
      if (!acqCollapsed) {
        html += acqSi.map(v => renderVoce(v)).join('');
      }
    }
  }

  document.getElementById('list-wrap').innerHTML = html;
}

function toggleAcq() {
  acqCollapsed = !acqCollapsed;
  render();
}

function renderVoce(v) {
  const def     = catDef(v.categoria || '');
  const qtyStr  = v.quantita ? `${v.quantita}${v.unita ? ' ' + v.unita : ''}` : '';
  const qtyHtml = qtyStr
    ? `<span class="meta-qty">${escHtml(qtyStr)}</span>` : '';
  const catHtml = v.categoria
    ? `<span class="meta-cat" style="color:${def.color};background:${def.bg}">
         <i class="fas ${def.icon}" style="font-size:9px"></i> ${escHtml(v.categoria)}
       </span>` : '';
  const chiHtml  = v.aggiunto_da ? `<span class="meta-chi">${escHtml(v.aggiunto_da)}</span>` : '';
  const timeHtml = v.created_at  ? `<span class="meta-time">${fmtTime(v.created_at)}</span>` : '';
  const newHtml  = _newIds.has(v.id) ? `<span class="meta-new">nuovo</span>` : '';

  return `<div class="item-card${v.acquisito?' done':''}" data-cat="${escHtml(v.categoria||'')}">
    <div class="chk${v.acquisito?' on':''}" onclick="toggleAcquisito(${v.id})"
      title="${v.acquisito?'Annulla acquisizione':'Segna come acquisito'}">
      ${v.acquisito ? '<i class="fas fa-check"></i>' : ''}
    </div>
    <div class="item-body">
      <div class="item-nome">${escHtml(v.nome)}</div>
      <div class="item-meta">${qtyHtml}${catHtml}${chiHtml}${timeHtml}${newHtml}</div>
    </div>
    <div class="item-actions">
      <button class="btn-del" onclick="eliminaVoce(${v.id})" title="Elimina">
        <i class="fas fa-trash-can"></i>
      </button>
    </div>
  </div>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(iso) {
  if (!iso) return '';
  const d    = new Date(iso);
  const diff = Math.floor((Date.now() - d) / 1000);
  if (diff < 60)    return 'adesso';
  if (diff < 3600)  return `${Math.floor(diff/60)} min fa`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h fa`;
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit' });
}

// ── Add ───────────────────────────────────────────────────────────────────────
function aggiornaBtnAdd() {
  document.getElementById('btn-add-submit').disabled =
    !document.getElementById('inp-nome').value.trim();
}

async function aggiungi() {
  const nome = document.getElementById('inp-nome').value.trim();
  if (!nome) return;
  const qtyRaw = document.getElementById('inp-qty').value;

  const payload = {
    emporio:    currentEmporio,
    nome,
    categoria:  selectedCat || null,
    quantita:   qtyRaw ? parseFloat(qtyRaw) : null,
    unita:      document.getElementById('inp-unit').value || null,
    aggiunto_da: currentNome,
  };

  const { error } = await db.from('lista_spesa_voci').insert(payload).select().single();
  if (error) { showToast('Errore: ' + error.message); return; }

  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-qty').value  = '';
  document.getElementById('inp-unit').value = '';
  document.getElementById('btn-add-submit').disabled = true;
  document.getElementById('inp-nome').focus();

  inviaNotifica(nome, currentNome);
}

function inviaNotifica(articolo, mittente) {
  try {
    fetch(`${SUPA_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPA_KEY}` },
      body: JSON.stringify({
        target: currentEmporio,
        titolo: `${mittente} ha aggiunto alla lista spesa`,
        testo:  articolo,
        tipo:   'generali',
        url:    '/pages/gestione/lista-spesa.html',
      }),
    }).catch(() => {});
  } catch (_) {}
}

// ── Toggle acquisito ──────────────────────────────────────────────────────────
async function toggleAcquisito(id) {
  const v = voci.find(x => x.id === id);
  if (!v) return;
  const { error } = await db.from('lista_spesa_voci')
    .update({ acquisito: !v.acquisito }).eq('id', id);
  if (error) { showToast('Errore: ' + error.message); return; }
  v.acquisito = !v.acquisito;
  _newIds.delete(id);
  render();
}

// ── Delete ────────────────────────────────────────────────────────────────────
async function eliminaVoce(id) {
  const { error } = await db.from('lista_spesa_voci').delete().eq('id', id);
  if (error) { showToast('Errore: ' + error.message); return; }
  voci = voci.filter(v => v.id !== id);
  _newIds.delete(id);
  render();
}

// ── Svuota acquisiti ──────────────────────────────────────────────────────────
function confermaSvuota() {
  const cnt = voci.filter(v => v.acquisito).length;
  document.getElementById('dlg-title').textContent = 'Svuota acquisiti';
  document.getElementById('dlg-msg').textContent   =
    `Eliminare ${cnt} articol${cnt===1?'o':'i'} già acquisit${cnt===1?'o':'i'}? L'operazione non è reversibile.`;
  document.getElementById('dlg-ok').onclick = svuotaAcquisiti;
  document.getElementById('dlg').style.display = 'flex';
}
function chiudiDlg() { document.getElementById('dlg').style.display = 'none'; }

async function svuotaAcquisiti() {
  chiudiDlg();
  const { error } = await db.from('lista_spesa_voci')
    .delete().eq('emporio', currentEmporio).eq('acquisito', true);
  if (error) { showToast('Errore: ' + error.message); return; }
  voci = voci.filter(v => !v.acquisito);
  render();
  showToast('Acquisiti eliminati ✓');
}

// ── Realtime ──────────────────────────────────────────────────────────────────
function subscribeRealtime() {
  if (realtimeCh) db.removeChannel(realtimeCh);
  realtimeCh = db.channel('lista-spesa-' + currentEmporio)
    .on('postgres_changes', {
      event: '*', schema: 'public',
      table: 'lista_spesa_voci',
      filter: `emporio=eq.${currentEmporio}`,
    }, payload => {
      const { eventType, new: nw, old: ol } = payload;
      if (eventType === 'INSERT') {
        if (!voci.find(v => v.id === nw.id)) {
          voci.unshift(nw);
          _newIds.add(nw.id);
          setTimeout(() => { _newIds.delete(nw.id); render(); }, 5000);
          render();
        }
      } else if (eventType === 'UPDATE') {
        const i = voci.findIndex(v => v.id === nw.id);
        if (i >= 0) { voci[i] = nw; render(); }
      } else if (eventType === 'DELETE') {
        voci = voci.filter(v => v.id !== ol.id);
        _newIds.delete(ol.id);
        render();
      }
    }).subscribe();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const user = JSON.parse(localStorage.getItem('m361_user') || '{}');
  currentNome = user.nome || 'Operatore';
  isAdmin     = ADMIN_EMAILS.includes((user.email || '').toLowerCase().trim());

  buildCatChips();

  const allEmpori  = [user.emporio, ...(Array.isArray(user.empori_aggiuntivi) ? user.empori_aggiuntivi : [])].filter(Boolean);
  const uniqEmpori = [...new Set(allEmpori)];
  const isVeroAdmin = user.ruolo === 'admin';

  if (isVeroAdmin) {
    _selettoreEmpori = true;
    buildEmpiGrid(null);
    mostraEmpori();
  } else if (uniqEmpori.length === 1) {
    _selettoreEmpori = false;
    currentEmporio   = uniqEmpori[0];
    mostraMain();
    await carica();
    subscribeRealtime();
  } else {
    _selettoreEmpori = true;
    buildEmpiGrid(uniqEmpori.length > 0 ? uniqEmpori : null);
    mostraEmpori();
  }
}

document.addEventListener('DOMContentLoaded', () => setTimeout(init, 100));
</script>
