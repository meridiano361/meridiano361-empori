<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" href="/faviconm361.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../../assets/style/nav-style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Spesa</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --R:#B5453A;--Rd:#8c362d;--Rl:#fdf1f0;
      --S:#1e293b;--S2:#334155;--S3:#475569;
      --G:#94a3b8;--Gl:#e2e8f0;--bg:#f1f5f9;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'CenturyGothic','Century Gothic',sans-serif;background:var(--bg);padding-bottom:100px;color:var(--S)}

    .hd{position:sticky;top:56px;z-index:200;background:#fff;border-bottom:1px solid var(--Gl);
      padding:11px 14px;display:flex;align-items:center;gap:10px}
    .btn-back{background:none;border:none;cursor:pointer;color:var(--G);font-size:17px;padding:4px 8px 4px 0;
      display:flex;align-items:center;transition:color .12s}
    .btn-back:hover{color:var(--R)}
    .hd-title{font-size:15px;font-weight:800;color:var(--S);flex:1}
    .btn-svuota{background:none;border:1.5px solid var(--Gl);border-radius:8px;padding:5px 11px;
      font-size:11px;font-weight:800;color:var(--G);cursor:pointer;font-family:inherit;
      text-transform:uppercase;letter-spacing:.06em;transition:all .12s;white-space:nowrap}
    .btn-svuota:hover{border-color:var(--R);color:var(--R)}

    /* emporio pills */
    .emp-strip{background:#fff;border-bottom:1px solid var(--Gl);padding:7px 12px;
      display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
    .emp-strip::-webkit-scrollbar{display:none}
    .emp-pill{border:1.5px solid var(--Gl);background:#fff;border-radius:20px;padding:4px 13px;
      font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--G);
      transition:all .12s;white-space:nowrap;letter-spacing:.04em}
    .emp-pill:hover{border-color:#cbd5e1;color:var(--S3)}
    .emp-pill.on{border-color:var(--R);background:var(--R);color:#fff}

    /* add form */
    .add-wrap{background:#fff;border-bottom:1px solid var(--Gl);padding:12px 14px}
    .add-row{display:flex;gap:8px;align-items:center}
    .add-inp{flex:1;border:1.5px solid var(--Gl);border-radius:10px;padding:9px 13px;
      font-size:13px;font-weight:600;font-family:inherit;color:var(--S);outline:none;
      transition:border-color .15s,box-shadow .15s;background:#fff}
    .add-inp:focus{border-color:var(--R);box-shadow:0 0 0 3px rgba(181,69,58,.08)}
    .add-inp::placeholder{color:var(--G);font-weight:500}
    .btn-add{background:var(--R);color:#fff;border:none;border-radius:10px;padding:9px 14px;
      font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .12s;
      display:flex;align-items:center;gap:5px;flex-shrink:0}
    .btn-add:hover{background:var(--Rd)}
    .btn-add:disabled{opacity:.5;cursor:not-allowed}

    /* optional fields */
    .add-extra{margin-top:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .cat-chips{display:flex;gap:5px;flex-wrap:wrap}
    .cat-chip{border:1.5px solid;border-radius:14px;padding:3px 10px;font-size:11px;font-weight:800;
      cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap}
    .cat-chip.on{color:#fff!important}
    .qty-inp{width:60px;border:1.5px solid var(--Gl);border-radius:8px;padding:5px 7px;
      font-size:12px;font-weight:700;font-family:inherit;text-align:center;outline:none;
      transition:border-color .12s;color:var(--S)}
    .qty-inp:focus{border-color:var(--R)}
    .unit-sel{border:1.5px solid var(--Gl);border-radius:8px;padding:5px 7px;font-size:12px;
      font-weight:700;font-family:inherit;color:var(--S);background:#fff;cursor:pointer;outline:none;
      transition:border-color .12s}
    .unit-sel:focus{border-color:var(--R)}
    .cat-txt{width:110px;border:1.5px solid var(--Gl);border-radius:8px;padding:5px 8px;
      font-size:12px;font-weight:600;font-family:inherit;color:var(--S);outline:none;
      transition:border-color .12s}
    .cat-txt:focus{border-color:var(--R)}
    .toggle-extra{background:none;border:none;cursor:pointer;font-size:11px;font-weight:700;
      color:var(--G);font-family:inherit;padding:0;display:flex;align-items:center;gap:3px;
      transition:color .1s}
    .toggle-extra:hover{color:var(--S3)}

    /* list */
    .list-wrap{padding:10px 12px;max-width:800px;margin:0 auto}
    .section-lbl{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
      color:var(--G);padding:14px 4px 7px;display:flex;align-items:center;gap:8px}
    .section-lbl .cnt{background:var(--Gl);border-radius:8px;padding:1px 8px;font-size:10px;color:var(--S3)}
    .btn-coll{background:none;border:none;cursor:pointer;color:var(--G);font-size:12px;padding:0 2px;
      transition:color .1s;font-family:inherit}
    .btn-coll:hover{color:var(--S3)}

    .item-card{background:#fff;border-radius:12px;border:1px solid var(--Gl);margin-bottom:6px;
      display:flex;align-items:center;gap:10px;padding:11px 13px;transition:opacity .15s}
    .item-card.done{background:#f0fdf4;border-color:#bbf7d0;opacity:.8}
    .item-card.done .item-nome{text-decoration:line-through;color:var(--G)}

    .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--Gl);
      display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
      transition:all .12s;font-size:12px}
    .chk:hover:not(.on){border-color:#94a3b8}
    .chk.on{background:#059669;border-color:#059669;color:#fff}

    .item-body{flex:1;min-width:0}
    .item-nome{font-size:13px;font-weight:700;color:var(--S);line-height:1.3;
      word-break:break-word}
    .item-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
    .meta-qty{font-size:11px;font-weight:700;color:var(--S3);background:#f1f5f9;
      border-radius:5px;padding:1px 6px}
    .meta-cat{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;color:#fff}
    .meta-chi{font-size:10px;color:var(--G);font-weight:600}
    .meta-time{font-size:10px;color:#cbd5e1;font-weight:500}

    .btn-del{background:none;border:none;cursor:pointer;color:#cbd5e1;font-size:14px;padding:4px;
      flex-shrink:0;transition:color .12s;line-height:1}
    .btn-del:hover{color:#ef4444}

    .empty{text-align:center;padding:50px 20px;color:var(--G);font-size:14px;font-weight:600}
    .loader{text-align:center;padding:40px;color:var(--G)}

    /* toast */
    #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      background:#1e293b;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;
      font-weight:700;font-family:inherit;pointer-events:none;opacity:0;transition:opacity .2s;
      z-index:9999;white-space:nowrap}
    #toast.show{opacity:1}

    /* confirm overlay */
    .dlg-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;
      align-items:center;justify-content:center}
    .dlg-box{background:#fff;border-radius:16px;padding:26px 22px 18px;max-width:340px;
      width:90%;box-shadow:0 12px 40px rgba(0,0,0,.2)}
    .dlg-title{font-size:15px;font-weight:800;color:var(--S);margin-bottom:8px}
    .dlg-msg{font-size:13px;color:var(--S3);line-height:1.5;margin-bottom:20px}
    .dlg-btns{display:flex;gap:8px}
    .dlg-btn-s{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;
      cursor:pointer;border:1.5px solid var(--Gl);background:#fff;color:var(--S3);font-family:inherit}
    .dlg-btn-p{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;
      cursor:pointer;border:none;background:var(--R);color:#fff;font-family:inherit}

    @media(max-width:480px){
      .add-extra{gap:5px}
      .cat-chips{gap:4px}
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="hd">
  <button class="btn-back" onclick="history.back()"><i class="fas fa-chevron-left"></i></button>
  <span class="hd-title"><i class="fas fa-cart-shopping" style="color:var(--R);margin-right:7px"></i>Lista Spesa</span>
  <button class="btn-svuota" onclick="confermaSvuota()" id="btn-svuota" style="display:none">
    <i class="fas fa-check-double" style="margin-right:4px"></i>Svuota acquisiti
  </button>
</div>

<!-- Emporio switcher (admin only) -->
<div class="emp-strip" id="emp-strip" style="display:none"></div>

<!-- Add form -->
<div class="add-wrap">
  <div class="add-row">
    <input id="inp-nome" class="add-inp" type="text" placeholder="Aggiungi articolo…" maxlength="120"
      onkeydown="if(event.key==='Enter')aggiungi()" oninput="aggiornaBtnAdd()">
    <button class="btn-add" id="btn-add-submit" onclick="aggiungi()" disabled>
      <i class="fas fa-plus"></i>
    </button>
  </div>
  <div class="add-extra" id="add-extra" style="display:none">
    <div class="cat-chips" id="cat-chips"></div>
    <input id="inp-cat" class="cat-txt" type="text" placeholder="Categoria…" maxlength="40" oninput="syncCatChip()">
    <input id="inp-qty" class="qty-inp" type="number" min="0" step="any" placeholder="Qtà">
    <select id="inp-unit" class="unit-sel">
      <option value="">—</option>
      <option value="pz">pz</option>
      <option value="kg">kg</option>
      <option value="g">g</option>
      <option value="l">l</option>
      <option value="ml">ml</option>
      <option value="bottiglie">bottiglie</option>
      <option value="pacchi">pacchi</option>
      <option value="rotoli">rotoli</option>
      <option value="scatole">scatole</option>
    </select>
  </div>
  <button class="toggle-extra" id="btn-toggle-extra" onclick="toggleExtra()" style="margin-top:7px">
    <i class="fas fa-sliders" style="font-size:10px"></i> Categoria / Quantità
  </button>
</div>

<!-- List -->
<div class="list-wrap" id="list-wrap">
  <div class="loader"><i class="fas fa-spinner fa-spin"></i></div>
</div>

<!-- Confirm dialog -->
<div class="dlg-bg" id="dlg" onclick="if(event.target===this)chiudiDlg()">
  <div class="dlg-box">
    <div class="dlg-title" id="dlg-title"></div>
    <div class="dlg-msg" id="dlg-msg"></div>
    <div class="dlg-btns">
      <button class="dlg-btn-s" onclick="chiudiDlg()">Annulla</button>
      <button class="dlg-btn-p" id="dlg-ok" onclick="">Conferma</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzYWx5bnZ4YXp4cXRtc3ZqcnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ3MjcsImV4cCI6MjA5MzMwMDcyN30.JW4nsMrrfuI8BTg4bn2v74seVJ-_prfxZ1PQp5T18a8';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── Categorie colori ──────────────────────────────────────────────────────────
const CAT_PRESETS = [
  { nome: 'Pulizie',    color: '#059669' },
  { nome: 'Cancelleria',color: '#2563eb' },
  { nome: 'Alimentari', color: '#d97706' },
  { nome: 'Buste',      color: '#0d9488' },
  { nome: 'Altro',      color: '#7c3aed' },
];
const CAT_COLOR_MAP = Object.fromEntries(CAT_PRESETS.map(c => [c.nome, c.color]));
function catColor(c) { return CAT_COLOR_MAP[c] || '#64748b'; }

// ── State ─────────────────────────────────────────────────────────────────────
let currentEmporio = '';
let currentNome    = '';
let isAdmin        = false;
let voci           = [];
let extraOpen      = false;
let selectedCat    = '';
let acqCollapsed   = false;
let realtimeCh     = null;

const ADMIN_EMAILS = ['e.mazzolari@meridiano361.it', 'emilio.mazzolari@gmail.com'];
const EMPORI_ORDER = ['cremona','casalmaggiore','viadana','reggioemilia','mantova','mantova_d'];
const EMPORI_LABEL = {
  cremona:'Cremona', casalmaggiore:'Casalmaggiore', viadana:'Viadana',
  reggioemilia:'Reggio Emilia', mantova:'Mantova U.', mantova_d:'Mantova D.',
};

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const user = JSON.parse(localStorage.getItem('m361_user') || '{}');
  currentNome    = user.nome || 'Operatore';
  currentEmporio = user.emporio || '';
  isAdmin        = ADMIN_EMAILS.includes((user.email || '').toLowerCase().trim());

  if (isAdmin) await buildEmporioPills();
  if (!currentEmporio) {
    document.getElementById('list-wrap').innerHTML = '<div class="empty">Emporio non impostato — ricarica la pagina o torna alla home.</div>';
    return;
  }
  buildCatChips();
  await carica();
  subscribeRealtime();
}

// ── Empori pills (admin) ──────────────────────────────────────────────────────
async function buildEmporioPills() {
  const { data: conf } = await db.from('empori_config').select('chiave,nome_breve,attivo');
  const strip = document.getElementById('emp-strip');
  strip.style.display = '';
  const empori = (conf || []).filter(e => e.attivo !== false);
  const ordine = EMPORI_ORDER.filter(k => empori.find(e => e.chiave === k) || empori.find(e => e.chiave.startsWith(k)));
  for (const k of ordine) {
    const e = empori.find(x => x.chiave === k);
    if (!e) continue;
    const pill = document.createElement('button');
    pill.className = 'emp-pill' + (k === currentEmporio ? ' on' : '');
    pill.textContent = e.nome_breve || EMPORI_LABEL[k] || k;
    pill.onclick = () => { currentEmporio = k; document.querySelectorAll('.emp-pill').forEach(p => p.classList.remove('on')); pill.classList.add('on'); carica(); };
    strip.appendChild(pill);
  }
  if (!strip.querySelector('.on')) { const first = strip.querySelector('.emp-pill'); if (first) { first.classList.add('on'); currentEmporio = ordine[0]; } }
}

// ── Cat chips ─────────────────────────────────────────────────────────────────
function buildCatChips() {
  const wrap = document.getElementById('cat-chips');
  CAT_PRESETS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.textContent = c.nome;
    btn.dataset.cat = c.nome;
    btn.style.cssText = `color:${c.color};border-color:${c.color}40`;
    btn.onclick = () => selectCatChip(c.nome, btn);
    wrap.appendChild(btn);
  });
}

function selectCatChip(nome, el) {
  if (selectedCat === nome) {
    selectedCat = '';
    el.classList.remove('on');
    el.style.cssText = `color:${catColor(nome)};border-color:${catColor(nome)}40`;
    document.getElementById('inp-cat').value = '';
    return;
  }
  selectedCat = nome;
  document.getElementById('inp-cat').value = nome;
  document.querySelectorAll('.cat-chip').forEach(c => {
    c.classList.remove('on');
    c.style.cssText = `color:${catColor(c.dataset.cat)};border-color:${catColor(c.dataset.cat)}40`;
  });
  el.classList.add('on');
  el.style.cssText = `background:${catColor(nome)};border-color:${catColor(nome)}`;
}

function syncCatChip() {
  const v = document.getElementById('inp-cat').value.trim();
  selectedCat = v;
  document.querySelectorAll('.cat-chip').forEach(c => {
    const match = c.dataset.cat === v;
    c.classList.toggle('on', match);
    c.style.cssText = match
      ? `background:${catColor(c.dataset.cat)};border-color:${catColor(c.dataset.cat)}`
      : `color:${catColor(c.dataset.cat)};border-color:${catColor(c.dataset.cat)}40`;
  });
}

function toggleExtra() {
  extraOpen = !extraOpen;
  document.getElementById('add-extra').style.display = extraOpen ? '' : 'none';
  const btn = document.getElementById('btn-toggle-extra');
  btn.innerHTML = extraOpen
    ? '<i class="fas fa-chevron-up" style="font-size:10px"></i> Meno opzioni'
    : '<i class="fas fa-sliders" style="font-size:10px"></i> Categoria / Quantità';
}

// ── Load ──────────────────────────────────────────────────────────────────────
async function carica() {
  document.getElementById('list-wrap').innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i></div>';
  const { data, error } = await db
    .from('lista_spesa_voci')
    .select('*')
    .eq('emporio', currentEmporio)
    .order('created_at', { ascending: false });
  if (error) { document.getElementById('list-wrap').innerHTML = `<div class="empty">Errore: ${error.message}</div>`; return; }
  voci = data || [];
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const daAcq  = voci.filter(v => !v.acquisito);
  const acqSi  = voci.filter(v =>  v.acquisito);
  const btn = document.getElementById('btn-svuota');
  if (btn) btn.style.display = acqSi.length ? '' : 'none';

  let html = '';
  if (!daAcq.length && !acqSi.length) {
    html = '<div class="empty"><i class="fas fa-cart-shopping" style="font-size:28px;margin-bottom:10px;display:block;opacity:.3"></i>Lista vuota — aggiungi il primo articolo sopra</div>';
  } else {
    if (daAcq.length) {
      html += `<div class="section-lbl">Da acquistare <span class="cnt">${daAcq.length}</span></div>`;
      html += daAcq.map(v => renderVoce(v)).join('');
    }
    if (acqSi.length) {
      html += `<div class="section-lbl" style="cursor:pointer" onclick="toggleAcq()">
        Già acquisiti <span class="cnt">${acqSi.length}</span>
        <button class="btn-coll"><i class="fas fa-chevron-${acqCollapsed?'down':'up'}"></i></button>
      </div>`;
      html += `<div id="acq-list" style="${acqCollapsed?'display:none':''}">`;
      html += acqSi.map(v => renderVoce(v)).join('');
      html += '</div>';
    }
  }
  document.getElementById('list-wrap').innerHTML = html;
}

function toggleAcq() {
  acqCollapsed = !acqCollapsed;
  render();
}

function renderVoce(v) {
  const qtyStr = v.quantita ? `${v.quantita}${v.unita ? ' ' + v.unita : ''}` : '';
  const catColor_ = v.categoria ? catColor(v.categoria) : '';
  const catHtml = v.categoria
    ? `<span class="meta-cat" style="background:${catColor_}">${escHtml(v.categoria)}</span>` : '';
  const qtyHtml = qtyStr ? `<span class="meta-qty">${escHtml(qtyStr)}</span>` : '';
  const chiHtml = v.aggiunto_da ? `<span class="meta-chi">${escHtml(v.aggiunto_da)}</span>` : '';
  const timeHtml = v.created_at ? `<span class="meta-time">${fmtTime(v.created_at)}</span>` : '';
  return `
  <div class="item-card${v.acquisito?' done':''}" id="voce-${v.id}">
    <div class="chk${v.acquisito?' on':''}" onclick="toggleAcquisito(${v.id})" title="${v.acquisito?'Annulla':'Segna come acquisito'}">
      ${v.acquisito ? '<i class="fas fa-check"></i>' : ''}
    </div>
    <div class="item-body">
      <div class="item-nome">${escHtml(v.nome)}</div>
      <div class="item-meta">${qtyHtml}${catHtml}${chiHtml}${timeHtml}</div>
    </div>
    <button class="btn-del" onclick="eliminaVoce(${v.id})" title="Elimina"><i class="fas fa-trash-can"></i></button>
  </div>`;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'adesso';
  if (diff < 3600) return `${Math.floor(diff/60)} min fa`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h fa`;
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit' });
}

// ── Add ───────────────────────────────────────────────────────────────────────
function aggiornaBtnAdd() {
  document.getElementById('btn-add-submit').disabled = !document.getElementById('inp-nome').value.trim();
}

async function aggiungi() {
  const nome = document.getElementById('inp-nome').value.trim();
  if (!nome) return;
  const cat = document.getElementById('inp-cat').value.trim() || null;
  const qtyRaw = document.getElementById('inp-qty').value;
  const qty  = qtyRaw ? parseFloat(qtyRaw) : null;
  const unit = document.getElementById('inp-unit').value || null;

  const payload = {
    emporio: currentEmporio,
    nome,
    categoria: cat || null,
    quantita: qty,
    unita: unit,
    aggiunto_da: currentNome,
  };
  const { data, error } = await db.from('lista_spesa_voci').insert(payload).select().single();
  if (error) { showToast('Errore: ' + error.message); return; }

  // Reset form
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-qty').value  = '';
  document.getElementById('inp-unit').value = '';
  document.getElementById('inp-cat').value  = '';
  selectedCat = '';
  document.querySelectorAll('.cat-chip').forEach(c => {
    c.classList.remove('on');
    c.style.cssText = `color:${catColor(c.dataset.cat)};border-color:${catColor(c.dataset.cat)}40`;
  });
  document.getElementById('btn-add-submit').disabled = true;
  document.getElementById('inp-nome').focus();

  // Push agli altri operatori dell'emporio
  inviaNotifica(nome, payload.aggiunto_da);
}

function inviaNotifica(articolo, mittente) {
  try {
    fetch(`${SUPA_URL}/functions/v1/send-notification`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPA_KEY}` },
      body: JSON.stringify({
        target: currentEmporio,
        titolo: `${mittente} ha aggiunto alla lista spesa`,
        testo: articolo,
        tipo: 'generali',
        url: '/pages/gestione/lista-spesa.html',
      }),
    }).catch(() => {});
  } catch (_) {}
}

// ── Toggle acquisito ──────────────────────────────────────────────────────────
async function toggleAcquisito(id) {
  const v = voci.find(x => x.id === id);
  if (!v) return;
  const nuovoStato = !v.acquisito;
  const { error } = await db.from('lista_spesa_voci').update({ acquisito: nuovoStato }).eq('id', id);
  if (error) { showToast('Errore: ' + error.message); return; }
  v.acquisito = nuovoStato;
  render();
}

// ── Delete ────────────────────────────────────────────────────────────────────
async function eliminaVoce(id) {
  const { error } = await db.from('lista_spesa_voci').delete().eq('id', id);
  if (error) { showToast('Errore: ' + error.message); return; }
  voci = voci.filter(v => v.id !== id);
  render();
}

// ── Svuota acquisiti ──────────────────────────────────────────────────────────
function confermaSvuota() {
  const cnt = voci.filter(v => v.acquisito).length;
  document.getElementById('dlg-title').textContent = 'Svuota acquisiti';
  document.getElementById('dlg-msg').textContent   = `Eliminare ${cnt} articol${cnt===1?'o':'i'} già acquisit${cnt===1?'o':'i'}? L'operazione non è reversibile.`;
  document.getElementById('dlg-ok').onclick = svuotaAcquisiti;
  document.getElementById('dlg').style.display = 'flex';
}
function chiudiDlg() { document.getElementById('dlg').style.display = 'none'; }

async function svuotaAcquisiti() {
  chiudiDlg();
  const { error } = await db.from('lista_spesa_voci').delete().eq('emporio', currentEmporio).eq('acquisito', true);
  if (error) { showToast('Errore: ' + error.message); return; }
  voci = voci.filter(v => !v.acquisito);
  render();
  showToast('Acquisiti eliminati ✓');
}

// ── Realtime ──────────────────────────────────────────────────────────────────
function subscribeRealtime() {
  if (realtimeCh) db.removeChannel(realtimeCh);
  realtimeCh = db.channel('lista-spesa-' + currentEmporio)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'lista_spesa_voci',
      filter: `emporio=eq.${currentEmporio}`,
    }, payload => {
      const { eventType, new: nw, old: ol } = payload;
      if (eventType === 'INSERT') {
        if (!voci.find(v => v.id === nw.id)) { voci.unshift(nw); render(); }
      } else if (eventType === 'UPDATE') {
        const idx = voci.findIndex(v => v.id === nw.id);
        if (idx >= 0) { voci[idx] = nw; render(); }
      } else if (eventType === 'DELETE') {
        voci = voci.filter(v => v.id !== ol.id); render();
      }
    })
    .subscribe();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── Start ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(init, 100);
});
</script>
