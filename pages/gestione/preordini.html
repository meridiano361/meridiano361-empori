<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" href="/faviconm361.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Preordini</title>
  <link rel="stylesheet" href="../../assets/style/nav-style.css">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; overflow: hidden; }

    /* ── SAVE BADGE ── */
    #save-badge {
      position: fixed; top: 64px; right: 14px; z-index: 50;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      font-family: 'Nunito', sans-serif; pointer-events: none; display: none;
    }
    #save-badge.saving { display: block; background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    #save-badge.saved  { display: block; background: #f0fdf4; color: #16A34A; border: 1px solid #bbf7d0; }
    #save-badge.err    { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    /* ── TOOLBAR ── */
    .toolbar {
      position: sticky; top: 56px; z-index: 20;
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 8px 14px; display: flex; align-items: center;
      gap: 8px; flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.04);
      min-height: 52px;
    }

    /* ── SCONTO BANNER ── */
    #sconto-banner {
      position: sticky; top: calc(56px + 52px); z-index: 19;
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
      padding: 6px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 11px; font-family: 'Nunito', sans-serif;
    }
    #sconto-banner.hidden { display: none; }
    .sconto-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 3px 10px; font-size: 11px; font-weight: 600; color: #374151;
    }
    .sconto-chip .sc-emp  { font-weight: 800; color: #1e293b; }
    .sconto-chip .sc-euro { color: #64748b; }
    .sconto-chip .sc-pct  { color: #16A34A; font-weight: 800; }
    .sconto-chip .sc-pct.nosconto { color: #94a3b8; }

    /* ── FILTRI BAR ── */
    #filtri-bar {
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
      padding: 7px 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-family: 'Nunito', sans-serif;
    }
    .filtro-input {
      height: 30px; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 0 10px; font-size: 12px; font-family: 'Nunito', sans-serif;
      background: white; color: #1e293b; outline: none;
    }
    .filtro-input:focus { border-color: #94a3b8; }
    #filtro-testo { width: 200px; }
    #filtro-cat   { width: 160px; cursor: pointer; }
    .filtri-reset-btn {
      height: 30px; padding: 0 10px; border: 1px solid #fecaca;
      border-radius: 8px; background: #fef2f2; color: #dc2626;
      font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .filtri-reset-btn:hover { background: #fee2e2; }
    #filtri-count { font-size: 11px; color: #94a3b8; font-weight: 600; }

    /* ── HUB VIEW SCROLL ── */
    /* L'altezza di #hub-view viene impostata via JS come #table-view */
    #hub-view { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* ── TABLE VIEW FLEX ── */
    /* L'altezza di #table-view viene impostata dinamicamente via JS:
       riempie esattamente dal punto in cui inizia fino al fondo del viewport */
    #table-view { display: flex; flex-direction: column; overflow: hidden; }
    #table-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* ── TABLE WRAPPER ── */
    .tabella-wrapper {
      overflow-x: auto; overflow-y: auto;
      flex: 1; min-height: 0;
      -webkit-overflow-scrolling: touch; padding-bottom: 80px;
    }

    /* Override global mobile rule that breaks sticky columns */
    .tabella-preordini { display: table !important; }

    /* ── INCIDENCE CELL ── */
    .td-inc { background: #f0f9ff; color: #0369a1; font-size: 10px; font-weight: 700; text-align: right; padding: 2px 5px; min-width: 38px; white-space: nowrap; }

    /* ── TABLE ── */
    .tabella-preordini { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tabella-preordini thead { position: sticky; top: 0; z-index: 15; }
    .tabella-preordini td { padding: 2px 3px; border: 1px solid #e2e8f0; vertical-align: middle; }

    /* ── HEADER ── */
    .th-info {
      background: #f8fafc; color: #475569; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; padding: 5px 6px;
      text-align: left; border: 1px solid #e2e8f0;
    }
    .th-stor {
      padding: 4px 5px; text-align: center; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
      background: #334155; color: #94a3b8; border: 1px solid #475569;
    }
    .th-stor-year {
      padding: 3px 4px; text-align: center; font-size: 8px; font-weight: 700;
      background: #475569; color: #94a3b8; border: 1px solid #475569; white-space: nowrap;
    }
    .th-emp {
      padding: 5px 6px; text-align: center; font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
      background: #1e293b; color: white; border: 1px solid #334155;
    }
    .th-tot {
      padding: 4px 5px; text-align: center; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
      background: #0f3d1e; color: #4ade80; border: 1px solid #1a5c30;
    }

    /* ── STICKY LEFT COLS ── */
    .col-s0 { position: sticky; left: 0;     z-index: 2; }
    .col-s1 { position: sticky; left: 108px; z-index: 2; }
    .col-s2 { position: sticky; left: 220px; z-index: 2; box-shadow: 2px 0 4px rgba(0,0,0,.07); }
    .tabella-preordini tbody .col-s0,
    .tabella-preordini tbody .col-s1,
    .tabella-preordini tbody .col-s2 { background: #fff; }
    .tabella-preordini thead .col-s0,
    .tabella-preordini thead .col-s1,
    .tabella-preordini thead .col-s2 { z-index: 16; }

    /* ── STORICO CELLS ── */
    .td-stor { background: #f8fafc; text-align: center; color: #94a3b8; font-size: 12px; min-width: 44px; padding: 2px 3px; }
    .stor-row { display: flex; align-items: center; justify-content: center; gap: 3px; line-height: 1.4; }
    .stor-lbl { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; opacity: .7; flex-shrink: 0; }
    .stor-acq { font-size: 11px; font-weight: 700; color: #1e293b; }
    .stor-lbl-a { color: #64748b; }
    .stor-vnd { font-size: 11px; font-weight: 700; color: #16A34A; }
    .stor-lbl-v { color: #16A34A; }
    .stor-div { border-top: 1px solid #e2e8f0; margin: 1px 4px; }

    /* ── STORICO INPUT (resp_acquisti editable) ── */
    .stor-input {
      width: 38px; border: 1px solid #e2e8f0; border-radius: 5px; background: white;
      font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
      text-align: right; padding: 1px 4px; outline: none; color: #1e293b;
    }
    .stor-input:focus { border-color: #94a3b8; background: #f0f9ff; }
    .stor-input-v { color: #16A34A; }

    /* ── NOTE TOOLTIP ── */
    .nota-wrap { position: relative; display: inline-block; cursor: pointer; vertical-align: middle; }
    .nota-icon { font-size: 9px; margin-left: 2px; opacity: .5; }
    .nota-wrap:hover .nota-icon { opacity: 1; }
    .nota-tip {
      display: none; position: absolute; bottom: 100%; left: 0; z-index: 200;
      background: #1e293b; color: white; border-radius: 6px; pointer-events: none;
      padding: 7px 10px; font-size: 11px; white-space: pre-wrap; font-weight: 500;
      max-width: 240px; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,.35);
      line-height: 1.5; margin-bottom: 4px;
    }
    .nota-wrap:hover .nota-tip { display: block; }

    /* ── ORDER CELLS ── */
    .td-ord { background: #fff; text-align: center; min-width: 50px; }
    .td-ord.has-val { background: #f0fdf4; }
    .td-ord.inv-val { background: #fff7ed; }

    /* ── TOTALS ── */
    .td-tot-ord { background: #f0fdf4; color: #16A34A; font-weight: 700; min-width: 54px; text-align: right; font-size: 12px; padding: 2px 5px; }
    .td-tot-eur { background: #f0fdf4; color: #166534; font-weight: 700; min-width: 70px; text-align: right; font-size: 11px; padding: 2px 5px; }

    /* ── FORNITORE SEPARATOR ── */
    .tr-fornitore td {
      background: #1e293b; color: #fff; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 5px 10px; cursor: pointer; user-select: none;
    }
    .tr-fornitore:hover td { background: #263549; }

    /* ── SUBTOTAL ── */
    .tr-subtotal td { background: #f1f5f9; font-size: 10px; font-weight: 700; color: #475569; padding: 3px 6px; }
    .tr-archivio-sep td { background: #e2e8f0; font-size: 9px; font-weight: 700; color: #64748b; text-align: center; padding: 4px; text-transform: uppercase; letter-spacing: .06em; }
    .tr-archivio td { background: #f8fafc !important; opacity: .65; }

    /* ── TFOOT ── */
    .tabella-preordini tfoot td {
      background: #1e293b; color: white; font-weight: 700; font-size: 12px; padding: 5px 8px;
    }

    /* ── QUANTITY INPUT ── */
    .cella-qty {
      width: 46px; border: none; background: transparent;
      font-family: 'Nunito', sans-serif; text-align: center;
      padding: 2px 3px; outline: none; display: block; margin: 0 auto; cursor: text;
    }
    .cella-qty:focus { background: #eff6ff; border-radius: 2px; }
    .cella-ord { font-size: 13px; font-weight: 600; color: #1e293b; }
    .cella-ord:focus { outline: 2px solid #16A34A; outline-offset: -1px; }

    /* ── VALIDATION TOOLTIP ── */
    #qty-warn {
      position: fixed; z-index: 300; background: #1e293b; color: white;
      border-radius: 8px; padding: 10px 14px; font-size: 12px;
      font-family: 'Nunito', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.35);
      max-width: 290px; line-height: 1.5;
    }
    #qty-warn .warn-msg { color: #fbbf24; margin-bottom: 8px; font-weight: 600; font-size: 11px; }
    #qty-warn .warn-btns { display: flex; gap: 8px; }
    .btn-corr  { background: #16A34A; color: white; border: none; border-radius: 5px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-forza { background: #475569; color: #94a3b8; border: none; border-radius: 5px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }

    /* ── BUTTONS ── */
    .btn-tb {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: 1px solid #e2e8f0; background: white; color: #374151;
      white-space: nowrap; transition: all .12s; font-family: 'Nunito', sans-serif;
    }
    .btn-tb:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-tb:disabled { opacity: .38; cursor: not-allowed; pointer-events: none; }

    /* ── EMPORIO FILTER ── */
    .emp-filter-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .emp-cb-label {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; color: #374151;
      cursor: pointer; padding: 3px 8px; border-radius: 6px;
      border: 1px solid #e2e8f0; background: white; user-select: none;
    }
    .emp-cb-label:has(input:checked) { background: #1e293b; color: white; border-color: #1e293b; }
    .emp-cb-label input { display: none; }
    .emp-cb-label-on { background: #1e293b !important; color: white !important; border-color: #1e293b !important; }

    /* ── DEADLINE CHIP ── */
    .deadline-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    }
    .deadline-chip.urgente { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .deadline-chip.normale { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .deadline-chip.passata { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .deadline-chip.admin-edit { cursor: pointer; }
    .deadline-chip.admin-edit:hover { opacity: .8; }
    .deadline-chip.nessuna { background: #f8fafc; color: #94a3b8; border: 1.5px dashed #cbd5e1; cursor: pointer; }
    .deadline-chip.nessuna:hover { border-color: #64748b; color: #475569; }
    /* Inline date editor */
    #deadline-editor {
      display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    #deadline-date-input {
      height: 28px; border: 1.5px solid #fde68a; border-radius: 8px;
      padding: 0 8px; font-size: 11px; font-family: 'Nunito', sans-serif;
      background: #fffbeb; color: #1e293b; outline: none;
    }
    #deadline-date-input:focus { border-color: #d97706; }
    .deadline-save-btn {
      height: 28px; padding: 0 10px; border: none; border-radius: 8px;
      background: #1e293b; color: white; font-size: 11px; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .deadline-cancel-btn {
      height: 28px; padding: 0 8px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: white; color: #64748b; font-size: 11px; cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }

    /* ── RIEPILOGO ── */
    .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .summary-table th { background: #1e293b; color: #94a3b8; padding: 5px 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; text-align: left; letter-spacing: .05em; }
    .summary-table th.th-emp-head { text-align: center; border-left: 2px solid #334155; border-right: 2px solid #334155; }
    .summary-table th.th-sub { background: #263549; font-size: 8px; text-align: right; padding: 3px 8px; }
    .summary-table th.th-sub-pz { border-left: 2px solid #334155; }
    .summary-table th.th-sub-eur { border-right: 2px solid #334155; }
    .summary-table td { border-bottom: 1px solid #f1f5f9; padding: 4px 8px; }
    .summary-table td.td-emp-pz { text-align: right; border-left: 2px solid #e2e8f0; font-weight: 700; color: #1e293b; font-family: 'Nunito', monospace; }
    .summary-table td.td-emp-eur { text-align: right; border-right: 2px solid #e2e8f0; color: #64748b; font-size: 11px; font-family: 'Nunito', monospace; }
    .summary-table tr:hover td { background: #f8fafc; }

    /* ═══════════════════════════════════════
       HUB VIEW
    ═══════════════════════════════════════ */
    #hub-view { padding: 14px 14px 80px; }

    .sezione-card { margin-bottom: 14px; }

    .sezione-header {
      background: #1e293b; color: white;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 10px;
      cursor: pointer; user-select: none;
    }
    .sezione-header:hover { background: #263549; }
    .sezione-arrow { font-size: 11px; width: 14px; flex-shrink: 0; }
    .sezione-nome {
      font-size: 13px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .07em; flex: 1;
    }
    .sezione-btns { display: flex; gap: 5px; }
    .sezione-btns button {
      background: rgba(255,255,255,.15); border: none; color: white;
      border-radius: 5px; width: 26px; height: 26px; cursor: pointer;
      font-size: 11px; display: flex; align-items: center; justify-content: center;
    }
    .sezione-btns button:hover { background: rgba(255,255,255,.3); }
    .sezione-btns button.del:hover { background: rgba(220,38,38,.5); }

    .sezione-body { padding: 8px 2px 2px; }

    .campagna-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 13px 14px;
      margin-bottom: 8px; cursor: pointer;
      transition: border-color .12s, box-shadow .12s;
    }
    .campagna-row:hover { border-color: #334155; box-shadow: 0 2px 6px rgba(0,0,0,.07); }
    .campagna-icon { font-size: 20px; flex-shrink: 0; }
    .campagna-info { flex: 1; min-width: 0; }
    .campagna-nome { font-size: 14px; font-weight: 700; color: #1e293b; }
    .campagna-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .campagna-chevron { color: #94a3b8; font-size: 16px; flex-shrink: 0; margin-right: 2px; }
    .campagna-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .campagna-btns button {
      background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b;
      border-radius: 5px; width: 28px; height: 28px; cursor: pointer;
      font-size: 10px; display: flex; align-items: center; justify-content: center;
      transition: all .1s;
    }
    .campagna-btns button:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .campagna-btns button.del:hover { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
    .campagna-btns button.btn-cond-toggle { width: auto; padding: 0 10px; font-size: 12px; font-weight: 700; color: #0369a1; border-color: #bae6fd; background: #f0f9ff; gap: 4px; }
    .campagna-btns button.btn-cond-toggle:hover, .campagna-btns button.btn-cond-toggle.active { background: #0369a1; color: white; border-color: #0369a1; }
    .camp-cond {
      border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 8px 8px;
      background: #f8fafc; padding: 14px 16px; margin-top: -9px; margin-bottom: 8px;
    }
    .camp-cond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    @media (max-width: 520px) { .camp-cond-grid { grid-template-columns: 1fr; } }
    .camp-cond h4 { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
    .camp-cond-scag { border-collapse: collapse; font-size: 11px; width: 100%; }
    .camp-cond-scag td { padding: 2px 6px; color: #374151; }
    .camp-cond-scag td:first-child { color: #64748b; }
    .camp-cond-note { font-size: 12px; color: #374151; white-space: pre-wrap; min-height: 40px; }
    .camp-cond-note textarea { width: 100%; min-height: 60px; font-size: 12px; border: 1px solid #e2e8f0; border-radius: 5px; padding: 6px 8px; font-family: 'Nunito',sans-serif; resize: vertical; }
    .camp-allegati { margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
    .allegato-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #f1f5f9; }
    .allegato-row:last-child { border-bottom: none; }
    .allegato-nome { flex: 1; font-size: 12px; color: #1e293b; text-decoration: none; }
    .allegato-nome:hover { text-decoration: underline; }
    .allegato-del { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 13px; padding: 0 4px; }
    .allegato-del:hover { color: #dc2626; }
    .allegato-upload { display: none; }
    .btn-upload-allegato { font-size: 11px; background: #f1f5f9; border: 1px dashed #cbd5e1; color: #475569; border-radius: 6px; padding: 5px 10px; cursor: pointer; margin-top: 6px; }
    .btn-upload-allegato:hover { background: #e2e8f0; }

    .btn-add-sub {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding: 9px 14px;
      border: 1px dashed #cbd5e1; border-radius: 8px;
      background: transparent; color: #94a3b8;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all .12s; margin-top: 4px;
    }
    .btn-add-sub:hover { border-color: #1e293b; color: #1e293b; background: white; }

    /* ── ADMIN MODAL ── */
    #modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 10000; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    #modal-box {
      background: white; border-radius: 16px; padding: 24px;
      width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35);
      font-family: 'Nunito', sans-serif;
    }
    #modal-title { font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 16px; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label {
      display: block; font-size: 10px; font-weight: 800; color: #64748b;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px;
    }
    .modal-field input, .modal-field select {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: 'Nunito', sans-serif; outline: none;
      color: #1e293b; background: white;
    }

    #modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-modal-cancel {
      background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b;
      border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .btn-modal-save {
      background: #1e293b; color: white; border: none;
      border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .btn-modal-save:hover { background: #334155; }
    .btn-modal-save:disabled { opacity: .5; cursor: not-allowed; }


    /* ── FOTO NELLA COLONNA CODICE ── */
    .foto-cod-wrap { position: relative; width: 40px; height: 40px; flex-shrink: 0; background: white; border-radius: 5px; border: 1px solid #e2e8f0; }
    .foto-cod-thumb { width: 40px; height: 40px; object-fit: contain; border-radius: 5px; display: block; cursor: zoom-in; }
    .foto-cod-overlay {
      position: absolute; inset: 0; border-radius: 5px;
      background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s; cursor: pointer; font-size: 15px;
    }
    td.col-s0:hover .foto-cod-overlay { opacity: 1; }
    .foto-cod-add {
      width: 40px; height: 40px; flex-shrink: 0;
      border: 1.5px dashed #cbd5e1; border-radius: 5px;
      background: #f8fafc; color: #94a3b8; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-family: 'Nunito', sans-serif; padding: 0;
    }
    .foto-cod-add:hover { background: #e2e8f0; color: #475569; border-color: #94a3b8; }

    /* ── FOTO LIGHTBOX ── */
    #foto-lb-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }
    #foto-lb-box {
      background: white; border-radius: 16px; padding: 20px;
      width: min(480px, 96vw); box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }
    #foto-lb-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
    }
    #foto-lb-title { font-size: 13px; font-weight: 700; color: #1e293b; flex: 1; margin-right: 8px; }
    #foto-lb-close {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: #94a3b8; padding: 2px 6px; border-radius: 6px; line-height: 1;
    }
    #foto-lb-close:hover { background: #f1f5f9; color: #475569; }

    /* ── Main image container with crop dot ── */
    #foto-lb-img-wrap {
      position: relative; width: 100%; height: 240px;
      background: #f1f5f9; border-radius: 10px; border: 1px solid #e2e8f0;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      cursor: crosshair; margin-bottom: 4px;
    }
    #foto-lb-main {
      display: block; max-width: 100%; max-height: 240px; object-fit: contain;
      pointer-events: none;
    }
    #foto-crop-dot {
      position: absolute; width: 22px; height: 22px;
      border: 2.5px solid white; border-radius: 50%;
      box-shadow: 0 0 0 2px #3b82f6, 0 2px 8px rgba(0,0,0,.5);
      pointer-events: none; transform: translate(-50%, -50%);
      display: none; transition: left .1s, top .1s;
    }
    #foto-lb-hint {
      font-size: 10px; color: #94a3b8; text-align: center; margin-bottom: 14px;
    }

    #foto-lb-editor { }
    .foto-pos-row { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }

    /* ── Large preview ── */
    .foto-pos-preview-wrap { flex-shrink: 0; }
    .foto-pos-preview-label { font-size: 10px; font-weight: 700; color: #94a3b8; letter-spacing: .04em; margin-bottom: 5px; }
    .foto-pos-preview {
      width: 130px; height: 130px; overflow: hidden; border-radius: 10px;
      border: 2.5px solid #3b82f6; display: block;
    }
    #foto-lb-preview { width: 130px; height: 130px; object-fit: cover; display: block; }

    /* ── Sliders ── */
    .foto-pos-sliders { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

    .foto-pos-sliders label span { width: 16px; text-align: center; font-size: 13px; }
    .foto-pos-sliders input[type=range] { flex: 1; accent-color: #3b82f6; cursor: pointer; }
    .foto-pos-center-btn {
      align-self: flex-start; background: #f1f5f9; border: 1px solid #e2e8f0;
      border-radius: 6px; padding: 5px 10px; font-size: 10px; font-weight: 700;
      color: #475569; cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .foto-pos-center-btn:hover { background: #e2e8f0; }

    .foto-lb-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .foto-lb-upload-lbl {
      background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 7px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
      color: #374151; font-family: 'Nunito', sans-serif;
    }
    .foto-lb-upload-lbl:hover { background: #e2e8f0; }
    .foto-lb-save-btn {
      background: #1e293b; color: white; border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 11px; font-weight: 700; cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }
    .foto-lb-save-btn:hover { background: #334155; }

    /* ── SORT HEADERS ── */
    .th-sortable { cursor: pointer; user-select: none; }
    .th-sortable:hover { background: #eaf0f8; }
    .sort-arrow { margin-left: 3px; opacity: .5; font-size: 9px; }
    .sort-active .sort-arrow { opacity: 1; color: #1e293b; }

    /* ── ADMIN EDIT ICON ── */
    .admin-edit-btn {
      display: none; position: absolute; top: 1px; right: 1px;
      background: #e2e8f0; border: none; border-radius: 3px;
      padding: 1px 4px; font-size: 9px; cursor: pointer; color: #475569;
      font-family: 'Nunito', sans-serif; line-height: 1.4;
    }
    td.col-s0:hover .admin-edit-btn { display: inline-block; }

    /* ── PVP M361 EDITABLE ── */
    .pvp-m361-input {
      width: 66px; border: none; background: transparent;
      font-family: 'Nunito', sans-serif; text-align: right;
      padding: 2px 4px; outline: none; display: block; margin: 0 auto;
      font-size: 11px; color: #1e293b; cursor: text;
    }
    .pvp-m361-input:focus { background: #eff6ff; border-radius: 2px; outline: 2px solid #3b82f6; outline-offset: -1px; }

    .hidden { display: none !important; }

    @media print {
      .toolbar, #sconto-banner, #m361-header, #m361-nav { display: none !important; }
      body { padding: 0 !important; }
      .tabella-preordini thead { position: static; }
      .col-s0, .col-s1, .col-s2 { position: static; }
      .tabella-wrapper { max-height: none; overflow: visible; }
    }

</head>

// ── DYNAMIC TABLE HEIGHT ───────────────────────────────────────────────
// Imposta l'altezza di #table-view = spazio rimanente fino al fondo del viewport.
// Con flex: 1 a cascata su #table-wrap e .tabella-wrapper, lo scroll funziona.
function ajustTableHeight() {
  const tv = document.getElementById('table-view');
  if (!tv || tv.classList.contains('hidden')) return;
  tv.style.height = ''; // reset per rileggere la posizione reale
  const top = tv.getBoundingClientRect().top;
  const h   = window.innerHeight - top;
  if (h > 80) tv.style.height = h + 'px';
}
function ajustHubHeight() {
  const hv = document.getElementById('hub-view');
  if (!hv || hv.classList.contains('hidden')) return;
  hv.style.height = '';
  const top = hv.getBoundingClientRect().top;
  const h   = window.innerHeight - top;
  if (h > 80) hv.style.height = h + 'px';
}
function _scheduleAjust() {
  requestAnimationFrame(() => requestAnimationFrame(() => { ajustTableHeight(); ajustHubHeight(); }));
}
window.addEventListener('resize', () => { ajustTableHeight(); ajustHubHeight(); });
window.addEventListener('orientationchange', () => setTimeout(() => { ajustTableHeight(); ajustHubHeight(); }, 250));

// ── LOAD HUB ──────────────────────────────────────────────────────────
async function loadHub() {
  try {
    const [{ data: sez, error: e1 }, { data: camps, error: e2 }] = await Promise.all([
      DB.from('preordini_sezioni').select('*').order('ordine').order('nome'),
      DB.from('preordini_campagne').select('*').order('anno', { ascending: false }),
    ]);

    if (e1) throw new Error(e1.message);
    if (e2) throw new Error(e2.message);

    sezioni = sez || [];
    campagneAll = camps || [];
    sezioni.forEach(s => sezioniExpanded.add(s.id));

    renderHub();
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('hub-view').classList.remove('hidden');
    _scheduleAjust();
  } catch (err) {
    document.getElementById('loading-state').innerHTML =
      '<div style="font-size:13px;color:#dc2626">Errore caricamento: ' + err.message + '</div>';
  }
}

// ── RENDER HUB ────────────────────────────────────────────────────────
function renderHub() {
  const container = document.getElementById('sezioni-container');
  const empty     = document.getElementById('hub-empty');

  if (sezioni.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  let html = '';
  sezioni.forEach(sez => {
    const camps  = campagneAll.filter(c => c.sezione_id === sez.id);
    const isOpen = sezioniExpanded.has(sez.id);
    const arrow  = isOpen ? '▼' : '▶';

    html += '<div class="sezione-card" id="sez-card-' + sez.id + '">';

    // Header
    html += '<div class="sezione-header" onclick="toggleSezione(\'' + sez.id + '\')">';
    html += '<span class="sezione-arrow" id="sez-arrow-' + sez.id + '">' + arrow + '</span>';
    html += '<span class="sezione-nome">' + esc(sez.nome) + '</span>';
    if (_iAmAdmin) {
      html += '<div class="sezione-btns" onclick="event.stopPropagation()">';
      html += '<button title="Rinomina" onclick="openSezioneModal(\'' + sez.id + '\',\'' + esc(sez.nome) + '\')">✎</button>';
      html += '<button class="del" title="Elimina" onclick="deleteSezione(\'' + sez.id + '\',\'' + esc(sez.nome) + '\')">✕</button>';
      html += '</div>';
    }
    html += '</div>';

    // Body
    html += '<div class="sezione-body" id="sez-body-' + sez.id + '"' + (isOpen ? '' : ' style="display:none"') + '>';

    if (camps.length === 0) {
      html += '<div style="padding:8px 4px;font-size:12px;color:#94a3b8;font-style:italic">Nessun preordine</div>';
    } else {
      camps.forEach(camp => { html += renderCampagnaRow(camp); });
    }

    if (_iAmAdmin) {
      html += '<button class="btn-add-sub" onclick="openCampagnaModal(\'' + sez.id + '\')">+ Aggiungi preordine</button>';
    }

    html += '</div></div>';
  });

  container.innerHTML = html;
}

function renderCampagnaRow(camp) {
  const fmtD = d => new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
  let meta = String(camp.anno || '');
  if (camp.data_apertura && camp.scadenza) {
    meta += ' · ' + fmtD(camp.data_apertura) + ' – ' + fmtD(camp.scadenza);
  } else if (camp.scadenza) {
    meta += ' · scad. ' + fmtD(camp.scadenza);
  }
  if (camp.data_consegna) meta += ' · consegna ' + fmtD(camp.data_consegna) + (camp.data_consegna_fine ? ' – ' + fmtD(camp.data_consegna_fine) : '');
  if (camp.min_ordine) meta += ' · min €' + parseFloat(camp.min_ordine).toLocaleString('it-IT');

  const campDataJson = esc(JSON.stringify(camp));
  let html = '<div id="camp-card-' + camp.id + '">';
  html += '<div class="campagna-row" onclick="apriCampagna(\'' + camp.id + '\')">';
  html += '<div class="campagna-icon">📋</div>';
  html += '<div class="campagna-info">';
  html += '<div class="campagna-nome">' + esc(camp.nome) + '</div>';
  if (meta) html += '<div class="campagna-meta">' + esc(meta) + '</div>';
  html += '</div>';
  html += '<div class="campagna-chevron">›</div>';
  html += '<div class="campagna-btns" onclick="event.stopPropagation()">';
  html += '<button class="btn-cond-toggle" title="Condizioni commerciali &amp; allegati" onclick="toggleCond(\'' + camp.id + '\')" id="btn-cond-' + camp.id + '">Condizioni ▾</button>';
  if (_iAmAdmin) {
    html += '<button title="Modifica" onclick="openCampagnaModal(\'' + (camp.sezione_id||'') + '\',\'' + camp.id + '\')">✎</button>';
    html += '<button class="del" title="Elimina" onclick="deleteCampagna(\'' + camp.id + '\',\'' + esc(camp.nome) + '\')">✕</button>';
  }
  html += '</div>';
  html += '</div>';
  html += '<div class="camp-cond hidden" id="cond-' + camp.id + '" data-loaded="0" data-camp=\'' + campDataJson + '\'></div>';
  html += '</div>';
  return html;
}

// ── TOGGLE SEZIONE ────────────────────────────────────────────────────
function toggleSezione(sezId) {
  const body  = document.getElementById('sez-body-' + sezId);
  const arrow = document.getElementById('sez-arrow-' + sezId);
  if (!body) return;
  const isOpen = sezioniExpanded.has(sezId);
  if (isOpen) {
    sezioniExpanded.delete(sezId);
    body.style.display  = 'none';
    arrow.textContent   = '▶';
  } else {
    sezioniExpanded.add(sezId);
    body.style.display  = '';
    arrow.textContent   = '▼';
  }
}

// ── CONDIZIONI COMMERCIALI + ALLEGATI ─────────────────────────────────
async function toggleCond(campId) {
  const panel = document.getElementById('cond-' + campId);
  const btn   = document.getElementById('btn-cond-' + campId);
  if (!panel) return;
  const isOpen = !panel.classList.contains('hidden');
  if (isOpen) {
    panel.classList.add('hidden');
    if (btn) { btn.classList.remove('active'); btn.textContent = 'Condizioni ▾'; }
    return;
  }
  if (panel.dataset.loaded === '0') {
    const camp = JSON.parse(panel.dataset.camp || '{}');
    await renderCondPanel(campId, camp);
    panel.dataset.loaded = '1';
  }
  panel.classList.remove('hidden');
  if (btn) { btn.classList.add('active'); btn.textContent = 'Condizioni ▴'; }
}

async function renderCondPanel(campId, camp) {
  const panel = document.getElementById('cond-' + campId);
  if (!panel) return;
  const fmtD  = d => d ? new Date(d).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  const fmtEu = v => v != null ? '€ ' + parseFloat(v).toLocaleString('it-IT', { minimumFractionDigits: 0 }) : '';

  // ── SEZIONE DATE ──
  const dateRows = [
    ['Apertura preordini', fmtD(camp.data_apertura)],
    ['Chiusura preordini', fmtD(camp.scadenza)],
    ['Consegna prevista',  camp.data_consegna_fine
      ? fmtD(camp.data_consegna) + ' – ' + fmtD(camp.data_consegna_fine)
      : fmtD(camp.data_consegna)],
  ].filter(r => r[1] !== '—');
  let dateHtml = '';
  if (dateRows.length) {
    dateHtml = '<table class="camp-cond-scag"><tbody>' +
      dateRows.map(r => '<tr><td>' + r[0] + '</td><td style="font-weight:700;color:#1e293b">' + r[1] + '</td></tr>').join('') +
      '</tbody></table>';
  }

  // ── SEZIONE SCONTI ──
  let scagHtml = '';
  const tiers = (camp.scaglioni || []).filter(t => t.min || t.pct);
  if (tiers.length) {
    scagHtml = '<table class="camp-cond-scag" style="width:100%"><thead><tr>' +
      '<th style="text-align:left;font-size:9px;color:#94a3b8;font-weight:700;padding:2px 6px;text-transform:uppercase">Importo ordine</th>' +
      '<th style="text-align:right;font-size:9px;color:#94a3b8;font-weight:700;padding:2px 6px;text-transform:uppercase">Sconto</th>' +
      '</tr></thead><tbody>';
    tiers.forEach((t, i) => {
      const next = tiers[i + 1];
      const label = next ? 'Da ' + fmtEu(t.min) + ' a ' + fmtEu(next.min - 1) : 'Oltre ' + fmtEu(t.min);
      scagHtml += '<tr><td>' + label + '</td><td style="text-align:right;font-weight:800;color:#16a34a;font-size:13px">' + t.pct + '%</td></tr>';
    });
    scagHtml += '</tbody></table>';
  } else {
    scagHtml = '<span style="font-size:11px;color:#94a3b8;font-style:italic">Nessuno scaglione definito</span>';
  }
  if (camp.min_ordine) {
    scagHtml += '<div style="margin-top:6px;font-size:11px;color:#475569;background:#fef9c3;border-radius:5px;padding:4px 8px">Minimo ordine: <strong>' + fmtEu(camp.min_ordine) + '</strong></div>';
  }
  if (camp.regola_collo) {
    scagHtml += '<div style="margin-top:6px;font-size:11px;color:#92400e;background:#fef3c7;border-radius:5px;padding:4px 8px">⚠ Regola collo: per ottenere lo sconto ogni referenza deve essere ordinata in quantità ≥ 1 collo.</div>';
  }

  // ── SOGLIE CATEGORIA ──
  let soglieHtml = '';
  const soglie = camp.soglie_categoria || [];
  if (soglie.length) {
    soglieHtml = '<table class="camp-cond-scag" style="width:100%"><thead><tr>' +
      '<th style="text-align:left;font-size:9px;color:#94a3b8;font-weight:700;padding:2px 6px;text-transform:uppercase">Categoria</th>' +
      '<th style="text-align:right;font-size:9px;color:#94a3b8;font-weight:700;padding:2px 6px;text-transform:uppercase">Min €</th>' +
      '</tr></thead><tbody>';
    soglie.forEach(s => {
      soglieHtml += '<tr><td>' + esc(s.label || s.categoria || '—') + (s.categoria && s.label ? ' <span style="font-size:10px;color:#94a3b8">(' + esc(s.categoria) + ')</span>' : '') + '</td>' +
        '<td style="text-align:right;font-weight:700;color:#0369a1">' + fmtEu(s.importo_min) + '</td></tr>';
    });
    soglieHtml += '</tbody></table>';
  }

  // ── NOTE COMMERCIALI ──
  const note = camp.note_commerciali || '';
  const noteHtml = _iAmAdmin
    ? '<textarea id="note-' + campId + '" class="camp-cond-note" onblur="saveNoteCommerciali(\'' + campId + '\')" placeholder="Condizioni di pagamento, rimborsi spedizione, premi fedeltà…">' + esc(note) + '</textarea>'
    : (note ? '<div class="camp-cond-note">' + esc(note) + '</div>' : '<span style="font-size:11px;color:#94a3b8;font-style:italic">Nessuna nota</span>');

  // ── ALLEGATI ──
  const { data: allegati } = await DB.from('preordini_allegati').select('*').eq('campagna_id', campId).order('created_at');
  let allegHtml = '';
  (allegati || []).forEach(a => {
    const ext  = (a.nome || '').split('.').pop().toLowerCase();
    const icon = ext === 'pdf' ? '📄' : ['jpg','jpeg','png','webp'].includes(ext) ? '🖼' : '📎';
    const dim  = a.dimensione > 1048576 ? (a.dimensione/1048576).toFixed(1) + ' MB' : Math.round(a.dimensione/1024) + ' KB';
    allegHtml += '<div class="allegato-row">';
    allegHtml += '<a class="allegato-nome" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + icon + ' ' + esc(a.nome) + '</a>';
    if (a.dimensione) allegHtml += '<span style="font-size:10px;color:#94a3b8">' + dim + '</span>';
    if (_iAmAdmin) allegHtml += '<button class="allegato-del" onclick="deleteAllegato(\'' + a.id + '\',\'' + esc(a.storage_path || '') + '\',\'' + campId + '\')" title="Elimina">✕</button>';
    allegHtml += '</div>';
  });
  if (_iAmAdmin) {
    allegHtml += '<input type="file" id="upload-' + campId + '" class="allegato-upload" multiple onchange="uploadAllegato(\'' + campId + '\',this)">';
    allegHtml += '<button class="btn-upload-allegato" onclick="document.getElementById(\'upload-' + campId + '\').click()">+ Allega file</button>';
  }
  if (!allegHtml && !_iAmAdmin) allegHtml = '<span style="font-size:11px;color:#94a3b8;font-style:italic">Nessun allegato</span>';

  panel.innerHTML =
    '<div class="camp-cond-grid">' +
      (dateHtml ? '<div><h4>Date</h4>' + dateHtml + '</div>' : '') +
      '<div><h4>Scaglioni sconto</h4>' + scagHtml + '</div>' +
      (soglieHtml ? '<div><h4>Soglie categoria</h4>' + soglieHtml + '</div>' : '') +
    '</div>' +
    '<div class="camp-allegati"><h4>Allegati (' + (allegati?.length || 0) + ')</h4><div id="allegati-list-' + campId + '">' + allegHtml + '</div></div>';
}

async function saveNoteCommerciali(campId) {
  const ta = document.getElementById('note-' + campId);
  if (!ta) return;
  await DB.from('preordini_campagne').update({ note_commerciali: ta.value || null }).eq('id', campId);
}

async function uploadAllegato(campId, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const listEl = document.getElementById('allegati-list-' + campId);
  for (const file of files) {
    const path = campId + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const { error: upErr } = await DB.storage.from('preordini-allegati').upload(path, file, { upsert: false });
    if (upErr) {
      if (upErr.message.includes('Bucket not found') || upErr.message.includes('bucket')) {
        alert('Bucket storage non trovato.\n\nEsegui in Supabase SQL Editor:\nINSERT INTO storage.buckets (id, name, public) VALUES (\'preordini-allegati\', \'preordini-allegati\', true) ON CONFLICT (id) DO NOTHING;\n\nPoi aggiungi le policy per storage.objects (vedi istruzioni).');
      } else {
        alert('Errore upload: ' + upErr.message);
      }
      continue;
    }
    const { data: urlData } = DB.storage.from('preordini-allegati').getPublicUrl(path);
    const url = urlData?.publicUrl || '';
    const { error: dbErr } = await DB.from('preordini_allegati').insert({
      campagna_id: campId, nome: file.name, url, storage_path: path, tipo_mime: file.type, dimensione: file.size
    });
    if (dbErr) { alert('Errore salvataggio allegato: ' + dbErr.message); continue; }
  }
  input.value = '';
  // Reload list
  const camp = JSON.parse(document.getElementById('cond-' + campId)?.dataset.camp || '{}');
  await renderCondPanel(campId, camp);
}

async function deleteAllegato(allegatoId, storagePath, campId) {
  if (!confirm('Eliminare questo allegato?')) return;
  if (storagePath) await DB.storage.from('preordini-allegati').remove([storagePath]);
  await DB.from('preordini_allegati').delete().eq('id', allegatoId);
  const camp = JSON.parse(document.getElementById('cond-' + campId)?.dataset.camp || '{}');
  await renderCondPanel(campId, camp);

// ── SORT + FILTER STATE ────────────────────────────────────────────────
let sortRigheBy  = null;   // 'codice' | 'prodotto' | 'categoria' | 'pvp_corrente' | 'pvp_consigliato' | 'pvp_m361'
let sortRigheDir = 1;      // 1=asc, -1=desc
let filtroTesto     = '';
let filtroCategoria = '';
const ALL_STOR_ANNI = [2026, 2025, 2024];
let filtroAnniStor  = new Set(ALL_STOR_ANNI);
let mostraStoricoProd = false;
let righeArchiviati   = [];

const SORT_NUMERIC = new Set(['pvp_corrente', 'pvp_consigliato', 'pvp_m361']);

function sortTabella(col) {
  if (sortRigheBy === col) { sortRigheDir *= -1; }
  else { sortRigheBy = col; sortRigheDir = 1; }
  renderTable();
}

function onFiltroTesto(val) {
  filtroTesto = val.trim().toLowerCase();
  _aggiornaResetBtn();
  renderTable();
}

function onFiltroCat(val) {
  filtroCategoria = val;
  _aggiornaResetBtn();
  renderTable();
}

function resetFiltri() {
  filtroTesto = ''; filtroCategoria = '';
  sortRigheBy = null; sortRigheDir = 1;
  const ft = document.getElementById('filtro-testo');
  const fc = document.getElementById('filtro-cat');
  if (ft) ft.value = '';
  if (fc) fc.value = '';
  _aggiornaResetBtn();
  renderTable();
}

function _aggiornaResetBtn() {
  const btn = document.getElementById('filtri-reset');
  if (btn) btn.classList.toggle('hidden', !filtroTesto && !filtroCategoria);
}

async function toggleStoricoProd() {
  mostraStoricoProd = !mostraStoricoProd;
  const btn = document.getElementById('btn-storico-prod');
  if (btn) btn.classList.toggle('emp-cb-label-on', mostraStoricoProd);
  if (mostraStoricoProd && righeArchiviati.length === 0) await loadRigheArchiviati();
  renderTable();
}

async function loadRigheArchiviati() {
  if (!campagna) return;
  const codiciAttuali = new Set(righe.map(r => r.codice));
  const { data } = await DB.from('preordini_righe')
    .select('codice,prodotto,categoria,fornitore,conf,pvp_corrente,pvp_consigliato,pvp_m361')
    .neq('campagna_id', campagna.id)
    .order('codice');
  if (!data) return;
  const seen = new Set();
  righeArchiviati = [];
  for (const r of data) {
    if (!codiciAttuali.has(r.codice) && !seen.has(r.codice)) {
      seen.add(r.codice);
      righeArchiviati.push({ ...r, id: 'arch_' + r.codice, _archivio: true });
    }
  }
}

function toggleAnnoStor(anno) {
  if (filtroAnniStor.has(anno)) {
    if (filtroAnniStor.size > 1) filtroAnniStor.delete(anno);
  } else {
    filtroAnniStor.add(anno);
  }
  _updateAnniPills();
  renderTable();
}

function _updateAnniPills() {
  ALL_STOR_ANNI.forEach(y => {
    const el = document.getElementById('stor-pill-' + y);
    if (!el) return;
    el.classList.toggle('emp-cb-label-on', filtroAnniStor.has(y));
  });
}

function buildFiltriBar() {
  const sel = document.getElementById('filtro-cat');
  if (!sel) return;
  const cats = [...new Set(righe.map(r => r.categoria || '').filter(Boolean))].sort();
  const prev = sel.value;
  sel.innerHTML = '<option value="">Tutte le categorie</option>' +
    cats.map(c => '<option value="' + esc(c) + '"' + (c === prev ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
  // Anni storico pills
  const wrap = document.getElementById('anni-stor-filter');
  if (wrap && !wrap.dataset.built) {
    wrap.dataset.built = '1';
    ALL_STOR_ANNI.forEach(y => {
      const btn = document.createElement('button');
      btn.id = 'stor-pill-' + y;
      btn.className = 'emp-cb-label emp-cb-label-on';
      btn.textContent = '\'' + String(y).slice(2);
      btn.onclick = () => toggleAnnoStor(y);
      wrap.appendChild(btn);
    });
  }
  document.getElementById('filtri-bar').classList.remove('hidden');
  _scheduleAjust();
}

// ── PVP INPUT FOCUS/BLUR ───────────────────────────────────────────────
function pvpFocus(el) {
  const v = parseFloat(el.dataset.raw);
  el.value = (!isNaN(v) && v > 0) ? String(v) : '';
  el.select();
}
function pvpBlur(el) {
  const v = parseFloat((el.value || '').replace(',', '.'));
  el.value = (!isNaN(v) && v > 0) ? fmtEuro(v) : '';
}

// ── PVP M361 SAVE ──────────────────────────────────────────────────────
const pvpM361Timers = {};
function onPvpM361(rigaId, input) {
  clearTimeout(pvpM361Timers[rigaId]);
  pvpM361Timers[rigaId] = setTimeout(async () => {
    const val = input.value.trim() ? parseFloat(input.value.replace(',','.')) : null;
    const { error } = await DB.from('preordini_righe').update({ pvp_m361: val }).eq('id', rigaId);
    if (!error) {
      const r = righe.find(x => x.id === rigaId);
      if (r) r.pvp_m361 = val;
      input.dataset.raw = val != null ? val : '';
    }
  }, 700);
}

const pvpConsTimers = {};
function onPvpCons(rigaId, input) {
  clearTimeout(pvpConsTimers[rigaId]);
  pvpConsTimers[rigaId] = setTimeout(async () => {
    const val = input.value.trim() ? parseFloat(input.value.replace(',','.')) : null;
    const { error } = await DB.from('preordini_righe').update({ pvp_consigliato: val }).eq('id', rigaId);
    if (!error) {
      const r = righe.find(x => x.id === rigaId);
      if (r) r.pvp_consigliato = val;
      input.dataset.raw = val != null ? val : '';
    }
  }, 700);
}

async function eliminaRiga(rigaId) {
  if (!confirm('Eliminare questo prodotto dal preordine?')) return;

// ── FOTO DB ────────────────────────────────────────────────────────────
async function loadFotoDB() {
  const { data } = await DB.from('preordini_foto').select('codice,data_b64,pos_x,pos_y');
  if (data) data.forEach(r => { fotoDB[r.codice] = r; });
}

function getFotoSrc(codice) {
  return fotoDB[codice]?.data_b64 || FOTO_PRODOTTI[codice] || null;
}

function getFotoPos(codice) {
  if (fotoDB[codice]) return { x: fotoDB[codice].pos_x ?? 50, y: fotoDB[codice].pos_y ?? 50 };
  return { x: 50, y: 50 };
}

function apriLightboxFoto(codice, nome) {
  const src = getFotoSrc(codice);
  if (!src && !_iAmAdmin) return;
  _lbCodice = codice;
  document.getElementById('foto-lb-title').textContent = nome || codice;
  const lbImg = document.getElementById('foto-lb-main');
  if (src) { lbImg.src = src; lbImg.style.display = 'block'; }
  else      { lbImg.src = ''; lbImg.style.display = 'none'; }
  document.getElementById('foto-crop-dot').style.display = 'none';
  if (_iAmAdmin) {
    const pos = getFotoPos(codice);
    document.getElementById('foto-pos-x').value = pos.x;
    document.getElementById('foto-pos-y').value = pos.y;
    const prev = document.getElementById('foto-lb-preview');
    if (src) {
      prev.src = src;
      prev.style.objectPosition = pos.x + '% ' + pos.y + '%';
      // Update dot after image loads
      if (lbImg.complete && lbImg.naturalWidth) { _aggiornaCropDot(pos.x, pos.y); }
      else { lbImg.onload = () => _aggiornaCropDot(pos.x, pos.y); }
    } else { prev.src = ''; }
    document.getElementById('foto-lb-editor').classList.remove('hidden');
  } else {
    document.getElementById('foto-lb-editor').classList.add('hidden');
  }
  document.getElementById('foto-lb-bg').classList.remove('hidden');
}

function chiudiFotoLb() {
  document.getElementById('foto-lb-bg').classList.add('hidden');
  _lbCodice = null;
}

function aggiornaFotoPos() {
  const x = document.getElementById('foto-pos-x').value;
  const y = document.getElementById('foto-pos-y').value;
  document.getElementById('foto-lb-preview').style.objectPosition = x + '% ' + y + '%';
  _aggiornaCropDot(x, y);
}

function centraCrop() {
  document.getElementById('foto-pos-x').value = 50;
  document.getElementById('foto-pos-y').value = 50;
  aggiornaFotoPos();
}

function _aggiornaCropDot(x, y) {
  const img  = document.getElementById('foto-lb-main');
  const dot  = document.getElementById('foto-crop-dot');
  const wrap = document.getElementById('foto-lb-img-wrap');
  if (!img.naturalWidth || !img.src) { dot.style.display = 'none'; return; }

  const wW = wrap.offsetWidth, wH = wrap.offsetHeight;
  const natRatio = img.naturalWidth / img.naturalHeight;
  const conRatio = wW / wH;
  let iW, iH, iX, iY;
  if (natRatio > conRatio) { iW = wW; iH = wW / natRatio; iX = 0; iY = (wH - iH) / 2; }
  else                     { iH = wH; iW = wH * natRatio; iX = (wW - iW) / 2; iY = 0; }

  dot.style.left = (iX + iW * x / 100) + 'px';
  dot.style.top  = (iY + iH * y / 100) + 'px';
  dot.style.display = 'block';
}

function onFotoLbImgClick(e) {
  if (!_iAmAdmin) return;
  const img  = document.getElementById('foto-lb-main');
  if (!img.naturalWidth) return;
  const wrap = document.getElementById('foto-lb-img-wrap');
  const wRect = wrap.getBoundingClientRect();
  const wW = wRect.width, wH = wRect.height;
  const natRatio = img.naturalWidth / img.naturalHeight;
  const conRatio = wW / wH;
  let iW, iH, iX, iY;
  if (natRatio > conRatio) { iW = wW; iH = wW / natRatio; iX = 0; iY = (wH - iH) / 2; }
  else                     { iH = wH; iW = wH * natRatio; iX = (wW - iW) / 2; iY = 0; }

  const clickX = e.clientX - wRect.left - iX;
  const clickY = e.clientY - wRect.top  - iY;
  const pctX = Math.round(Math.max(0, Math.min(100, clickX / iW * 100)));
  const pctY = Math.round(Math.max(0, Math.min(100, clickY / iH * 100)));

  document.getElementById('foto-pos-x').value = pctX;
  document.getElementById('foto-pos-y').value = pctY;
  aggiornaFotoPos();
}

async function salvaFotoPos() {
  if (!_lbCodice) return;
  const x   = parseInt(document.getElementById('foto-pos-x').value);
  const y   = parseInt(document.getElementById('foto-pos-y').value);
  const src = getFotoSrc(_lbCodice);
  if (!src) { alert('Carica prima una foto'); return; }
  const { error } = await DB.from('preordini_foto')
    .upsert({ codice: _lbCodice, data_b64: src, pos_x: x, pos_y: y }, { onConflict: 'codice' });
  if (error) { alert('Errore: ' + error.message); return; }
  if (!fotoDB[_lbCodice]) fotoDB[_lbCodice] = {};
  fotoDB[_lbCodice].data_b64 = src;
  fotoDB[_lbCodice].pos_x = x;
  fotoDB[_lbCodice].pos_y = y;
  chiudiFotoLb();
}

function onFotoUpload(input) {
  const file = input.files[0];
  if (!file || !_lbCodice) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
        else        { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.88);
      const lbImg = document.getElementById('foto-lb-main');
      lbImg.onload = () => { const x2 = parseInt(document.getElementById('foto-pos-x').value); const y2 = parseInt(document.getElementById('foto-pos-y').value); _aggiornaCropDot(x2, y2); };
      lbImg.src = b64; lbImg.style.display = 'block';
      const prev = document.getElementById('foto-lb-preview');
      prev.src = b64;
      const x = parseInt(document.getElementById('foto-pos-x').value);
      const y = parseInt(document.getElementById('foto-pos-y').value);
      prev.style.objectPosition = x + '% ' + y + '%';
      const { error } = await DB.from('preordini_foto')
        .upsert({ codice: _lbCodice, data_b64: b64, pos_x: x, pos_y: y }, { onConflict: 'codice' });
      if (error) { alert('Errore: ' + error.message); return; }
      if (!fotoDB[_lbCodice]) fotoDB[_lbCodice] = {};
      fotoDB[_lbCodice].data_b64 = b64;
      fotoDB[_lbCodice].pos_x = x;
      fotoDB[_lbCodice].pos_y = y;
      // Aggiorna tutti i thumbnail in tabella (ricarica la riga)
      document.querySelectorAll('.foto-cod-thumb[data-codice="' + _lbCodice + '"]').forEach(el => {
        el.src = b64; el.style.objectPosition = x + '% ' + y + '%';
      });
      document.querySelectorAll('.foto-cod-add[data-codice="' + _lbCodice + '"]').forEach(btn => {
        const wrap = btn.parentElement;
        const nome = btn.dataset.nome || '';
        btn.outerHTML = '<div class="foto-cod-wrap" data-codice="' + _lbCodice + '" data-nome="' + nome + '">'
          + '<img src="' + b64 + '" class="foto-cod-thumb" data-codice="' + _lbCodice + '" style="object-position:' + x + '% ' + y + '%" ondblclick="apriLightboxFoto(this.dataset.codice,this.title)" title="' + nome + '">'
          + '<div class="foto-cod-overlay" data-codice="' + _lbCodice + '" data-nome="' + nome + '" onclick="apriLightboxFoto(this.dataset.codice,this.dataset.nome)" title="Modifica foto">📷</div>'
          + '</div>';
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
