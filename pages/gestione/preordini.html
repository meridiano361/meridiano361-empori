<!DOCTYPE html>
<html lang="it">
<head>
  <link rel="icon" href="/faviconm361.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Preordini</title>
  <link rel="stylesheet" href="../../assets/style/nav-style.css">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #f8fafc; }

    /* ── SAVE BADGE ── */
    #save-badge {
      position: fixed; top: 64px; right: 14px; z-index: 50;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
      font-family: 'Nunito', sans-serif; pointer-events: none; display: none;
    }
    #save-badge.saving { display: block; background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    #save-badge.saved  { display: block; background: #f0fdf4; color: #16A34A; border: 1px solid #bbf7d0; }
    #save-badge.err    { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    /* ── TOOLBAR ── */
    .toolbar {
      position: sticky; top: 56px; z-index: 20;
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 8px 14px; display: flex; align-items: center;
      gap: 8px; flex-wrap: wrap; box-shadow: 0 1px 3px rgba(0,0,0,.04);
      min-height: 52px;
    }

    /* ── SCONTO BANNER ── */
    #sconto-banner {
      position: sticky; top: calc(56px + 52px); z-index: 19;
      background: #f8fafc; border-bottom: 1px solid #e2e8f0;
      padding: 6px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 11px; font-family: 'Nunito', sans-serif;
    }
    #sconto-banner.hidden { display: none; }
    .sconto-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: white; border: 1px solid #e2e8f0; border-radius: 20px;
      padding: 3px 10px; font-size: 11px; font-weight: 600; color: #374151;
    }
    .sconto-chip .sc-emp  { font-weight: 800; color: #1e293b; }
    .sconto-chip .sc-euro { color: #64748b; }
    .sconto-chip .sc-pct  { color: #16A34A; font-weight: 800; }
    .sconto-chip .sc-pct.nosconto { color: #94a3b8; }

    /* ── TABLE WRAPPER ── */
    .tabella-wrapper {
      overflow-x: auto; overflow-y: auto;
      max-height: calc(100vh - 160px);
      -webkit-overflow-scrolling: touch; padding-bottom: 80px;
    }

    /* ── TABLE ── */
    .tabella-preordini { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tabella-preordini thead { position: sticky; top: 0; z-index: 15; }
    .tabella-preordini td { padding: 2px 3px; border: 1px solid #e2e8f0; vertical-align: middle; }

    /* ── HEADER ── */
    .th-info {
      background: #f8fafc; color: #475569; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; padding: 5px 6px;
      text-align: left; border: 1px solid #e2e8f0;
    }
    .th-stor {
      padding: 4px 5px; text-align: center; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
      background: #334155; color: #94a3b8; border: 1px solid #475569;
    }
    .th-stor-year {
      padding: 3px 4px; text-align: center; font-size: 8px; font-weight: 700;
      background: #475569; color: #94a3b8; border: 1px solid #475569; white-space: nowrap;
    }
    .th-emp {
      padding: 5px 6px; text-align: center; font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
      background: #1e293b; color: white; border: 1px solid #334155;
    }
    .th-tot {
      padding: 4px 5px; text-align: center; font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
      background: #0f3d1e; color: #4ade80; border: 1px solid #1a5c30;
    }

    /* ── STICKY LEFT COLS ── */
    .col-s0 { position: sticky; left: 0;     z-index: 2; }
    .col-s1 { position: sticky; left: 71px;  z-index: 2; }
    .col-s2 { position: sticky; left: 183px; z-index: 2; box-shadow: 2px 0 4px rgba(0,0,0,.07); }
    .tabella-preordini tbody .col-s0,
    .tabella-preordini tbody .col-s1,
    .tabella-preordini tbody .col-s2 { background: #fff; }
    .tabella-preordini thead .col-s0,
    .tabella-preordini thead .col-s1,
    .tabella-preordini thead .col-s2 { z-index: 16; }

    /* ── STORICO CELLS ── */
    .td-stor { background: #f8fafc; text-align: center; color: #94a3b8; font-size: 12px; min-width: 44px; padding: 2px 3px; }
    .stor-row { display: flex; align-items: center; justify-content: center; gap: 3px; line-height: 1.4; }
    .stor-lbl { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; opacity: .7; flex-shrink: 0; }
    .stor-acq { font-size: 11px; font-weight: 700; color: #1e293b; }
    .stor-lbl-a { color: #64748b; }
    .stor-vnd { font-size: 11px; font-weight: 700; color: #16A34A; }
    .stor-lbl-v { color: #16A34A; }
    .stor-div { border-top: 1px solid #e2e8f0; margin: 1px 4px; }

    /* ── NOTE TOOLTIP ── */
    .nota-wrap { position: relative; display: inline-block; cursor: pointer; vertical-align: middle; }
    .nota-icon { font-size: 9px; margin-left: 2px; opacity: .5; }
    .nota-wrap:hover .nota-icon { opacity: 1; }
    .nota-tip {
      display: none; position: absolute; bottom: 100%; left: 0; z-index: 200;
      background: #1e293b; color: white; border-radius: 6px; pointer-events: none;
      padding: 7px 10px; font-size: 11px; white-space: pre-wrap; font-weight: 500;
      max-width: 240px; min-width: 120px; box-shadow: 0 4px 16px rgba(0,0,0,.35);
      line-height: 1.5; margin-bottom: 4px;
    }
    .nota-wrap:hover .nota-tip { display: block; }

    /* ── ORDER CELLS ── */
    .td-ord { background: #fff; text-align: center; min-width: 50px; }
    .td-ord.has-val { background: #f0fdf4; }
    .td-ord.inv-val { background: #fff7ed; }

    /* ── TOTALS ── */
    .td-tot-ord { background: #f0fdf4; color: #16A34A; font-weight: 700; min-width: 54px; text-align: right; font-size: 12px; padding: 2px 5px; }
    .td-tot-eur { background: #f0fdf4; color: #166534; font-weight: 700; min-width: 70px; text-align: right; font-size: 11px; padding: 2px 5px; }

    /* ── FORNITORE SEPARATOR ── */
    .tr-fornitore td {
      background: #1e293b; color: #fff; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      padding: 5px 10px; cursor: pointer; user-select: none;
    }
    .tr-fornitore:hover td { background: #263549; }

    /* ── SUBTOTAL ── */
    .tr-subtotal td { background: #f1f5f9; font-size: 10px; font-weight: 700; color: #475569; padding: 3px 6px; }

    /* ── TFOOT ── */
    .tabella-preordini tfoot td {
      background: #1e293b; color: white; font-weight: 700; font-size: 12px; padding: 5px 8px;
    }

    /* ── QUANTITY INPUT ── */
    .cella-qty {
      width: 46px; border: none; background: transparent;
      font-family: 'Nunito', sans-serif; text-align: center;
      padding: 2px 3px; outline: none; display: block; margin: 0 auto; cursor: text;
    }
    .cella-qty:focus { background: #eff6ff; border-radius: 2px; }
    .cella-ord { font-size: 13px; font-weight: 600; color: #1e293b; }
    .cella-ord:focus { outline: 2px solid #16A34A; outline-offset: -1px; }

    /* ── VALIDATION TOOLTIP ── */
    #qty-warn {
      position: fixed; z-index: 300; background: #1e293b; color: white;
      border-radius: 8px; padding: 10px 14px; font-size: 12px;
      font-family: 'Nunito', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.35);
      max-width: 290px; line-height: 1.5;
    }
    #qty-warn .warn-msg { color: #fbbf24; margin-bottom: 8px; font-weight: 600; font-size: 11px; }
    #qty-warn .warn-btns { display: flex; gap: 8px; }
    .btn-corr  { background: #16A34A; color: white; border: none; border-radius: 5px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-forza { background: #475569; color: #94a3b8; border: none; border-radius: 5px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer; }

    /* ── BUTTONS ── */
    .btn-tb {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: 1px solid #e2e8f0; background: white; color: #374151;
      white-space: nowrap; transition: all .12s; font-family: 'Nunito', sans-serif;
    }
    .btn-tb:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-tb:disabled { opacity: .38; cursor: not-allowed; pointer-events: none; }

    /* ── EMPORIO FILTER ── */
    .emp-filter-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .emp-cb-label {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; color: #374151;
      cursor: pointer; padding: 3px 8px; border-radius: 6px;
      border: 1px solid #e2e8f0; background: white; user-select: none;
    }
    .emp-cb-label:has(input:checked) { background: #1e293b; color: white; border-color: #1e293b; }
    .emp-cb-label input { display: none; }

    /* ── DEADLINE CHIP ── */
    .deadline-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    }
    .deadline-chip.urgente { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .deadline-chip.normale { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
    .deadline-chip.passata { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }

    /* ── RIEPILOGO ── */
    .summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .summary-table th { background: #1e293b; color: #94a3b8; padding: 6px 10px; font-size: 9px; font-weight: 800; text-transform: uppercase; text-align: left; letter-spacing: .05em; }
    .summary-table td { border-bottom: 1px solid #f1f5f9; padding: 5px 10px; }
    .summary-table tr:hover td { background: #f8fafc; }

    /* ═══════════════════════════════════════
       HUB VIEW
    ═══════════════════════════════════════ */
    #hub-view { padding: 14px 14px 80px; }

    .sezione-card { margin-bottom: 14px; }

    .sezione-header {
      background: #1e293b; color: white;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 10px;
      cursor: pointer; user-select: none;
    }
    .sezione-header:hover { background: #263549; }
    .sezione-arrow { font-size: 11px; width: 14px; flex-shrink: 0; }
    .sezione-nome {
      font-size: 13px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .07em; flex: 1;
    }
    .sezione-btns { display: flex; gap: 5px; }
    .sezione-btns button {
      background: rgba(255,255,255,.15); border: none; color: white;
      border-radius: 5px; width: 26px; height: 26px; cursor: pointer;
      font-size: 11px; display: flex; align-items: center; justify-content: center;
    }
    .sezione-btns button:hover { background: rgba(255,255,255,.3); }
    .sezione-btns button.del:hover { background: rgba(220,38,38,.5); }

    .sezione-body { padding: 8px 2px 2px; }

    .campagna-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 13px 14px;
      margin-bottom: 8px; cursor: pointer;
      transition: border-color .12s, box-shadow .12s;
    }
    .campagna-row:hover { border-color: #334155; box-shadow: 0 2px 6px rgba(0,0,0,.07); }
    .campagna-icon { font-size: 20px; flex-shrink: 0; }
    .campagna-info { flex: 1; min-width: 0; }
    .campagna-nome { font-size: 14px; font-weight: 700; color: #1e293b; }
    .campagna-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .campagna-chevron { color: #94a3b8; font-size: 16px; flex-shrink: 0; margin-right: 2px; }
    .campagna-btns { display: flex; gap: 5px; flex-shrink: 0; }
    .campagna-btns button {
      background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b;
      border-radius: 5px; width: 28px; height: 28px; cursor: pointer;
      font-size: 10px; display: flex; align-items: center; justify-content: center;
      transition: all .1s;
    }
    .campagna-btns button:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .campagna-btns button.del:hover { background: #fef2f2; border-color: #fecaca; color: #dc2626; }

    .btn-add-sub {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding: 9px 14px;
      border: 1px dashed #cbd5e1; border-radius: 8px;
      background: transparent; color: #94a3b8;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: all .12s; margin-top: 4px;
    }
    .btn-add-sub:hover { border-color: #1e293b; color: #1e293b; background: white; }

    /* ── ADMIN MODAL ── */
    #modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 10000; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    #modal-box {
      background: white; border-radius: 16px; padding: 24px;
      width: min(440px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35);
      font-family: 'Nunito', sans-serif;
    }
    #modal-title { font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 16px; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label {
      display: block; font-size: 10px; font-weight: 800; color: #64748b;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px;
    }
    .modal-field input, .modal-field select {
      width: 100%; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: 'Nunito', sans-serif; outline: none;
      color: #1e293b; background: white;
    }
    .modal-field input:focus, .modal-field select:focus { border-color: #1e293b; }
    #modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .btn-modal-cancel {
      background: #f8fafc; border: 1px solid #e2e8f0; color: #64748b;
      border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .btn-modal-save {
      background: #1e293b; color: white; border: none;
      border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'Nunito', sans-serif;
    }
    .btn-modal-save:hover { background: #334155; }
    .btn-modal-save:disabled { opacity: .5; cursor: not-allowed; }

    .hidden { display: none !important; }

    @media print {
      .toolbar, #sconto-banner, #m361-header, #m361-nav { display: none !important; }
      body { padding: 0 !important; }
      .tabella-preordini thead { position: static; }
      .col-s0, .col-s1, .col-s2 { position: static; }
      .tabella-wrapper { max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
<script src="../../scripts/auth.js"></script>
<script src="../../scripts/nav-script.js"></script>

<div id="save-badge"></div>

<div id="qty-warn" class="hidden" onclick="event.stopPropagation()">
  <div class="warn-msg" id="qty-warn-msg"></div>
  <div class="warn-btns">
    <button class="btn-corr"  onclick="correggiQty()">Correggi</button>
    <button class="btn-forza" onclick="forzaQty()">Forza</button>
  </div>
</div>

<!-- ═══ TOOLBAR HUB ════════════════════════════════════════════════════ -->
<div class="toolbar" id="toolbar-hub">
  <span style="font-size:14px;font-weight:800;color:#1e293b">Preordini</span>
  <div style="flex:1;min-width:8px"></div>
  <button class="btn-tb hidden" id="btn-add-sezione" onclick="openSezioneModal()">+ Sezione</button>
</div>

<!-- ═══ TOOLBAR TABLE ═══════════════════════════════════════════════════ -->
<div class="toolbar hidden" id="toolbar-table">
  <button class="btn-tb" onclick="tornaHub()" style="flex-shrink:0">← Preordini</button>
  <span style="font-size:13px;font-weight:700;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px" id="tb-titolo"></span>
  <span id="tb-deadline" class="deadline-chip normale hidden"></span>
  <div id="emp-filter-wrap" class="emp-filter-wrap hidden"></div>
  <div style="flex:1;min-width:8px"></div>
  <button class="btn-tb" id="btn-riepilogo" onclick="toggleRiepilogo()" disabled>≡ Riepilogo</button>
  <button class="btn-tb" id="btn-csv" onclick="exportCSV()" disabled>⬇ CSV</button>
  <button class="btn-tb" id="btn-print" onclick="window.print()" disabled>⎙ Stampa</button>
</div>

<!-- ═══ SCONTO BANNER ═════════════════════════════════════════════════ -->
<div id="sconto-banner" class="hidden"></div>

<!-- ═══ LOADING STATE ════════════════════════════════════════════════= -->
<div id="loading-state" style="text-align:center;padding:80px 24px;color:#94a3b8;font-family:'Nunito',sans-serif">
  <div style="font-size:13px">Caricamento...</div>
</div>

<!-- ═══ HUB VIEW ══════════════════════════════════════════════════════ -->
<div id="hub-view" class="hidden">
  <div id="sezioni-container"></div>
  <div id="hub-empty" class="hidden" style="text-align:center;padding:80px 24px;color:#94a3b8">
    <div style="font-size:44px;margin-bottom:14px">📋</div>
    <div style="font-size:15px;font-weight:700;color:#475569;margin-bottom:6px">Nessuna sezione</div>
    <div style="font-size:13px">Crea la prima sezione con il pulsante + Sezione.</div>
  </div>
</div>

<!-- ═══ TABLE VIEW ════════════════════════════════════════════════════ -->
<div id="table-view" class="hidden">
  <div id="table-loading" style="text-align:center;padding:60px 24px;color:#94a3b8;font-family:'Nunito',sans-serif">
    <div style="font-size:13px">Caricamento ordini...</div>
  </div>
  <div id="table-wrap" class="hidden">
    <div class="tabella-wrapper">
      <table class="tabella-preordini">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<!-- ═══ RIEPILOGO ════════════════════════════════════════════════════ -->
<div id="riepilogo-wrap" class="hidden" style="padding:20px;max-width:900px;margin:0 auto">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
    <h3 style="font-size:14px;font-weight:800;color:#1e293b">Riepilogo per Categoria</h3>
    <button class="btn-tb" onclick="toggleRiepilogo()">← Torna alla tabella</button>
  </div>
  <table class="summary-table" id="summary-table"></table>
</div>

<!-- ═══ ADMIN MODAL ═══════════════════════════════════════════════════ -->
<div id="modal-bg" class="hidden" onclick="closeModal()">
  <div id="modal-box" onclick="event.stopPropagation()">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-modal-save" id="modal-save-btn" onclick="modalSave()">Salva</button>
    </div>
  </div>
</div>

// ── INIT ───────────────────────────────────────────────────────────────
(async function init() {
  try {
    _user = JSON.parse(localStorage.getItem('m361_user') || 'null');
    if (!_user) { location.replace('/login.html'); return; }

    const em = (_user.email || '').toLowerCase();
    _iAmAdmin = em === 'emilio.mazzolari@gmail.com' || em === 'e.mazzolari@meridiano361.it';

    if (!_iAmAdmin) {
      let ok = !!_user.is_resp_acquisti;
      if (!ok && _user.id) {
        const { data: op } = await DB.from('operatori')
          .select('is_resp_acquisti').eq('id', _user.id).single();
        ok = !!(op?.is_resp_acquisti);
      }
      if (!ok) { location.replace('/'); return; }
      const emNorm = (_user.emporio || '').toLowerCase().replace(/\s+/g,'');
      for (const [k, v] of Object.entries(EMP_MAP)) {
        if (k.toLowerCase().replace(/\s+/g,'') === emNorm) { mioEmpCodice = v; break; }
      }
      if (!mioEmpCodice) mioEmpCodice = _user.emporio_codice || '';
    }

    if (_iAmAdmin) {
      document.getElementById('btn-add-sezione').classList.remove('hidden');
    }

    await loadHub();
  } catch (err) {
    document.getElementById('loading-state').innerHTML =
      '<div style="font-size:13px;color:#dc2626">Errore: ' + err.message + '</div>';
  }
})();

// ── LOAD HUB ──────────────────────────────────────────────────────────
async function loadHub() {
  try {
    const [{ data: sez, error: e1 }, { data: camps, error: e2 }] = await Promise.all([
      DB.from('preordini_sezioni').select('*').order('ordine').order('nome'),
      DB.from('preordini_campagne').select('*').order('anno', { ascending: false }),
    ]);

    if (e1) throw new Error(e1.message);
    if (e2) throw new Error(e2.message);

    sezioni = sez || [];
    campagneAll = camps || [];
    sezioni.forEach(s => sezioniExpanded.add(s.id));

    renderHub();
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('hub-view').classList.remove('hidden');
  } catch (err) {
    document.getElementById('loading-state').innerHTML =
      '<div style="font-size:13px;color:#dc2626">Errore caricamento: ' + err.message + '</div>';
  }
}

// ── RENDER HUB ────────────────────────────────────────────────────────
function renderHub() {
  const container = document.getElementById('sezioni-container');
  const empty     = document.getElementById('hub-empty');

  if (sezioni.length === 0) {
    container.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  let html = '';
  sezioni.forEach(sez => {
    const camps  = campagneAll.filter(c => c.sezione_id === sez.id);
    const isOpen = sezioniExpanded.has(sez.id);
    const arrow  = isOpen ? '▼' : '▶';

    html += '<div class="sezione-card" id="sez-card-' + sez.id + '">';

    // Header
    html += '<div class="sezione-header" onclick="toggleSezione(\'' + sez.id + '\')">';
    html += '<span class="sezione-arrow" id="sez-arrow-' + sez.id + '">' + arrow + '</span>';
    html += '<span class="sezione-nome">' + esc(sez.nome) + '</span>';
    if (_iAmAdmin) {
      html += '<div class="sezione-btns" onclick="event.stopPropagation()">';
      html += '<button title="Rinomina" onclick="openSezioneModal(\'' + sez.id + '\',\'' + esc(sez.nome) + '\')">✎</button>';
      html += '<button class="del" title="Elimina" onclick="deleteSezione(\'' + sez.id + '\',\'' + esc(sez.nome) + '\')">✕</button>';
      html += '</div>';
    }
    html += '</div>';

    // Body
    html += '<div class="sezione-body" id="sez-body-' + sez.id + '"' + (isOpen ? '' : ' style="display:none"') + '>';

    if (camps.length === 0) {
      html += '<div style="padding:8px 4px;font-size:12px;color:#94a3b8;font-style:italic">Nessuna campagna</div>';
    } else {
      camps.forEach(camp => { html += renderCampagnaRow(camp); });
    }

    if (_iAmAdmin) {
      html += '<button class="btn-add-sub" onclick="openCampagnaModal(\'' + sez.id + '\')">+ Aggiungi campagna</button>';
    }

    html += '</div></div>';
  });

  container.innerHTML = html;
}

function renderCampagnaRow(camp) {
  let meta = String(camp.anno || '');
  if (camp.scadenza) {
    const d = new Date(camp.scadenza);
    meta += ' · scad. ' + d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  if (camp.min_ordine) meta += ' · min €' + parseFloat(camp.min_ordine).toLocaleString('it-IT');

  let html = '<div class="campagna-row" onclick="apriCampagna(\'' + camp.id + '\')">';
  html += '<div class="campagna-icon">📋</div>';
  html += '<div class="campagna-info">';
  html += '<div class="campagna-nome">' + esc(camp.nome) + '</div>';
  if (meta) html += '<div class="campagna-meta">' + esc(meta) + '</div>';
  html += '</div>';
  html += '<div class="campagna-chevron">›</div>';
  if (_iAmAdmin) {
    html += '<div class="campagna-btns" onclick="event.stopPropagation()">';
    html += '<button title="Modifica" onclick="openCampagnaModal(\'' + (camp.sezione_id||'') + '\',\'' + camp.id + '\')">✎</button>';
    html += '<button class="del" title="Elimina" onclick="deleteCampagna(\'' + camp.id + '\',\'' + esc(camp.nome) + '\')">✕</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ── TOGGLE SEZIONE ────────────────────────────────────────────────────
function toggleSezione(sezId) {
  const body  = document.getElementById('sez-body-' + sezId);
  const arrow = document.getElementById('sez-arrow-' + sezId);
  if (!body) return;
  const isOpen = sezioniExpanded.has(sezId);
  if (isOpen) {
    sezioniExpanded.delete(sezId);
    body.style.display  = 'none';
    arrow.textContent   = '▶';
  } else {
    sezioniExpanded.add(sezId);
    body.style.display  = '';
    arrow.textContent   = '▼';
  }
}

// ── NAVIGATION: OPEN CAMPAIGN ─────────────────────────────────────────
async function apriCampagna(campId) {
  const camp = campagneAll.find(c => c.id === campId);
  if (!camp) return;

  document.getElementById('toolbar-hub').classList.add('hidden');
  document.getElementById('toolbar-table').classList.remove('hidden');
  document.getElementById('hub-view').classList.add('hidden');
  document.getElementById('table-view').classList.remove('hidden');
  document.getElementById('table-loading').classList.remove('hidden');
  document.getElementById('table-wrap').classList.add('hidden');
  document.getElementById('riepilogo-wrap').classList.add('hidden');
  document.getElementById('sconto-banner').classList.add('hidden');

  await selezionaCampagna(camp);
}

// ── NAVIGATION: BACK TO HUB ───────────────────────────────────────────

// ── SELECT CAMPAIGN ────────────────────────────────────────────────────
async function selezionaCampagna(camp) {
  try {
    campagna = camp;
    document.getElementById('tb-titolo').textContent = camp.nome;
    mostraDeadline(camp.scadenza);

    const [{ data: emps }, { data: rigs }] = await Promise.all([
      DB.from('preordini_empori').select('*').eq('campagna_id', camp.id).order('ordine_visualizzazione'),
      DB.from('preordini_righe').select('*').eq('campagna_id', camp.id).order('ordine_riga'),
    ]);

    emporiAttivi = emps || [];
    righe = rigs || [];
    quantitaMap = {};

    if (_iAmAdmin) {
      filtroEmpori = new Set(emporiAttivi.map(e => e.codice));
      document.getElementById('emp-filter-wrap').classList.remove('hidden');
      buildFiltroUI();
    } else {
      document.getElementById('emp-filter-wrap').classList.add('hidden');
    }

    if (righe.length > 0) {
      let q = DB.from('preordini_quantita').select('*').in('riga_id', righe.map(r => r.id));
      if (!_iAmAdmin) q = q.eq('emporio_codice', mioEmpCodice);
      const { data: qtys } = await q;
      (qtys || []).forEach(qt => {
        if (!quantitaMap[qt.riga_id]) quantitaMap[qt.riga_id] = {};
        quantitaMap[qt.riga_id][qt.emporio_codice] = {
          id: qt.id,
          ordine_corrente: parseFloat(qt.ordine_corrente) || 0,
        };
      });
    }

    document.getElementById('table-loading').classList.add('hidden');
    document.getElementById('table-wrap').classList.remove('hidden');

    ['btn-riepilogo', 'btn-csv', 'btn-print'].forEach(id => {
      document.getElementById(id).disabled = false;
    });

    if (righe.length === 0) {
      document.getElementById('thead').innerHTML = '';
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;font-style:italic">Nessun prodotto in questa campagna</td></tr>';
      document.getElementById('tfoot').innerHTML = '';
    } else {
      renderTable();
    }
    aggiornaScontoBanner();
    clearSave();
  } catch (err) {
    document.getElementById('table-loading').innerHTML =
      '<div style="font-size:13px;color:#dc2626;padding:40px;text-align:center">Errore: ' + err.message + '</div>';
  }
}

// ── DEADLINE CHIP ──────────────────────────────────────────────────────
function mostraDeadline(scadenza) {
  if (!scadenza) return;
  const chip = document.getElementById('tb-deadline');
  const diff = Math.ceil((new Date(scadenza) - new Date()) / 86400000);
  let cls, label;
  if (diff < 0) {
    cls = 'passata'; label = 'Scadenza passata';
  } else if (diff <= 7) {
    cls = 'urgente'; label = '⏰ Scade tra ' + diff + ' giorni';
  } else {
    cls = 'normale';
    label = '📅 ' + new Date(scadenza).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  chip.className = 'deadline-chip ' + cls;
  chip.textContent = label;
  chip.classList.remove('hidden');
}

// ── FILTRO EMPORI (admin only) ─────────────────────────────────────────
function buildFiltroUI() {
  const wrap = document.getElementById('emp-filter-wrap');
  wrap.innerHTML = '<span style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Empori:</span>';
  emporiAttivi.forEach(e => {
    const lbl = document.createElement('label');
    lbl.className = 'emp-cb-label';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = filtroEmpori.has(e.codice);
    cb.addEventListener('change', () => {
      if (cb.checked) filtroEmpori.add(e.codice);
      else filtroEmpori.delete(e.codice);
      renderTable();
      aggiornaScontoBanner();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(e.codice));
    wrap.appendChild(lbl);
  });
}

// ── RENDER TABLE ───────────────────────────────────────────────────────
function renderTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot');

  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const nEmp = emporiVis.length;
  const hasTotOrd = _iAmAdmin && nEmp > 1;
  const totalCols = 5 + nEmp + (hasTotOrd ? 1 : 0) + 4 + 1;

  // THEAD ROW 1: fixed cols → order cols → storico header → € IMP
  let h1 = '<tr>';
  h1 += '<th rowspan="2" class="th-info col-s0" style="text-align:left;width:70px;min-width:70px">Codice</th>';
  h1 += '<th rowspan="2" class="th-info col-s1" style="text-align:left;width:110px;min-width:110px">Categoria</th>';
  h1 += '<th rowspan="2" class="th-info col-s2" style="text-align:left;min-width:180px">Prodotto</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:center;width:42px">Conf</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:center;width:58px">PVP cess.</th>';
  emporiVis.forEach(e => {
    h1 += '<th rowspan="2" class="th-emp" style="min-width:52px">' + esc(e.codice) + '<br><span style="font-size:8px;font-weight:600;opacity:.7">ord.' + (campagna?.anno || '') + '</span></th>';
  });
  if (hasTotOrd) h1 += '<th rowspan="2" class="th-tot" style="min-width:54px">TOT<br>ORD</th>';
  h1 += '<th colspan="4" class="th-stor">CREMONA STORICO · <span style="color:#94a3b8">A</span> <span style="color:#4ade80">V</span></th>';
  h1 += '<th rowspan="2" class="th-tot" style="min-width:74px">€ IMP</th>';
  h1 += '</tr>';

  // THEAD ROW 2: storico years reversed (most recent left)
  let h2 = '<tr>';
  [2026, 2025, 2024, 2023].forEach((y, i) => {
    const bL = i === 0 ? 'border-left:2px solid #64748b;' : '';
    const bR = i === 3 ? 'border-right:2px solid #64748b;' : '';
    h2 += '<th class="th-stor-year" style="min-width:44px;' + bL + bR + '">' + y + '</th>';
  });
  h2 += '</tr>';
  thead.innerHTML = h1 + h2;

  const fornitori = [...new Set(righe.map(r => r.fornitore || '—'))];
  let html = '';

  fornitori.forEach((forn, fi) => {
    const grp = righe.filter(r => (r.fornitore || '—') === forn);
    const fk  = 'fk' + fi;

    html += '<tr class="tr-fornitore" onclick="toggleForn(\'' + fk + '\')">' +
      '<td colspan="' + totalCols + '">' +
      '<span id="arr-' + fk + '">▼</span> ' + esc(forn) +
      ' <span style="font-size:10px;font-weight:400;opacity:.55">(' + grp.length + ')</span>' +
      '</td></tr>';

    let subEmpOrd = {};
    emporiVis.forEach(e => { subEmpOrd[e.codice] = 0; });

    grp.forEach(riga => {
      const stor  = STORICO_CR[riga.codice] || {};
      const storV = STORICO_CR_VEND[riga.codice] || {};
      const q     = quantitaMap[riga.id] || {};

      html += '<tr class="product-row" data-fk="' + fk + '" data-riga-id="' + riga.id + '">';
      html += '<td class="col-s0" style="color:#94a3b8;font-size:10px;padding:3px 4px">' + esc(riga.codice || '') + '</td>';
      html += '<td class="col-s1" style="font-size:11px;color:#64748b;padding:3px 4px">' + esc(riga.categoria || '') + '</td>';

      // Prodotto con nota tooltip
      const noteHtml = riga.note
        ? '<span class="nota-wrap"><span class="nota-icon">📝</span><span class="nota-tip">' + esc(riga.note) + '</span></span>'
        : '';
      html += '<td class="col-s2" style="font-size:12px;font-weight:500;padding:3px 6px">' + esc(riga.prodotto || '') + noteHtml + '</td>';

      html += '<td style="text-align:center;color:#94a3b8;font-size:11px">' + (riga.conf || '') + '</td>';
      html += '<td style="text-align:right;color:#475569;font-size:11px;padding:2px 6px">' + (riga.pvp_corrente ? fmtEuro(riga.pvp_corrente) : '') + '</td>';

      // COLONNE ORDINE (prima dello storico)
      let totOrd = 0;
      emporiVis.forEach((emp, ei) => {
        const qt   = q[emp.codice] || {};
        const oc   = parseFloat(qt.ordine_corrente) || 0;
        totOrd += oc;
        const conf = parseFloat(riga.conf) || 0;
        const tdCls = oc > 0 ? ((conf > 0 && oc % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val') : 'td-ord';
        subEmpOrd[emp.codice] += oc;
        html += '<td class="' + tdCls + '" id="td-oc-' + riga.id + '-' + emp.codice + '">' +
          '<input class="cella-qty cella-ord" type="number" step="1" min="0" value="' + (oc || '') + '" ' +
          'data-rid="' + riga.id + '" data-col="' + ei + '" ' +
          'oninput="onQty(\'' + riga.id + '\',\'' + emp.codice + '\',this,' + conf + ')" ' +
          'onfocus="this._prev=this.value;this.select()" onkeydown="onQtyKey(event,this)">' +
          '</td>';
      });

      const pvp     = parseFloat(riga.pvp_corrente) || 0;
      const euroImp = totOrd * pvp;
      if (hasTotOrd) {
        html += '<td class="td-tot-ord" id="tot-ord-' + riga.id + '">' + (totOrd || '') + '</td>';
      }

      // STORICO (2026→2023, dual: acquistato / venduto)
      [2026, 2025, 2024, 2023].forEach((y, i) => {
        const acq = stor[y];
        const vnd = storV[y];
        const bL  = i === 0 ? 'border-left:2px solid #94a3b8;' : '';
        const bR  = i === 3 ? 'border-right:2px solid #94a3b8;' : '';
        html += '<td class="td-stor" style="' + bL + bR + '">' +
          '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq">' + (acq != null ? acq : '—') + '</span></div>' +
          '<div class="stor-div"></div>' +
          '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd">' + (vnd != null ? vnd : '—') + '</span></div>' +
          '</td>';
      });

      html += '<td class="td-tot-eur" id="tot-eur-' + riga.id + '">' + (euroImp > 0 ? fmtEuro(euroImp) : '') + '</td>';
      html += '</tr>';
    });

    // Riga subtotale
    html += '<tr class="tr-subtotal" data-fk="' + fk + '">';
    html += '<td colspan="5" style="text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.04em">TOTALE ' + esc(forn) + '</td>';
    let subTot = 0, subEur = 0;
    emporiVis.forEach(emp => {
      const so = subEmpOrd[emp.codice] || 0;
      subTot += so;
      html += '<td style="text-align:center;font-family:\'Nunito\',monospace;color:#16A34A;font-weight:700">' + (so || '') + '</td>';
    });
    grp.forEach(r => {
      emporiVis.forEach(emp => {
        subEur += (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0);
      });
    });
    if (hasTotOrd) {
      html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#16A34A;background:#f0fdf4">' + (subTot || '') + '</td>';
    }
    for (let i = 0; i < 4; i++) html += '<td style="background:#f1f5f9"></td>';
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#166534;background:#f0fdf4">' + (subEur > 0 ? fmtEuro(subEur) : '') + '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;

  let foot = '<tr><td colspan="5" style="text-align:right;font-size:10px;letter-spacing:.06em">TOTALE GENERALE →</td>';
  let gTot = 0, gEur = 0;
  emporiVis.forEach(emp => {
    const eo = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const ee = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0), 0);
    gTot += eo; gEur += ee;
    foot += '<td style="text-align:center;color:#4ade80;font-family:\'Nunito\',monospace;font-weight:700">' + (eo || '') + '</td>';
  });
  if (hasTotOrd) {
    foot += '<td style="text-align:right;color:#4ade80;font-family:\'Nunito\',monospace;font-size:13px;background:#0f3d1e">' + (gTot || '') + '</td>';
  }
  for (let i = 0; i < 4; i++) foot += '<td style="background:#1e293b"></td>';
  foot += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80;background:#0f3d1e">' + (gEur > 0 ? fmtEuro(gEur) : '') + '</td>';
  foot += '</tr>';
  tfoot.innerHTML = foot;

  aggiornaScontoBanner();
}

// ── UPDATE ROW TOTALS ─────────────────────────────────────────────────
function updateRowTotals(rigaId) {
  const riga = righe.find(r => r.id === rigaId);
  const pvp  = parseFloat(riga?.pvp_corrente) || 0;
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  let tot = 0;
  emporiVis.forEach(emp => {
    tot += parseFloat(quantitaMap[rigaId]?.[emp.codice]?.ordine_corrente) || 0;
  });

  const eO = document.getElementById('tot-ord-' + rigaId);
  const eE = document.getElementById('tot-eur-' + rigaId);
  if (eO) eO.textContent = tot || '';
  if (eE) eE.textContent = tot > 0 && pvp > 0 ? fmtEuro(tot * pvp) : '';
}

// ── SCONTO BANNER ─────────────────────────────────────────────────────
function calcolaSconto(empCodice) {
  const totEuro = righe.reduce((sum, r) => {
    const oc  = parseFloat(quantitaMap[r.id]?.[empCodice]?.ordine_corrente) || 0;
    const pvp = parseFloat(r.pvp_corrente) || 0;
    return sum + oc * pvp;
  }, 0);
  const tier = SCONTO_TIERS.find(t => totEuro >= t.min) || SCONTO_TIERS[SCONTO_TIERS.length - 1];
  return { totEuro, pct: tier.pct };
}

function aggiornaScontoBanner() {
  const banner = document.getElementById('sconto-banner');
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  if (emporiVis.length === 0 || righe.length === 0) { banner.classList.add('hidden'); return; }

  let html = '<span style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0">Imponibile:</span>';
  emporiVis.forEach(emp => {
    const { totEuro, pct } = calcolaSconto(emp.codice);
    const pctCls = pct > 0 ? 'sc-pct' : 'sc-pct nosconto';
    html += '<div class="sconto-chip">' +
      '<span class="sc-emp">' + esc(emp.codice) + '</span>' +
      '<span class="sc-euro">' + (totEuro > 0 ? fmtEuro(totEuro) : '€ 0') + '</span>' +
      '<span class="' + pctCls + '">→ ' + (pct > 0 ? pct + '%' : 'no sconto') + '</span>' +
      '</div>';
  });
  if (campagna?.min_ordine) {
    html += '<span style="font-size:10px;color:#94a3b8;margin-left:4px">Minimo: ' + fmtEuro(campagna.min_ordine) + '</span>';
  }
  banner.innerHTML = html;
  banner.classList.remove('hidden');
}

// ── COLLAPSE FORNITORE ────────────────────────────────────────────────
function toggleForn(fk) {
  const rows  = document.querySelectorAll('[data-fk="' + fk + '"]');
  const arrow = document.getElementById('arr-' + fk);
  const isHid = rows.length > 0 && rows[0].style.display === 'none';
  rows.forEach(r => r.style.display = isHid ? '' : 'none');
  if (arrow) arrow.textContent = isHid ? '▼' : '▶';
}

// ── QTY VALIDATION ────────────────────────────────────────────────────
function validaQty(val, conf) {
  if (val === 0 || !conf || conf <= 0) return { ok: true };
  if (val % conf === 0) return { ok: true };
  return { ok: false, inf: Math.floor(val / conf) * conf || conf, sup: Math.ceil(val / conf) * conf };
}

function showQtyWarn(input, val, conf, rigaId, empCode) {
  const res = validaQty(val, conf);
  if (res.ok) { hideQtyWarn(); return; }
  pendingVal = { rigaId, empCode, input, val, conf, inf: res.inf, sup: res.sup };
  document.getElementById('qty-warn-msg').textContent =
    val + ' non è multiplo di ' + conf + '. Suggerito: ' + res.inf + ' o ' + res.sup;
  const warn = document.getElementById('qty-warn');
  const rect = input.getBoundingClientRect();
  warn.style.top  = (rect.bottom + 6) + 'px';
  warn.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  warn.classList.remove('hidden');
}

function hideQtyWarn() {
  document.getElementById('qty-warn').classList.add('hidden');
  pendingVal = null;
}

function correggiQty() {
  if (!pendingVal) return;
  const { input, rigaId, empCode, conf, inf, sup, val } = pendingVal;
  const corrected = Math.abs(val - inf) <= Math.abs(val - sup) ? inf : sup;
  input.value = corrected;
  hideQtyWarn();
  commitQty(rigaId, empCode, corrected, input, conf);
}

function forzaQty() {
  if (!pendingVal) return;
  const { rigaId, empCode, val, input, conf } = pendingVal;
  hideQtyWarn();
  commitQty(rigaId, empCode, val, input, conf);
}

function onQty(rigaId, empCode, input, conf) {
  hideQtyWarn();
  const val = parseFloat(input.value) || 0;
  clearTimeout(saveTimers['warn-' + rigaId + '-' + empCode]);
  if (conf > 0 && val > 0 && val % conf !== 0) {
    saveTimers['warn-' + rigaId + '-' + empCode] = setTimeout(
      () => showQtyWarn(input, val, conf, rigaId, empCode), 600);
  } else {
    commitQty(rigaId, empCode, val, input, conf);
  }
}

function commitQty(rigaId, empCode, val, input, conf) {
  if (!quantitaMap[rigaId]) quantitaMap[rigaId] = {};
  if (!quantitaMap[rigaId][empCode]) quantitaMap[rigaId][empCode] = { ordine_corrente: 0 };
  quantitaMap[rigaId][empCode].ordine_corrente = val;

  const td = document.getElementById('td-oc-' + rigaId + '-' + empCode);
  if (td) {
    if (val > 0) td.className = (conf > 0 && val % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val';
    else td.className = 'td-ord';
  }

  updateRowTotals(rigaId);
  aggiornaScontoBanner();

  clearTimeout(saveTimers['qty-' + rigaId + '-' + empCode]);
  setSave('💾 Salvando…', 'saving');
  saveTimers['qty-' + rigaId + '-' + empCode] = setTimeout(() => saveQty(rigaId, empCode), 800);
}

function onQtyKey(e, input) {
  const key = e.key;
  if (key === 'Escape') { input.value = input._prev ?? input.value; hideQtyWarn(); input.blur(); return; }

  const rid  = input.dataset.rid;
  const col  = parseInt(input.dataset.col);
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);
  const nCols = emporiVis.length;

  if (key === 'Tab') {
    e.preventDefault(); hideQtyWarn();
    if (e.shiftKey) {
      if (col > 0) navCell(rid, col - 1, 0); else navCell(rid, nCols - 1, -1);
    } else {
      if (col < nCols - 1) navCell(rid, col + 1, 0); else navCell(rid, 0, 1);
    }
  } else if (key === 'Enter' || key === 'ArrowDown') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, 1);
  } else if (key === 'ArrowUp') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, -1);
  } else if (key === 'ArrowRight') {
    if (input.selectionStart === input.value.length && col < nCols - 1) { e.preventDefault(); navCell(rid, col + 1, 0); }
  } else if (key === 'ArrowLeft') {
    if (input.selectionStart === 0 && col > 0) { e.preventDefault(); navCell(rid, col - 1, 0); }
  }
}

function navCell(currentRid, targetCol, rowDelta) {
  let targetRid = currentRid;
  if (rowDelta !== 0) {
    const idx  = righe.findIndex(r => r.id === currentRid);
    const next = idx + rowDelta;
    if (next < 0 || next >= righe.length) return;
    targetRid = righe[next].id;
  }
  const t = document.querySelector('[data-rid="' + targetRid + '"][data-col="' + targetCol + '"]');
  if (t) { t.focus(); t.select(); }
}

async function saveQty(rigaId, empCode) {
  const key = rigaId + '-' + empCode;
  if (insertLocks[key]) return;
  const q = quantitaMap[rigaId]?.[empCode];
  if (!q) return;
  const val = q.ordine_corrente || 0;
  let error;
  if (q.id) {
    ({ error } = await DB.from('preordini_quantita')
      .update({ ordine_corrente: val }).eq('id', q.id));
  } else {
    insertLocks[key] = true;
    const { data, error: e } = await DB.from('preordini_quantita')
      .insert({ riga_id: rigaId, emporio_codice: empCode, ordine_corrente: val })
      .select().single();
    insertLocks[key] = false;
    error = e;
    if (data) quantitaMap[rigaId][empCode].id = data.id;
  }
  if (error) setSave('✗ Errore', 'err');
  else { setSave('✓ Salvato', 'saved'); setTimeout(clearSave, 2000); }
}

// ── RIEPILOGO ─────────────────────────────────────────────────────────
function toggleRiepilogo() {
  riepilogoVis = !riepilogoVis;
  document.getElementById('table-wrap').classList.toggle('hidden', riepilogoVis);
  document.getElementById('riepilogo-wrap').classList.toggle('hidden', !riepilogoVis);
  if (riepilogoVis) renderRiepilogo();
}

function renderRiepilogo() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const categorie = [...new Set(righe.map(r => r.categoria || '—'))].sort();
  let html = '<thead><tr><th>Categoria</th>';
  emporiVis.forEach(e => { html += '<th style="text-align:right">' + esc(e.codice) + '</th>'; });
  if (_iAmAdmin && emporiVis.length > 1) html += '<th style="text-align:right">TOT</th>';
  html += '<th style="text-align:right">€ IMP</th></tr></thead><tbody>';

  let gTot = 0, gEur = 0;
  categorie.forEach(cat => {
    const grp = righe.filter(r => (r.categoria || '—') === cat);
    const empO = {};
    emporiVis.forEach(emp => { empO[emp.codice] = 0; });
    let tTot = 0, tEur = 0;
    grp.forEach(r => {
      emporiVis.forEach(emp => {
        const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
        empO[emp.codice] += oc;
        tTot += oc;
        tEur += oc * (parseFloat(r.pvp_corrente) || 0);
      });
    });
    gTot += tTot; gEur += tEur;
    html += '<tr><td style="font-weight:600">' + esc(cat) + '</td>';
    emporiVis.forEach(emp => { html += '<td style="text-align:right;font-family:\'Nunito\',monospace">' + (empO[emp.codice] || '—') + '</td>'; });
    if (_iAmAdmin && emporiVis.length > 1) html += '<td style="text-align:right;font-family:\'Nunito\',monospace;font-weight:700;color:#16A34A">' + (tTot || '—') + '</td>';
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#166534">' + (tEur > 0 ? fmtEuro(tEur) : '—') + '</td></tr>';
  });

  html += '<tr style="background:#1e293b;color:white;font-weight:700"><td>TOTALE</td>';
  emporiVis.forEach(emp => {
    const t = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const { pct } = calcolaSconto(emp.codice);
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (t || '—') +
      (pct > 0 ? '<span style="font-size:9px;color:#86efac;margin-left:3px">-' + pct + '%</span>' : '') + '</td>';
  });
  if (_iAmAdmin && emporiVis.length > 1) html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (gTot || '—') + '</td>';
  html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (gEur > 0 ? fmtEuro(gEur) : '—') + '</td>';
  html += '</tr></tbody>';
  document.getElementById('summary-table').innerHTML = html;
}

// ── EXPORT CSV ────────────────────────────────────────────────────────
function exportCSV() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const cols = ['Codice','Categoria','Prodotto','Conf','PVP cess.'];
  emporiVis.forEach(e => { cols.push('ORD ' + e.codice); });
  if (_iAmAdmin && emporiVis.length > 1) cols.push('TOT ORD');
  cols.push('CR 2026 Acq','CR 2026 Vnd','CR 2025 Acq','CR 2025 Vnd','CR 2024 Acq','CR 2024 Vnd','CR 2023 Acq','CR 2023 Vnd');
  cols.push('€ IMP');

  const rows = [cols.join(';')];
  righe.forEach(r => {
    const stor = STORICO_CR[r.codice] || {};
    let totOrd = 0, totEur = 0;
    const empData = [];
    emporiVis.forEach(emp => {
      const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
      totOrd += oc;
      totEur += oc * (parseFloat(r.pvp_corrente) || 0);
      empData.push(oc || '');
    });
    const stV = STORICO_CR_VEND[r.codice] || {};
    rows.push([
      csvQ(r.codice), csvQ(r.categoria), csvQ(r.prodotto),
      r.conf || '', r.pvp_corrente || '',
      ...empData,
      ...(_iAmAdmin && emporiVis.length > 1 ? [totOrd || ''] : []),
      stor[2026] ?? '', stV[2026] ?? '',
      stor[2025] ?? '', stV[2025] ?? '',
      stor[2024] ?? '', stV[2024] ?? '',
      stor[2023] ?? '', stV[2023] ?? '',
      totEur > 0 ? totEur.toFixed(2) : '',
    ].join(';'));
  });

  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (campagna?.nome || 'preordine').replace(/\s+/g,'_').toLowerCase() + '.csv';
  a.click();
}

// ADMIN MODAL
// ═══════════════════════════════════════════════════════════════════════
function openSezioneModal(id, nome) {
  _modalMode = id ? 'sezione-edit' : 'sezione-add';
  _modalCtx  = { id: id || null };
  document.getElementById('modal-title').textContent = id ? 'Rinomina sezione' : 'Nuova sezione';
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-field"><label>Nome sezione</label>' +
    '<input id="modal-input-nome" type="text" value="' + esc(nome || '') + '" placeholder="es. Estate" maxlength="50">' +
    '</div>';
  document.getElementById('modal-bg').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-input-nome')?.focus(), 60);
}

function openCampagnaModal(sezioneId, campId) {
  _modalMode = campId ? 'campagna-edit' : 'campagna-add';
  const camp = campId ? campagneAll.find(c => c.id === campId) : null;
  _modalCtx  = { sezioneId: sezioneId || null, campId: campId || null };
  document.getElementById('modal-title').textContent = campId ? 'Modifica campagna' : 'Nuova campagna';
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-field"><label>Nome</label>' +
    '<input id="modal-input-nome" type="text" value="' + esc(camp?.nome || '') + '" placeholder="es. Pasqua 2028">' +
    '</div>' +
    '<div class="modal-field"><label>Anno</label>' +
    '<input id="modal-input-anno" type="number" value="' + (camp?.anno || new Date().getFullYear() + 1) + '" min="2020" max="2050">' +
    '</div>' +
    '<div class="modal-field"><label>Stagione (opzionale)</label>' +
    '<input id="modal-input-stagione" type="text" value="' + esc(camp?.stagione || '') + '" placeholder="es. Primavera 2028">' +
    '</div>' +
    '<div class="modal-field"><label>Scadenza ordini (opzionale)</label>' +
    '<input id="modal-input-scadenza" type="date" value="' + (camp?.scadenza || '') + '">' +
    '</div>' +
    '<div class="modal-field"><label>Minimo ordine € (opzionale)</label>' +
    '<input id="modal-input-min" type="number" step="0.01" min="0" value="' + (camp?.min_ordine || '') + '">' +
    '</div>';
  document.getElementById('modal-bg').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-input-nome')?.focus(), 60);
}

function closeModal() {
  document.getElementById('modal-bg').classList.add('hidden');
  _modalMode = null;
  _modalCtx  = null;
}

async function modalSave() {
  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Salvataggio...';
  try {
    if (_modalMode === 'sezione-add' || _modalMode === 'sezione-edit') {
      await saveSezione();
    } else {
      await saveCampagna();
    }
    closeModal();
    await loadHub();
  } catch (err) {
    alert('Errore: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salva';
  }
}

async function saveSezione() {
  const nome = document.getElementById('modal-input-nome').value.trim();
  if (!nome) throw new Error('Inserisci un nome');
  if (_modalMode === 'sezione-add') {
    const maxOrd = sezioni.reduce((m, s) => Math.max(m, s.ordine || 0), -1);
    const { error } = await DB.from('preordini_sezioni').insert({ nome, ordine: maxOrd + 1 });
    if (error) throw new Error(error.message);
  } else {
    const { error } = await DB.from('preordini_sezioni').update({ nome }).eq('id', _modalCtx.id);
    if (error) throw new Error(error.message);
  }
}

async function saveCampagna() {
  const nome      = document.getElementById('modal-input-nome').value.trim();
  const anno      = parseInt(document.getElementById('modal-input-anno').value) || null;
  const stagione  = document.getElementById('modal-input-stagione').value.trim() || null;
  const scadenza  = document.getElementById('modal-input-scadenza').value || null;
  const min_ordine = parseFloat(document.getElementById('modal-input-min').value) || null;
  if (!nome) throw new Error('Inserisci un nome');

  if (_modalMode === 'campagna-add') {
    const { data: camp, error } = await DB.from('preordini_campagne')
      .insert({ nome, anno, stagione, scadenza, min_ordine, sezione_id: _modalCtx.sezioneId })
      .select().single();
    if (error) throw new Error(error.message);
    if (camp) {
      await DB.from('preordini_empori').insert([
        { campagna_id: camp.id, codice: 'CR', nome: 'Cremona',        ordine_visualizzazione: 0 },
        { campagna_id: camp.id, codice: 'CA', nome: 'Casalmaggiore',  ordine_visualizzazione: 1 },
        { campagna_id: camp.id, codice: 'VI', nome: 'Viadana',        ordine_visualizzazione: 2 },
        { campagna_id: camp.id, codice: 'RE', nome: 'Reggio Emilia',  ordine_visualizzazione: 3 },
        { campagna_id: camp.id, codice: 'MN', nome: 'Mantova',        ordine_visualizzazione: 4 },
      ]);
    }
  } else {
    const { error } = await DB.from('preordini_campagne')
      .update({ nome, anno, stagione, scadenza, min_ordine })
      .eq('id', _modalCtx.campId);
    if (error) throw new Error(error.message);
  }
}

async function deleteSezione(id, nome) {
  const camps = campagneAll.filter(c => c.sezione_id === id);
  if (camps.length > 0) {
    alert('Non puoi eliminare "' + nome + '" perché contiene ' + camps.length + ' campagna/e.\nElimina prima le campagne.');
    return;
  }
  if (!confirm('Eliminare la sezione "' + nome + '"?')) return;
  const { error } = await DB.from('preordini_sezioni').delete().eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  await loadHub();
}

async function deleteCampagna(id, nome) {
  if (!confirm('Eliminare la campagna "' + nome + '"?\nVerranno cancellati anche tutti gli ordini inseriti.')) return;
  const { data: righeList } = await DB.from('preordini_righe').select('id').eq('campagna_id', id);
  if (righeList?.length) {
    await DB.from('preordini_quantita').delete().in('riga_id', righeList.map(r => r.id));
    await DB.from('preordini_righe').delete().eq('campagna_id', id);
  }
  await DB.from('preordini_empori').delete().eq('campagna_id', id);
  const { error } = await DB.from('preordini_campagne').delete().eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  await loadHub();
}

// ── UTILS ─────────────────────────────────────────────────────────────
function fmtEuro(n) { return '€ ' + parseFloat(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function csvQ(s)  { return '"' + String(s || '').replace(/"/g, '""') + '"'; }
function esc(s)   { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _saveClearTimer = null;
function setSave(msg, type) {
  const el = document.getElementById('save-badge');
  el.textContent = msg; el.className = type;
  clearTimeout(_saveClearTimer);
}
function clearSave() {
  _saveClearTimer = setTimeout(() => {
    const el = document.getElementById('save-badge');
    el.className = ''; el.textContent = '';
  }, 100);
}

document.addEventListener('click', () => {
  if (!document.getElementById('qty-warn').classList.contains('hidden')) hideQtyWarn();
});
