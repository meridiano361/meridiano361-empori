// ADMIN MODAL
// ═══════════════════════════════════════════════════════════════════════
function openSezioneModal(id, nome) {
  _modalMode = id ? 'sezione-edit' : 'sezione-add';
  _modalCtx  = { id: id || null };
  document.getElementById('modal-title').textContent = id ? 'Rinomina sezione' : 'Nuova sezione';
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-field"><label>Nome sezione</label>' +
    '<input id="modal-input-nome" type="text" value="' + esc(nome || '') + '" placeholder="es. Estate" maxlength="50">' +
    '</div>';
  document.getElementById('modal-bg').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-input-nome')?.focus(), 60);
}

function buildSoglieRows(soglie) {
  return soglie.map((s, i) => soglieRowHtml(i, s)).join('');
}
function soglieRowHtml(i, s) {
  s = s || {};
  const st = 'height:26px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:\'Nunito\',sans-serif;padding:0 6px;box-sizing:border-box';
  return '<div class="soglia-cat-row" style="display:grid;grid-template-columns:1fr 1fr 90px auto;gap:4px;align-items:center">' +
    '<input placeholder="Label (es. Ricorrenze)" style="' + st + ';width:100%" value="' + esc(s.label || '') + '" data-key="label">' +
    '<input placeholder="Categoria (opz.)" style="' + st + ';width:100%" value="' + esc(s.categoria || '') + '" data-key="categoria">' +
    '<input type="number" placeholder="Min €" min="0" step="1" style="' + st + ';width:90px;text-align:right" value="' + (s.importo_min || '') + '" data-key="importo_min">' +
    '<button type="button" onclick="this.closest(\'.soglia-cat-row\').remove()" style="height:26px;width:26px;border:1px solid #fca5a5;background:#fff1f2;color:#dc2626;border-radius:5px;cursor:pointer;font-size:14px;line-height:1">✕</button>' +
    '</div>';
}
function aggiungiSogliaCat() {
  const list = document.getElementById('soglie-cat-list');
  if (!list) return;
  const div = document.createElement('div');
  div.innerHTML = soglieRowHtml(list.children.length, {});
  list.appendChild(div.firstChild);
}

function openCampagnaModal(sezioneId, campId) {
  _modalMode = campId ? 'campagna-edit' : 'campagna-add';
  const camp = campId ? campagneAll.find(c => c.id === campId) : null;
  _modalCtx  = { sezioneId: sezioneId || null, campId: campId || null };
  document.getElementById('modal-title').textContent = campId ? 'Modifica preordine' : 'Nuovo preordine';
  const defTiers = [
    { min: 1700, pct: 1.5 },
    { min: 2801, pct: 2.5 },
    { min: 3901, pct: 3   },
    { min: 5000, pct: 4   },
  ];
  const tiers = (camp?.scaglioni && Array.isArray(camp.scaglioni) && camp.scaglioni.length === 4)
    ? camp.scaglioni : defTiers;
  let scaglioniRows = '';
  tiers.forEach((t, i) => {
    const label = i === tiers.length - 1 ? '≥' : 'da';
    scaglioniRows +=
      '<tr>' +
      '<td style="padding:2px 4px;font-size:11px;color:#64748b;white-space:nowrap">' + label + '</td>' +
      '<td style="padding:2px 4px"><input id="tier-' + i + '-min" type="number" min="0" step="1" value="' + t.min + '" style="width:70px;height:26px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:\'Nunito\',sans-serif;padding:0 6px;text-align:right"></td>' +
      '<td style="padding:2px 4px;font-size:11px;color:#64748b">€ →</td>' +
      '<td style="padding:2px 4px"><input id="tier-' + i + '-pct" type="number" min="0" max="20" step="0.1" value="' + t.pct + '" style="width:55px;height:26px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:\'Nunito\',sans-serif;padding:0 6px;text-align:right"></td>' +
      '<td style="padding:2px 4px;font-size:11px;color:#64748b">%</td>' +
      '</tr>';
  });
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-field"><label>Nome</label>' +
    '<input id="modal-input-nome" type="text" value="' + esc(camp?.nome || '') + '" placeholder="es. Pasqua 2028">' +
    '</div>' +
    '<div class="modal-field"><label>Anno</label>' +
    '<input id="modal-input-anno" type="number" value="' + (camp?.anno || new Date().getFullYear() + 1) + '" min="2020" max="2050">' +
    '</div>' +
    '<div class="modal-field"><label>Stagione (opzionale)</label>' +
    '<input id="modal-input-stagione" type="text" value="' + esc(camp?.stagione || '') + '" placeholder="es. Primavera 2028">' +
    '</div>' +
    '<div class="modal-field" style="display:flex;gap:10px;align-items:flex-start">' +
    '<div style="flex:1"><label>Apertura preordini</label>' +
    '<input id="modal-input-apertura" type="date" value="' + (camp?.data_apertura || '') + '">' +
    '</div>' +
    '<div style="flex:1"><label>Chiusura preordini</label>' +
    '<input id="modal-input-scadenza" type="date" value="' + (camp?.scadenza || '') + '">' +
    '</div>' +
    '</div>' +
    '<div class="modal-field"><label>Consegna prevista</label>' +
    '<div style="display:flex;gap:8px;align-items:center">' +
    '<input id="modal-input-consegna" type="date" value="' + (camp?.data_consegna || '') + '" style="flex:1" title="Data fissa o inizio periodo">' +
    '<span style="font-size:12px;color:#94a3b8;white-space:nowrap">fino al</span>' +
    '<input id="modal-input-consegna-fine" type="date" value="' + (camp?.data_consegna_fine || '') + '" style="flex:1" title="Fine periodo (lascia vuoto per data fissa)">' +
    '</div>' +
    '<div style="font-size:10px;color:#94a3b8;margin-top:3px">Data fissa: compila solo il primo campo · Periodo: compila entrambi</div>' +
    '</div>' +
    '<div class="modal-field"><label>Minimo ordine € (opzionale)</label>' +
    '<input id="modal-input-min" type="number" step="0.01" min="0" value="' + (camp?.min_ordine || '') + '">' +
    '</div>' +
    '<div class="modal-field"><label>Scaglioni sconto</label>' +
    '<table style="border-collapse:collapse;margin-top:4px"><tbody>' + scaglioniRows + '</tbody></table>' +
    '</div>' +
    '<div class="modal-field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
    '<input type="checkbox" id="modal-regola-collo" style="width:16px;height:16px;cursor:pointer"' + (camp?.regola_collo ? ' checked' : '') + '>' +
    '<span>Regola collo — sconto solo se ogni referenza ordinata ha qty ≥ 1 collo</span></label>' +
    '</div>' +
    '<div class="modal-field"><label>Soglie per categoria <button type="button" onclick="aggiungiSogliaCat()" style="margin-left:8px;padding:2px 8px;font-size:11px;border:1px solid #bae6fd;background:#f0f9ff;color:#0369a1;border-radius:5px;cursor:pointer;font-family:\'Nunito\',sans-serif">+ Aggiungi</button></label>' +
    '<div id="soglie-cat-list" style="display:flex;flex-direction:column;gap:6px;margin-top:6px">' + buildSoglieRows(camp?.soglie_categoria || []) + '</div>' +
    '</div>' +
    '<div class="modal-field"><label>Note commerciali (visibili a tutti)</label>' +
    '<textarea id="modal-input-note" style="width:100%;min-height:70px;font-size:12px;border:1px solid #e2e8f0;border-radius:6px;padding:6px 8px;font-family:\'Nunito\',sans-serif;resize:vertical" placeholder="Condizioni di pagamento, spedizione, premi fedeltà...">' + esc(camp?.note_commerciali || '') + '</textarea>' +
    '</div>';
  document.getElementById('modal-bg').classList.remove('hidden');
  setTimeout(() => document.getElementById('modal-input-nome')?.focus(), 60);
}

function closeModal() {
  document.getElementById('modal-bg').classList.add('hidden');
  _modalMode = null;
  _modalCtx  = null;
}

async function modalSave() {
  const btn = document.getElementById('modal-save-btn');
  btn.disabled = true;
  btn.textContent = 'Salvataggio...';
  try {
    if (_modalMode === 'riga-edit' || _modalMode === 'riga-add') {
      await saveRiga();
      closeModal();
      await selezionaCampagna(campagna);
      return;
    }
    if (_modalMode === 'sezione-add' || _modalMode === 'sezione-edit') {
      await saveSezione();
    } else {
      await saveCampagna();
    }
    closeModal();
    await loadHub();
  } catch (err) {
    alert('Errore: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salva';
  }
}

async function saveRiga() {
  const codice       = document.getElementById('mf-codice').value.trim();
  const prodotto     = document.getElementById('mf-prodotto').value.trim();
  const categoria    = document.getElementById('mf-categoria').value.trim() || null;
  const fornitore    = document.getElementById('mf-fornitore').value.trim() || null;
  const conf         = parseFloat(document.getElementById('mf-conf').value) || null;
  const pvp_corrente = parseFloat(document.getElementById('mf-pvp').value) || null;
  const pvp_consigliato = parseFloat(document.getElementById('mf-pvpcons').value) || null;
  const note         = document.getElementById('mf-note').value.trim() || null;
  if (!codice || !prodotto) throw new Error('Codice e Prodotto sono obbligatori');
  if (_modalMode === 'riga-add') {
    const maxOrd = righe.reduce((m, r) => Math.max(m, r.ordine || 0), -1);
    const { error } = await DB.from('preordini_righe').insert({
      campagna_id: _modalCtx.campagnaId, codice, prodotto, categoria, fornitore,
      conf, pvp_corrente, pvp_consigliato, note, ordine: maxOrd + 1
    });
    if (error) throw new Error(error.message);
  } else {
    const { error } = await DB.from('preordini_righe').update({
      codice, prodotto, categoria, fornitore, conf, pvp_corrente, pvp_consigliato, note
    }).eq('id', _modalCtx.rigaId);
    if (error) throw new Error(error.message);
  }
}

async function saveSezione() {
  const nome = document.getElementById('modal-input-nome').value.trim();
  if (!nome) throw new Error('Inserisci un nome');
  if (_modalMode === 'sezione-add') {
    const maxOrd = sezioni.reduce((m, s) => Math.max(m, s.ordine || 0), -1);
    const { error } = await DB.from('preordini_sezioni').insert({ nome, ordine: maxOrd + 1 });
    if (error) throw new Error(error.message);
  } else {
    const { error } = await DB.from('preordini_sezioni').update({ nome }).eq('id', _modalCtx.id);
    if (error) throw new Error(error.message);
  }
}

async function saveCampagna() {
  const nome         = document.getElementById('modal-input-nome').value.trim();
  const anno         = parseInt(document.getElementById('modal-input-anno').value) || null;
  const stagione     = document.getElementById('modal-input-stagione').value.trim() || null;
  const scadenza     = document.getElementById('modal-input-scadenza').value || null;
  const data_apertura = document.getElementById('modal-input-apertura')?.value || null;
  const data_consegna      = document.getElementById('modal-input-consegna')?.value || null;
  const data_consegna_fine = document.getElementById('modal-input-consegna-fine')?.value || null;
  const min_ordine   = parseFloat(document.getElementById('modal-input-min').value) || null;
  const scaglioni    = [0,1,2,3].map(i => ({
    min: parseFloat(document.getElementById('tier-' + i + '-min')?.value) || 0,
    pct: parseFloat(document.getElementById('tier-' + i + '-pct')?.value) || 0,
  }));
  const note_commerciali = document.getElementById('modal-input-note')?.value.trim() || null;
  const regola_collo = document.getElementById('modal-regola-collo')?.checked || false;
  const soglie_categoria = Array.from(document.querySelectorAll('#soglie-cat-list .soglia-cat-row')).map(row => ({
    label:       row.querySelector('[data-key="label"]')?.value.trim() || '',
    categoria:   row.querySelector('[data-key="categoria"]')?.value.trim() || '',
    importo_min: parseFloat(row.querySelector('[data-key="importo_min"]')?.value) || 0,
  })).filter(s => s.label);
  if (!nome) throw new Error('Inserisci un nome');

  const payload = { nome, anno, stagione, scadenza, data_apertura, data_consegna, data_consegna_fine, min_ordine, scaglioni, note_commerciali, regola_collo, soglie_categoria: soglie_categoria.length ? soglie_categoria : null };

  if (_modalMode === 'campagna-add') {
    const { data: camp, error } = await DB.from('preordini_campagne')
      .insert({ ...payload, sezione_id: _modalCtx.sezioneId })
      .select().single();
    if (error) throw new Error(error.message);
    if (camp) {
      await DB.from('preordini_empori').insert([
        { campagna_id: camp.id, codice: 'CR',  nome: 'Cremona',        ordine_visualizzazione: 0 },
        { campagna_id: camp.id, codice: 'CA',  nome: 'Casalmaggiore',  ordine_visualizzazione: 1 },
        { campagna_id: camp.id, codice: 'VI',  nome: 'Viadana',        ordine_visualizzazione: 2 },
        { campagna_id: camp.id, codice: 'RE',  nome: 'Reggio Emilia',  ordine_visualizzazione: 3 },
        { campagna_id: camp.id, codice: 'MNU', nome: 'Mantova U.',     ordine_visualizzazione: 4 },
        { campagna_id: camp.id, codice: 'MND', nome: 'Mantova D.',     ordine_visualizzazione: 5 },
      ]);
    }
  } else {
    const { error } = await DB.from('preordini_campagne')
      .update(payload)
      .eq('id', _modalCtx.campId);
    if (error) throw new Error(error.message);
  }
}

async function deleteSezione(id, nome) {
  const camps = campagneAll.filter(c => c.sezione_id === id);
  if (camps.length > 0) {
    alert('Non puoi eliminare "' + nome + '" perché contiene ' + camps.length + ' preordine/i.\nElimina prima i preordini.');
    return;
  }
  if (!confirm('Eliminare la sezione "' + nome + '"?')) return;
  const { error } = await DB.from('preordini_sezioni').delete().eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  await loadHub();
}

async function deleteCampagna(id, nome) {
  if (!confirm('Eliminare il preordine "' + nome + '"?\nVerranno cancellati anche tutti gli ordini inseriti.')) return;
  const { data: righeList } = await DB.from('preordini_righe').select('id').eq('campagna_id', id);
  if (righeList?.length) {
    await DB.from('preordini_quantita').delete().in('riga_id', righeList.map(r => r.id));
    await DB.from('preordini_righe').delete().eq('campagna_id', id);
  }
  await DB.from('preordini_empori').delete().eq('campagna_id', id);
  // Elimina allegati DB (i file in storage rimangono nel bucket ma sono orfani)
  await DB.from('preordini_allegati').delete().eq('campagna_id', id);
  const { error } = await DB.from('preordini_campagne').delete().eq('id', id);
  if (error) { alert('Errore: ' + error.message); return; }
  await loadHub();
}

// ── UTILS ─────────────────────────────────────────────────────────────
function fmtEuro(n) { return '€ ' + parseFloat(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function csvQ(s)  { return '"' + String(s || '').replace(/"/g, '""') + '"'; }
function esc(s)   { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _saveClearTimer = null;
function setSave(msg, type) {
  const el = document.getElementById('save-badge');
  el.textContent = msg; el.className = type;
  clearTimeout(_saveClearTimer);
}
function clearSave() {
  _saveClearTimer = setTimeout(() => {
    const el = document.getElementById('save-badge');
    el.className = ''; el.textContent = '';
  }, 100);
}

document.addEventListener('click', () => {
  if (!document.getElementById('qty-warn').classList.contains('hidden')) hideQtyWarn();
});
