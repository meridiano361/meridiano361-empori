// ── STATE ──────────────────────────────────────────────────────────────
let _user         = null;

let mioEmpCodice  = '';

// ── INIT ───────────────────────────────────────────────────────────────
(async function init() {
  try {
    _user = JSON.parse(localStorage.getItem('m361_user') || 'null');

// ── LOAD CAMPAGNA ──────────────────────────────────────────────────────
async function loadCampagna() {
  try {
    const { data: camps, error } = await DB.from('preordini_campagne')
      .select('*').order('anno', { ascending: false }).limit(20);

    if (error) throw new Error(error.message);

    const p27 = (camps || []).find(c => c.nome === 'Pasqua 2027' && c.anno === 2027)
             || (camps || [])[0];

    if (!p27) {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('empty-state').classList.remove('hidden');
      return;
    }

    await selezionaCampagna(p27);
  } catch (err) {
    document.getElementById('loading-state').innerHTML =
      '<div style="font-size:13px;color:#dc2626">Errore caricamento dati: ' + err.message + '</div>';
  }
}

async function selezionaCampagna(camp) {
  setSave('💾 Caricamento…', 'saving');
  campagna = camp;

  // Toolbar title
  document.getElementById('tb-titolo').textContent = camp.nome + ' · ' + (camp.anno || '');
  mostraDeadline(camp.scadenza);

  const [{ data: emps }, { data: rigs }] = await Promise.all([
    DB.from('preordini_empori').select('*').eq('campagna_id', camp.id).order('ordine_visualizzazione'),
    DB.from('preordini_righe').select('*').eq('campagna_id', camp.id).order('ordine_riga'),
  ]);

  emporiAttivi = emps || [];
  righe = rigs || [];
  quantitaMap = {};

  if (_iAmAdmin) {
    filtroEmpori = new Set(emporiAttivi.map(e => e.codice));
    buildFiltroUI();
  }

  if (righe.length > 0) {
    let q = DB.from('preordini_quantita').select('*').in('riga_id', righe.map(r => r.id));
    if (!_iAmAdmin) q = q.eq('emporio_codice', mioEmpCodice);
    const { data: qtys } = await q;
    (qtys || []).forEach(qt => {
      if (!quantitaMap[qt.riga_id]) quantitaMap[qt.riga_id] = {};
      quantitaMap[qt.riga_id][qt.emporio_codice] = {
        id: qt.id,
        ordine_corrente: parseFloat(qt.ordine_corrente) || 0,
      };
    });
  }

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('empty-state').classList.add('hidden');

  ['btn-riepilogo','btn-csv','btn-print'].forEach(id => {
    document.getElementById(id).disabled = false;
  });

  if (riepilogoVis) {
    document.getElementById('table-wrap').classList.add('hidden');
    document.getElementById('riepilogo-wrap').classList.remove('hidden');
    renderRiepilogo();
  } else {
    document.getElementById('table-wrap').classList.remove('hidden');
    document.getElementById('riepilogo-wrap').classList.add('hidden');
    renderTable();
  }
  clearSave();
}

// ── DEADLINE CHIP ──────────────────────────────────────────────────────
function mostraDeadline(scadenza) {
  if (!scadenza) return;
  const chip = document.getElementById('tb-deadline');
  const diff = Math.ceil((new Date(scadenza) - new Date()) / 86400000);
  let cls = 'normale', label;
  if (diff < 0) {
    cls = 'passata'; label = 'Scadenza passata';
  } else if (diff <= 7) {
    cls = 'urgente'; label = '⏰ Scade tra ' + diff + ' giorni';
  } else {
    cls = 'normale';
    label = '📅 Scadenza: ' + new Date(scadenza).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
  }
  chip.className = 'deadline-chip ' + cls;
  chip.textContent = label;
  chip.classList.remove('hidden');
}

// ── FILTRO EMPORI (admin only) ─────────────────────────────────────────
function buildFiltroUI() {
  const wrap = document.getElementById('emp-filter-wrap');
  wrap.innerHTML = '<span style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Empori:</span>';
  emporiAttivi.forEach(e => {
    const lbl = document.createElement('label');
    lbl.className = 'emp-cb-label';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = filtroEmpori.has(e.codice);
    cb.addEventListener('change', () => {
      if (cb.checked) filtroEmpori.add(e.codice);
      else filtroEmpori.delete(e.codice);
      renderTable();
      aggiornaScontoBanner();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(e.codice));
    wrap.appendChild(lbl);
  });
}

// ── RENDER TABLE ───────────────────────────────────────────────────────
function renderTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot');

  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const totalCols = 5 + 4 + nEmp + (_iAmAdmin ? 2 : 1);

  let h1 = '<tr>';
  h1 += '<th rowspan="2" class="th-info col-s0" style="text-align:left;width:70px;min-width:70px">Codice</th>';
  h1 += '<th rowspan="2" class="th-info col-s1" style="text-align:left;width:110px;min-width:110px">Categoria</th>';
  h1 += '<th rowspan="2" class="th-info col-s2" style="text-align:left;min-width:180px">Prodotto</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:center;width:42px">Conf</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:center;width:58px">PVP cess.</th>';
  h1 += '<th colspan="4" class="th-stor">CREMONA STORICO</th>';
  emporiVis.forEach(e => {
    h1 += '<th rowspan="2" class="th-emp" style="min-width:52px">' + esc(e.codice) + '<br><span style="font-size:8px;font-weight:600;opacity:.7">ord.27</span></th>';
  });
  if (_iAmAdmin && nEmp > 1) h1 += '<th rowspan="2" class="th-tot" style="min-width:54px">TOT<br>ORD</th>';
  h1 += '<th rowspan="2" class="th-tot" style="min-width:74px">€ IMP</th>';
  h1 += '</tr>';

  let h2 = '<tr>';
  [2023, 2024, 2025, 2026].forEach((y, i) => {
    h2 += '<th class="th-stor-year" style="min-width:38px;' + (i===3 ? 'border-right:2px solid #64748b' : '') + '">' + y + '</th>';
  });
  h2 += '</tr>';
  thead.innerHTML = h1 + h2;

  // ── Body ──
  const fornitori = [...new Set(righe.map(r => r.fornitore || '—'))];
  let html = '';

  fornitori.forEach((forn, fi) => {
    const grp = righe.filter(r => (r.fornitore || '—') === forn);
    const fk = 'fk' + fi;

    html += '<tr class="tr-fornitore" onclick="toggleForn(\'' + fk + '\')">' +
      '<td colspan="' + totalCols + '">' +
      '<span id="arr-' + fk + '">▼</span> ' + esc(forn) +
      ' <span style="font-size:10px;font-weight:400;opacity:.55">(' + grp.length + ')</span>' +
      '</td></tr>';

    let subEmpOrd = {};
    emporiVis.forEach(e => { subEmpOrd[e.codice] = 0; });

    grp.forEach(riga => {
      const stor = STORICO_CR[riga.codice] || {};
      const q = quantitaMap[riga.id] || {};

      html += '<tr class="product-row" data-fk="' + fk + '" data-riga-id="' + riga.id + '">';

      // Info sticky cols
      html += '<td class="col-s0" style="color:#94a3b8;font-size:10px;padding:3px 4px">' + esc(riga.codice || '') + '</td>';
      html += '<td class="col-s1" style="font-size:11px;color:#64748b;padding:3px 4px">' + esc(riga.categoria || '') + '</td>';
      html += '<td class="col-s2" style="font-size:12px;font-weight:500;padding:3px 6px">' + esc(riga.prodotto || '') + '</td>';
      html += '<td style="text-align:center;color:#94a3b8;font-size:11px">' + (riga.conf || '') + '</td>';
      html += '<td style="text-align:right;color:#475569;font-size:11px;padding:2px 6px">' + (riga.pvp_corrente ? fmtEuro(riga.pvp_corrente) : '') + '</td>';

      // Storico CR
      [2023, 2024, 2025, 2026].forEach((y, i) => {
        const v = stor[y];
        html += '<td class="td-stor' + (i===3 ? ' last' : '') + '">' + (v != null ? v : '') + '</td>';
      });

      // Per-emporio order inputs
      let totOrd = 0;
      emporiVis.forEach((emp, ei) => {
        const qt = q[emp.codice] || {};
        const oc = parseFloat(qt.ordine_corrente) || 0;
        totOrd += oc;
        const conf = parseFloat(riga.conf) || 0;
        const tdCls = oc > 0 ? ((conf > 0 && oc % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val') : 'td-ord';
        subEmpOrd[emp.codice] += oc;

        html += '<td class="' + tdCls + '" id="td-oc-' + riga.id + '-' + emp.codice + '">' +
          '<input class="cella-qty cella-ord" type="number" step="1" min="0" value="' + (oc || '') + '" ' +
          'data-rid="' + riga.id + '" data-col="' + ei + '" ' +
          'oninput="onQty(\'' + riga.id + '\',\'' + emp.codice + '\',this,' + conf + ')" ' +
          'onfocus="this._prev=this.value;this.select()" onkeydown="onQtyKey(event,this)">' +
          '</td>';
      });

      // Totals
      const pvp = parseFloat(riga.pvp_corrente) || 0;
      const euroImp = totOrd * pvp;
      if (_iAmAdmin && nEmp > 1) {
        html += '<td class="td-tot-ord" id="tot-ord-' + riga.id + '">' + (totOrd || '') + '</td>';
      }
      html += '<td class="td-tot-eur" id="tot-eur-' + riga.id + '">' + (euroImp > 0 ? fmtEuro(euroImp) : '') + '</td>';
      html += '</tr>';
    });

    // Subtotal row per fornitore
    html += '<tr class="tr-subtotal" data-fk="' + fk + '">';
    html += '<td colspan="9" style="text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.04em">TOTALE ' + esc(forn) + '</td>';
    let subTot = 0, subEur = 0;
    emporiVis.forEach(emp => {
      const so = subEmpOrd[emp.codice] || 0;
      subTot += so;
      html += '<td style="text-align:center;font-family:\'Nunito\',monospace;color:#16A34A;font-weight:700">' + (so || '') + '</td>';
    });
    grp.forEach(r => {
      emporiVis.forEach(emp => {
        subEur += (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0);
      });
    });
    if (_iAmAdmin && nEmp > 1) {
      html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#16A34A;background:#f0fdf4">' + (subTot || '') + '</td>';
    }
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#166534;background:#f0fdf4">' + (subEur > 0 ? fmtEuro(subEur) : '') + '</td>';
    html += '</tr>';
  });

  tbody.innerHTML = html;

  // ── Grand total ──
  let foot = '<tr><td colspan="9" style="text-align:right;font-size:10px;letter-spacing:.06em">TOTALE GENERALE →</td>';
  let gTot = 0, gEur = 0;
  emporiVis.forEach(emp => {
    const eo = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const ee = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0), 0);
    gTot += eo; gEur += ee;
    foot += '<td style="text-align:center;color:#4ade80;font-family:\'Nunito\',monospace;font-weight:700">' + (eo || '') + '</td>';
  });
  if (_iAmAdmin && nEmp > 1) {
    foot += '<td style="text-align:right;color:#4ade80;font-family:\'Nunito\',monospace;font-size:13px;background:#0f3d1e">' + (gTot || '') + '</td>';
  }
  foot += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80;background:#0f3d1e">' + (gEur > 0 ? fmtEuro(gEur) : '') + '</td>';
  foot += '</tr>';
  tfoot.innerHTML = foot;

  aggiornaScontoBanner();
}

// ── UPDATE ROW TOTALS (after qty change) ──────────────────────────────
function updateRowTotals(rigaId) {
  const riga = righe.find(r => r.id === rigaId);
  const pvp = parseFloat(riga?.pvp_corrente) || 0;
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  let tot = 0;
  emporiVis.forEach(emp => {
    tot += parseFloat(quantitaMap[rigaId]?.[emp.codice]?.ordine_corrente) || 0;
  });

  const eO = document.getElementById('tot-ord-' + rigaId);
  const eE = document.getElementById('tot-eur-' + rigaId);
  if (eO) eO.textContent = tot || '';
  if (eE) eE.textContent = tot > 0 && pvp > 0 ? fmtEuro(tot * pvp) : '';
}

// ── SCONTO BANNER ─────────────────────────────────────────────────────
function calcolaSconto(empCodice) {
  const totEuro = righe.reduce((sum, r) => {
    const oc  = parseFloat(quantitaMap[r.id]?.[empCodice]?.ordine_corrente) || 0;
    const pvp = parseFloat(r.pvp_corrente) || 0;
    return sum + oc * pvp;
  }, 0);
  const tier = SCONTO_TIERS.find(t => totEuro >= t.min) || SCONTO_TIERS[SCONTO_TIERS.length - 1];
  return { totEuro, pct: tier.pct };
}

function aggiornaScontoBanner() {
  const banner = document.getElementById('sconto-banner');
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  if (emporiVis.length === 0) { banner.classList.add('hidden'); return; }

  let html = '<span style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0">Imponibile ordine:</span>';
  emporiVis.forEach(emp => {
    const { totEuro, pct } = calcolaSconto(emp.codice);
    const pctCls = pct > 0 ? 'sc-pct' : 'sc-pct nosconto';
    html += '<div class="sconto-chip">' +
      '<span class="sc-emp">' + esc(emp.codice) + '</span>' +
      '<span class="sc-euro">' + (totEuro > 0 ? fmtEuro(totEuro) : '€ 0') + '</span>' +
      '<span class="' + pctCls + '">→ ' + (pct > 0 ? pct + '%' : 'nessuno sconto') + '</span>' +
      '</div>';
  });

  if (campagna?.min_ordine) {
    html += '<span style="font-size:10px;color:#94a3b8;margin-left:4px">Minimo: ' + fmtEuro(campagna.min_ordine) + '</span>';
  }

  banner.innerHTML = html;
  banner.classList.remove('hidden');
}

// ── COLLAPSE/EXPAND ────────────────────────────────────────────────────
function toggleForn(fk) {
  const rows  = document.querySelectorAll('[data-fk="' + fk + '"]');
  const arrow = document.getElementById('arr-' + fk);
  const isHid = rows.length > 0 && rows[0].style.display === 'none';
  rows.forEach(r => r.style.display = isHid ? '' : 'none');
  if (arrow) arrow.textContent = isHid ? '▼' : '▶';
}

// ── QUANTITY VALIDATION ────────────────────────────────────────────────
function validaQty(val, conf) {
  if (val === 0 || !conf || conf <= 0) return { ok: true };
  if (val % conf === 0) return { ok: true };
  return { ok: false, inf: Math.floor(val / conf) * conf || conf, sup: Math.ceil(val / conf) * conf };
}

function showQtyWarn(input, val, conf, rigaId, empCode) {
  const res = validaQty(val, conf);
  if (res.ok) { hideQtyWarn(); return; }
  pendingVal = { rigaId, empCode, input, val, conf, inf: res.inf, sup: res.sup };
  document.getElementById('qty-warn-msg').textContent =
    val + ' non è multiplo di ' + conf + '. Suggerito: ' + res.inf + ' o ' + res.sup;
  const warn = document.getElementById('qty-warn');
  const rect = input.getBoundingClientRect();
  warn.style.top  = (rect.bottom + 6) + 'px';
  warn.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  warn.classList.remove('hidden');
}

function hideQtyWarn() {
  document.getElementById('qty-warn').classList.add('hidden');
  pendingVal = null;
}

function correggiQty() {
  if (!pendingVal) return;
  const { input, rigaId, empCode, conf, inf, sup, val } = pendingVal;
  const corrected = Math.abs(val - inf) <= Math.abs(val - sup) ? inf : sup;
  input.value = corrected;
  hideQtyWarn();
  commitQty(rigaId, empCode, corrected, input, conf);
}

function forzaQty() {
  if (!pendingVal) return;
  const { rigaId, empCode, val, input, conf } = pendingVal;
  hideQtyWarn();
  commitQty(rigaId, empCode, val, input, conf);
}

// ── QTY INPUT HANDLER ─────────────────────────────────────────────────
function onQty(rigaId, empCode, input, conf) {
  hideQtyWarn();
  const val = parseFloat(input.value) || 0;
  clearTimeout(saveTimers['warn-' + rigaId + '-' + empCode]);
  if (conf > 0 && val > 0 && val % conf !== 0) {
    saveTimers['warn-' + rigaId + '-' + empCode] = setTimeout(
      () => showQtyWarn(input, val, conf, rigaId, empCode), 600);
  } else {
    commitQty(rigaId, empCode, val, input, conf);
  }
}

function commitQty(rigaId, empCode, val, input, conf) {
  if (!quantitaMap[rigaId]) quantitaMap[rigaId] = {};
  if (!quantitaMap[rigaId][empCode]) quantitaMap[rigaId][empCode] = { ordine_corrente: 0 };
  quantitaMap[rigaId][empCode].ordine_corrente = val;

  // Update td class
  const td = document.getElementById('td-oc-' + rigaId + '-' + empCode);
  if (td) {
    if (val > 0) td.className = (conf > 0 && val % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val';
    else td.className = 'td-ord';
  }

  updateRowTotals(rigaId);
  aggiornaScontoBanner();

  clearTimeout(saveTimers['qty-' + rigaId + '-' + empCode]);
  setSave('💾 Salvando…', 'saving');
  saveTimers['qty-' + rigaId + '-' + empCode] = setTimeout(() => saveQty(rigaId, empCode), 800);
}

// ── KEYBOARD NAVIGATION ────────────────────────────────────────────────
function onQtyKey(e, input) {
  const key = e.key;
  if (key === 'Escape') { input.value = input._prev ?? input.value; hideQtyWarn(); input.blur(); return; }

  const rid  = input.dataset.rid;
  const col  = parseInt(input.dataset.col);
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);
  const nCols = emporiVis.length;

  if (key === 'Tab') {
    e.preventDefault(); hideQtyWarn();
    if (e.shiftKey) {
      if (col > 0) navCell(rid, col - 1, 0); else navCell(rid, nCols - 1, -1);
    } else {
      if (col < nCols - 1) navCell(rid, col + 1, 0); else navCell(rid, 0, 1);
    }
  } else if (key === 'Enter' || key === 'ArrowDown') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, 1);
  } else if (key === 'ArrowUp') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, -1);
  } else if (key === 'ArrowRight') {
    if (input.selectionStart === input.value.length && col < nCols - 1) { e.preventDefault(); navCell(rid, col + 1, 0); }
  } else if (key === 'ArrowLeft') {
    if (input.selectionStart === 0 && col > 0) { e.preventDefault(); navCell(rid, col - 1, 0); }
  }
}

function navCell(currentRid, targetCol, rowDelta) {
  let targetRid = currentRid;
  if (rowDelta !== 0) {
    const idx = righe.findIndex(r => r.id === currentRid);
    const next = idx + rowDelta;
    if (next < 0 || next >= righe.length) return;
    targetRid = righe[next].id;
  }
  const t = document.querySelector('[data-rid="' + targetRid + '"][data-col="' + targetCol + '"]');
  if (t) { t.focus(); t.select(); }
}

// ── SAVE QUANTITY ─────────────────────────────────────────────────────
async function saveQty(rigaId, empCode) {
  const key = rigaId + '-' + empCode;
  if (insertLocks[key]) return;
  const q = quantitaMap[rigaId]?.[empCode];
  if (!q) return;
  const val = q.ordine_corrente || 0;
  let error;
  if (q.id) {
    ({ error } = await DB.from('preordini_quantita')
      .update({ ordine_corrente: val }).eq('id', q.id));
  } else {
    insertLocks[key] = true;
    const { data, error: e } = await DB.from('preordini_quantita')
      .insert({ riga_id: rigaId, emporio_codice: empCode, ordine_corrente: val })
      .select().single();
    insertLocks[key] = false;
    error = e;
    if (data) quantitaMap[rigaId][empCode].id = data.id;
  }
  if (error) setSave('✗ Errore', 'err');
  else { setSave('✓ Salvato', 'saved'); setTimeout(clearSave, 2000); }
}

// ── RIEPILOGO ─────────────────────────────────────────────────────────
function toggleRiepilogo() {
  riepilogoVis = !riepilogoVis;
  document.getElementById('table-wrap').classList.toggle('hidden', riepilogoVis);
  document.getElementById('riepilogo-wrap').classList.toggle('hidden', !riepilogoVis);
  if (riepilogoVis) renderRiepilogo();
}

function renderRiepilogo() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const categorie = [...new Set(righe.map(r => r.categoria || '—'))].sort();
  let html = '<thead><tr><th>Categoria</th>';
  emporiVis.forEach(e => { html += '<th style="text-align:right">' + esc(e.codice) + '</th>'; });
  if (_iAmAdmin && emporiVis.length > 1) html += '<th style="text-align:right">TOT</th>';
  html += '<th style="text-align:right">€ IMP</th></tr></thead><tbody>';

  let gTot = 0, gEur = 0;
  categorie.forEach(cat => {
    const grp = righe.filter(r => (r.categoria || '—') === cat);
    const empO = {};
    emporiVis.forEach(emp => { empO[emp.codice] = 0; });
    let tTot = 0, tEur = 0;
    grp.forEach(r => {
      emporiVis.forEach(emp => {
        const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
        empO[emp.codice] += oc;
        tTot += oc;
        tEur += oc * (parseFloat(r.pvp_corrente) || 0);
      });
    });
    gTot += tTot; gEur += tEur;
    html += '<tr><td style="font-weight:600">' + esc(cat) + '</td>';
    emporiVis.forEach(emp => { html += '<td style="text-align:right;font-family:\'Nunito\',monospace">' + (empO[emp.codice] || '—') + '</td>'; });
    if (_iAmAdmin && emporiVis.length > 1) html += '<td style="text-align:right;font-family:\'Nunito\',monospace;font-weight:700;color:#16A34A">' + (tTot || '—') + '</td>';
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#166534">' + (tEur > 0 ? fmtEuro(tEur) : '—') + '</td>';
    html += '</tr>';
  });

  html += '<tr style="background:#1e293b;color:white;font-weight:700"><td>TOTALE</td>';
  emporiVis.forEach(emp => {
    const t = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const { pct } = calcolaSconto(emp.codice);
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (t || '—') +
      (pct > 0 ? '<span style="font-size:9px;color:#86efac;margin-left:3px">-' + pct + '%</span>' : '') + '</td>';
  });
  if (_iAmAdmin && emporiVis.length > 1) html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (gTot || '—') + '</td>';
  html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#4ade80">' + (gEur > 0 ? fmtEuro(gEur) : '—') + '</td>';
  html += '</tr></tbody>';
  document.getElementById('summary-table').innerHTML = html;
}

// ── EXPORT CSV ────────────────────────────────────────────────────────
function exportCSV() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const cols = ['Codice','Categoria','Prodotto','Conf','PVP cess.',
    'CR 2023','CR 2024','CR 2025','CR 2026'];
  emporiVis.forEach(e => { cols.push('ORD ' + e.codice); });
  if (_iAmAdmin && emporiVis.length > 1) cols.push('TOT ORD');
  cols.push('€ IMP');

  const rows = [cols.join(';')];
  righe.forEach(r => {
    const stor = STORICO_CR[r.codice] || {};
    let totOrd = 0, totEur = 0;
    const empData = [];
    emporiVis.forEach(emp => {
      const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
      totOrd += oc;
      totEur += oc * (parseFloat(r.pvp_corrente) || 0);
      empData.push(oc || '');
    });
    rows.push([
      csvQ(r.codice), csvQ(r.categoria), csvQ(r.prodotto),
      r.conf || '', r.pvp_corrente || '',
      stor[2023] ?? '', stor[2024] ?? '', stor[2025] ?? '', stor[2026] ?? '',
      ...empData,
      ...(_iAmAdmin && emporiVis.length > 1 ? [totOrd || ''] : []),
      totEur > 0 ? totEur.toFixed(2) : '',
    ].join(';'));
  });

  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'ordine_pasqua2027.csv'; a.click();
}

// ── UTILS ─────────────────────────────────────────────────────────────
function fmtEuro(n) { return '€ ' + parseFloat(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function csvQ(s)  { return '"' + String(s || '').replace(/"/g, '""') + '"'; }
function esc(s)   { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let _saveClearTimer = null;
function setSave(msg, type) {
  const el = document.getElementById('save-badge');
  el.textContent = msg; el.className = type;
  clearTimeout(_saveClearTimer);
}
function clearSave() {
  _saveClearTimer = setTimeout(() => {
    const el = document.getElementById('save-badge');
    el.className = ''; el.textContent = '';
  }, 100);
}

document.addEventListener('click', () => {
  if (!document.getElementById('qty-warn').classList.contains('hidden')) hideQtyWarn();
});
