// ── SELECT CAMPAIGN ────────────────────────────────────────────────────
async function selezionaCampagna(camp) {
  try {
    campagna = camp;
    document.getElementById('tb-titolo').textContent = camp.nome;
    mostraDeadline(camp.scadenza);

    const [{ data: emps }, { data: rigs }] = await Promise.all([
      DB.from('preordini_empori').select('*').eq('campagna_id', camp.id).order('ordine_visualizzazione'),
      DB.from('preordini_righe').select('*').eq('campagna_id', camp.id).order('ordine_riga'),
    ]);

    emporiAttivi = emps || [];
    righe = rigs || [];
    quantitaMap = {};
    righeArchiviati = [];
    mostraStoricoProd = false;
    const btnSP = document.getElementById('btn-storico-prod');
    if (btnSP) btnSP.classList.remove('emp-cb-label-on');

    if (_iAmAdmin) {
      filtroEmpori = new Set(emporiAttivi.map(e => e.codice));
      document.getElementById('emp-filter-wrap').classList.remove('hidden');
      buildFiltroUI();
    } else {
      document.getElementById('emp-filter-wrap').classList.add('hidden');
    }

    if (righe.length > 0) {
      let q = DB.from('preordini_quantita').select('*').in('riga_id', righe.map(r => r.id));
      if (!_iAmAdmin) q = q.eq('emporio_codice', mioEmpCodice);
      const { data: qtys } = await q;
      (qtys || []).forEach(qt => {
        if (!quantitaMap[qt.riga_id]) quantitaMap[qt.riga_id] = {};
        quantitaMap[qt.riga_id][qt.emporio_codice] = {
          id: qt.id,
          ordine_corrente: parseFloat(qt.ordine_corrente) || 0,
        };
      });
    }

    // Carica storico manuale da DB
    storicoManuale = {};
    {
      let sq = DB.from('preordini_storico_manuale').select('*');
      if (!_iAmAdmin && mioEmpCodice) sq = sq.eq('emporio_codice', mioEmpCodice);
      const { data: storRows } = await sq;
      (storRows || []).forEach(row => {
        if (!storicoManuale[row.codice]) storicoManuale[row.codice] = {};
        if (!storicoManuale[row.codice][row.emporio_codice]) storicoManuale[row.codice][row.emporio_codice] = {};
        storicoManuale[row.codice][row.emporio_codice][row.anno] = { a: row.acquistato, v: row.venduto };
      });
    }

    document.getElementById('table-loading').classList.add('hidden');
    document.getElementById('table-wrap').classList.remove('hidden');

    ['btn-riepilogo', 'btn-csv', 'btn-demetra', 'btn-print'].forEach(id => {
      document.getElementById(id).disabled = false;
    });

    filtroTesto = ''; filtroCategoria = '';
    sortRigheBy = null; sortRigheDir = 1;
    if (righe.length === 0) {
      document.getElementById('filtri-bar').classList.add('hidden');
      document.getElementById('thead').innerHTML = '';
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;font-style:italic">Nessun prodotto in questo preordine</td></tr>';
      document.getElementById('tfoot').innerHTML = '';
    } else {
      buildFiltriBar();
      renderTable();
    }
    aggiornaScontoBanner();
    clearSave();
  } catch (err) {
    document.getElementById('table-loading').innerHTML =
      '<div style="font-size:13px;color:#dc2626;padding:40px;text-align:center">Errore: ' + err.message + '</div>';
  }
}

// ── DEADLINE CHIP ──────────────────────────────────────────────────────
function mostraDeadline(scadenza) {
  const chip = document.getElementById('tb-deadline');
  document.getElementById('deadline-editor').classList.add('hidden');

  if (!scadenza) {
    if (_iAmAdmin) {
      chip.className = 'deadline-chip nessuna';
      chip.textContent = '📅 Imposta scadenza';
      chip.onclick = editDeadline;
      chip.classList.remove('hidden');
    } else {
      chip.classList.add('hidden');
    }
    return;
  }

  const diff = Math.ceil((new Date(scadenza) - new Date()) / 86400000);
  let cls, label;
  const dateStr = new Date(scadenza).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  if (diff < 0) {
    cls = 'passata'; label = '📅 Scad. preordine: ' + dateStr + ' (passata)';
  } else if (diff <= 7) {
    cls = 'urgente'; label = '⏰ Scad. preordine: ' + dateStr + ' (' + diff + ' gg)';
  } else {
    cls = 'normale'; label = '📅 Scad. preordine: ' + dateStr;
  }
  if (_iAmAdmin) { cls += ' admin-edit'; }
  chip.className = 'deadline-chip ' + cls;
  chip.textContent = label + (_iAmAdmin ? ' ✎' : '');
  chip.onclick = _iAmAdmin ? editDeadline : null;
  chip.classList.remove('hidden');
}

function editDeadline() {
  const chip = document.getElementById('tb-deadline');
  const editor = document.getElementById('deadline-editor');
  const input  = document.getElementById('deadline-date-input');
  chip.classList.add('hidden');
  input.value = campagna?.scadenza ? campagna.scadenza.slice(0, 10) : '';
  editor.classList.remove('hidden');
  input.focus();
}

function annullaEditDeadline() {
  document.getElementById('deadline-editor').classList.add('hidden');
  mostraDeadline(campagna?.scadenza || null);
}

async function salvaScadenza() {
  const val = document.getElementById('deadline-date-input').value || null;
  const { error } = await DB.from('preordini_campagne').update({ scadenza: val }).eq('id', campagna.id);
  if (error) { alert('Errore salvataggio: ' + error.message); return; }
  campagna.scadenza = val;
  // Aggiorna anche la lista locale
  const c = campagneAll.find(x => x.id === campagna.id);
  if (c) c.scadenza = val;
  mostraDeadline(val);
}

// ── FILTRO EMPORI (admin only) ─────────────────────────────────────────
function buildFiltroUI() {
  const wrap = document.getElementById('emp-filter-wrap');
  wrap.innerHTML = '<span style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em">Empori:</span>';
  emporiAttivi.forEach(e => {
    const lbl = document.createElement('label');
    lbl.className = 'emp-cb-label';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = filtroEmpori.has(e.codice);
    cb.addEventListener('change', () => {
      if (cb.checked) filtroEmpori.add(e.codice);
      else filtroEmpori.delete(e.codice);
      renderTable();
      aggiornaScontoBanner();
    });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(e.codice));
    wrap.appendChild(lbl);
  });
}

// ── RENDER TABLE ───────────────────────────────────────────────────────
function renderTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const tfoot = document.getElementById('tfoot');

  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const nEmp = emporiVis.length;
  const hasTotOrd = _iAmAdmin && nEmp > 1;
  const STOR_ANNI_VIS = ALL_STOR_ANNI.filter(y => filtroAnniStor.has(y));
  const nStorSedi = _iAmAdmin ? 4 : 1; // 3 sedi + 1 colonna TOT per anno
  const nStorCols = STOR_ANNI_VIS.length * nStorSedi; // sedi × anni visibili
  const totalCols = 7 + nEmp + (hasTotOrd ? 1 : 0) + nStorCols + 2; // +2: € IMP + % inc.

  // Pre-calcola totale generale per incidenza
  const gEurTotal = righe.reduce((s, r) => {
    return s + emporiVis.reduce((se, emp) => {
      return se + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0);
    }, 0);
  }, 0);

  // THEAD ROW 1: fixed cols → order cols → storico header → € IMP
  // Sort indicator helper
  const sarr = col => {
    if (sortRigheBy !== col) return '<span class="sort-arrow">↕</span>';
    return '<span class="sort-arrow">' + (sortRigheDir > 0 ? '↑' : '↓') + '</span>';
  };

  let h1 = '<tr>';
  h1 += '<th rowspan="2" class="th-info col-s0 th-sortable' + (sortRigheBy==='codice'?' sort-active':'') + '" style="text-align:left;width:108px;min-width:108px" data-s="codice" onclick="sortTabella(this.dataset.s)">Foto · Codice' + sarr('codice') + '</th>';
  h1 += '<th rowspan="2" class="th-info col-s1 th-sortable' + (sortRigheBy==='categoria'?' sort-active':'') + '" style="text-align:left;width:110px;min-width:110px" data-s="categoria" onclick="sortTabella(this.dataset.s)">Categoria' + sarr('categoria') + '</th>';
  h1 += '<th rowspan="2" class="th-info col-s2 th-sortable' + (sortRigheBy==='prodotto'?' sort-active':'') + '" style="text-align:left;min-width:180px" data-s="prodotto" onclick="sortTabella(this.dataset.s)">Prodotto' + sarr('prodotto') + '</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:center;width:42px">Conf</th>';
  h1 += '<th rowspan="2" class="th-info th-sortable' + (sortRigheBy==='pvp_corrente'?' sort-active':'') + '" style="text-align:center;width:58px" data-s="pvp_corrente" onclick="sortTabella(this.dataset.s)">Costo i.e.' + sarr('pvp_corrente') + '</th>';
  h1 += '<th rowspan="2" class="th-info th-sortable' + (sortRigheBy==='pvp_consigliato'?' sort-active':'') + '" style="text-align:center;width:64px" data-s="pvp_consigliato" onclick="sortTabella(this.dataset.s)">PVP cons.' + sarr('pvp_consigliato') + '</th>';
  h1 += '<th rowspan="2" class="th-info th-sortable' + (sortRigheBy==='pvp_m361'?' sort-active':'') + '" style="text-align:center;width:64px" data-s="pvp_m361" onclick="sortTabella(this.dataset.s)">PVP m361' + sarr('pvp_m361') + '</th>';
  emporiVis.forEach(e => {
    h1 += '<th rowspan="2" class="th-emp" style="min-width:52px">' + esc(e.codice) + '<br><span style="font-size:8px;font-weight:600;opacity:.7">ord ' + String(campagna?.anno || '').slice(-2) + '</span></th>';
  });
  if (hasTotOrd) h1 += '<th rowspan="2" class="th-tot" style="min-width:54px">TOT<br>ORD</th>';
  h1 += '<th colspan="' + nStorCols + '" class="th-stor">STORICO · <span style="color:#94a3b8">A</span> <span style="color:#4ade80">V</span>' + (_iAmAdmin ? '' : ' <span style="font-size:9px;opacity:.6">(' + mioEmpCodice + ')</span>') + '</th>';
  h1 += '<th rowspan="2" class="th-tot" style="min-width:74px">€ IMP</th>';
  h1 += '<th rowspan="2" class="th-info" style="text-align:right;min-width:42px;background:#e0f2fe;color:#0369a1">% inc.</th>';
  h1 += '</tr>';

  // THEAD ROW 2: anni × sedi
  const STOR_ANNI = STOR_ANNI_VIS;
  const STOR_SEDI = _iAmAdmin
    ? [{ lbl:'CR', bdr:'border-left:2px solid #64748b;' }, { lbl:'CA', bdr:'' }, { lbl:'VI', bdr:'' }]
    : [{ lbl: mioEmpCodice, bdr:'border-left:2px solid #64748b;' }];
  let h2 = '<tr>';
  STOR_ANNI.forEach((y, yi) => {
    const isLastYear = yi === STOR_ANNI.length - 1;
    STOR_SEDI.forEach((s, si) => {
      const bL = s.bdr;
      const bR = (!_iAmAdmin && isLastYear && si === STOR_SEDI.length - 1) ? 'border-right:2px solid #64748b;' : '';
      h2 += '<th class="th-stor-year" style="min-width:' + (_iAmAdmin ? 38 : 52) + 'px;' + bL + bR + '">' + s.lbl + ' <span style="opacity:.6;font-size:8px">\'</span>' + String(y).slice(2) + '</th>';
    });
    if (_iAmAdmin) {
      const bR = isLastYear ? 'border-right:2px solid #64748b;' : '';
      h2 += '<th class="th-stor-year" style="min-width:44px;background:#0a2318;color:#4ade80;font-weight:800;' + bR + '">TOT <span style="opacity:.7;font-size:8px">\'</span>' + String(y).slice(2) + '</th>';
    }
  });
  h2 += '</tr>';
  thead.innerHTML = h1 + h2;

  // Apply text + category filters
  let righeFiltered = righe;
  if (filtroTesto) {
    const q = filtroTesto;
    righeFiltered = righeFiltered.filter(r =>
      (r.codice || '').toLowerCase().includes(q) ||
      (r.prodotto || '').toLowerCase().includes(q) ||
      (r.categoria || '').toLowerCase().includes(q)
    );
  }
  if (filtroCategoria) {
    righeFiltered = righeFiltered.filter(r => (r.categoria || '') === filtroCategoria);
  }
  const cntEl = document.getElementById('filtri-count');
  if (cntEl) {
    cntEl.textContent = (filtroTesto || filtroCategoria)
      ? righeFiltered.length + ' di ' + righe.length + ' prodotti'
      : '';
  }

  const fornitori = [...new Set(righeFiltered.map(r => r.fornitore || '—'))];
  let html = '';

  fornitori.forEach((forn, fi) => {
    const grp = righeFiltered.filter(r => (r.fornitore || '—') === forn);
    const fk  = 'fk' + fi;

    html += '<tr class="tr-fornitore" onclick="toggleForn(\'' + fk + '\')">' +
      '<td colspan="' + totalCols + '">' +
      '<span id="arr-' + fk + '">▼</span> ' + esc(forn) +
      ' <span style="font-size:10px;font-weight:400;opacity:.55">(' + grp.length + ')</span>' +
      '</td></tr>';

    let subEmpOrd = {};
    emporiVis.forEach(e => { subEmpOrd[e.codice] = 0; });

    // Apply sort within group
    let grpSorted = grp.slice();
    if (sortRigheBy) {
      grpSorted.sort((a, b) => {
        if (SORT_NUMERIC.has(sortRigheBy)) {
          const va = parseFloat(a[sortRigheBy]) || 0;
          const vb = parseFloat(b[sortRigheBy]) || 0;
          return (va - vb) * sortRigheDir;
        }
        const va = (a[sortRigheBy] || '').toLowerCase();
        const vb = (b[sortRigheBy] || '').toLowerCase();
        return va < vb ? -sortRigheDir : va > vb ? sortRigheDir : 0;
      });
    }

    grpSorted.forEach(riga => {
      const storBySede = {
        CR: { a: STORICO_CR[riga.codice]      || {}, v: STORICO_CR_VEND[riga.codice]      || {} },
        CA: { a: STORICO_CA[riga.codice]      || {}, v: STORICO_CA_VEND[riga.codice]      || {} },
        VI: { a: STORICO_VI[riga.codice]      || {}, v: STORICO_VI_VEND[riga.codice]      || {} },
      };
      const q     = quantitaMap[riga.id] || {};

      const fotoSrc = getFotoSrc(riga.codice);
      const fotoPos = getFotoPos(riga.codice);
      const nomeSafe = esc(riga.prodotto || '');
      html += '<tr class="product-row" data-fk="' + fk + '" data-riga-id="' + riga.id + '">';
      // Colonna fusa: foto + codice
      html += '<td class="col-s0" style="padding:3px 5px;position:relative;white-space:nowrap">';
      html += '<div style="display:flex;align-items:center;gap:5px">';
      if (fotoSrc) {
        html += '<div class="foto-cod-wrap" data-codice="' + riga.codice + '" data-nome="' + nomeSafe + '">';
        html += '<img src="' + fotoSrc + '" class="foto-cod-thumb" data-codice="' + riga.codice + '" ondblclick="apriLightboxFoto(this.dataset.codice,this.title)" title="' + nomeSafe + '">';
        if (_iAmAdmin) html += '<div class="foto-cod-overlay" data-codice="' + riga.codice + '" data-nome="' + nomeSafe + '" onclick="apriLightboxFoto(this.dataset.codice,this.dataset.nome)" title="Modifica foto">📷</div>';
        html += '</div>';
      } else if (_iAmAdmin) {
        html += '<button class="foto-cod-add" data-codice="' + riga.codice + '" data-nome="' + nomeSafe + '" onclick="apriLightboxFoto(this.dataset.codice,this.dataset.nome)" title="Carica foto">📷</button>';
      } else {
        html += '<div style="width:40px;height:40px;flex-shrink:0"></div>';
      }
      html += '<span style="color:#334155;font-size:11px;font-weight:600">' + esc(riga.codice || '') + '</span>';
      if (_iAmAdmin) html += '<button class="admin-edit-btn" data-rid="' + riga.id + '" onclick="event.stopPropagation();openEditRiga(this.dataset.rid)">✎</button>';
      html += '</div></td>';
      html += '<td class="col-s1" style="font-size:11px;color:#64748b;padding:3px 4px">' + esc(riga.categoria || '') + '</td>';

      // Prodotto con nota tooltip
      const noteHtml = riga.note
        ? '<span class="nota-wrap"><span class="nota-icon">📝</span><span class="nota-tip">' + esc(riga.note) + '</span></span>'
        : '';
      html += '<td class="col-s2" style="font-size:12px;font-weight:500;padding:3px 6px">' + esc(riga.prodotto || '') + noteHtml + '</td>';

      html += '<td style="text-align:center;color:#94a3b8;font-size:11px">' + (riga.conf || '') + '</td>';
      html += '<td style="text-align:right;color:#475569;font-size:11px;padding:2px 6px">' + (riga.pvp_corrente ? fmtEuro(riga.pvp_corrente) : '') + '</td>';
      const pvpConsRaw = riga.pvp_consigliato != null ? riga.pvp_consigliato : '';
      const pvpConsFmt = pvpConsRaw !== '' ? fmtEuro(pvpConsRaw) : '';
      if (_iAmAdmin) {
        html += '<td style="text-align:center;padding:1px 2px"><input class="pvp-m361-input" type="text" inputmode="decimal" value="' + pvpConsFmt + '" data-raw="' + pvpConsRaw + '" placeholder="—" onfocus="pvpFocus(this)" onblur="pvpBlur(this)" oninput="onPvpCons(\'' + riga.id + '\',this)" title="PVP consigliato"></td>';
      } else {
        html += '<td style="text-align:right;color:#64748b;font-size:11px;padding:2px 6px">' + pvpConsFmt + '</td>';
      }
      const pvpM361Raw = riga.pvp_m361 != null ? riga.pvp_m361 : (riga.pvp_consigliato != null ? riga.pvp_consigliato : '');
      const pvpM361Fmt = pvpM361Raw !== '' ? fmtEuro(pvpM361Raw) : '';
      html += '<td style="text-align:center;padding:1px 2px"><input class="pvp-m361-input" type="text" inputmode="decimal" value="' + pvpM361Fmt + '" data-raw="' + pvpM361Raw + '" placeholder="—" onfocus="pvpFocus(this)" onblur="pvpBlur(this)" oninput="onPvpM361(\'' + riga.id + '\',this)" title="PVP m361"></td>';

      // COLONNE ORDINE (prima dello storico)
      let totOrd = 0;
      emporiVis.forEach((emp, ei) => {
        const qt   = q[emp.codice] || {};
        const oc   = parseFloat(qt.ordine_corrente) || 0;
        totOrd += oc;
        const conf = parseFloat(riga.conf) || 0;
        const tdCls = oc > 0 ? ((conf > 0 && oc % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val') : 'td-ord';
        subEmpOrd[emp.codice] += oc;
        html += '<td class="' + tdCls + '" id="td-oc-' + riga.id + '-' + emp.codice + '">' +
          '<input class="cella-qty cella-ord" type="number" step="1" min="0" value="' + (oc || '') + '" ' +
          'data-rid="' + riga.id + '" data-col="' + ei + '" ' +
          'oninput="onQty(\'' + riga.id + '\',\'' + emp.codice + '\',this,' + conf + ')" ' +
          'onfocus="this._prev=this.value;this.select()" onkeydown="onQtyKey(event,this)">' +
          '</td>';
      });

      const pvp     = parseFloat(riga.pvp_corrente) || 0;
      const euroImp = totOrd * pvp;
      if (hasTotOrd) {
        const conf = parseFloat(riga.conf) || 0;
        const totOrdInvalid = totOrd > 0 && conf > 0 && totOrd % conf !== 0;
        html += '<td class="td-tot-ord' + (totOrdInvalid ? ' inv-val' : '') + '" id="tot-ord-' + riga.id + '" title="' + (totOrdInvalid ? '⚠ Non multiplo di conf (' + conf + ')' : '') + '">' + (totOrd || '') + '</td>';
      }

      // STORICO
      if (_iAmAdmin) {
        // Admin: storico CR/CA/VI + colonna TOT per anno
        STOR_ANNI.forEach((y, yi) => {
          let totA = null, totV = null;
          ['CR','CA','VI'].forEach((sede, si) => {
            const s   = storBySede[sede];
            const acq = s.a[y];
            const vnd = s.v[y];
            const bL  = (si === 0) ? 'border-left:2px solid #94a3b8;' : '';
            html += '<td class="td-stor" style="' + bL + '">' +
              '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq">' + (acq != null ? acq : '—') + '</span></div>' +
              '<div class="stor-div"></div>' +
              '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd">' + (vnd != null ? vnd : '—') + '</span></div>' +
              '</td>';
            if (acq != null) totA = (totA || 0) + acq;
            if (vnd != null) totV = (totV || 0) + vnd;
          });
          const bR = yi === STOR_ANNI.length - 1 ? 'border-right:2px solid #94a3b8;' : '';
          html += '<td class="td-stor" style="background:#081d10;' + bR + '">' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq" style="color:#6ee7b7;font-weight:800">' + (totA != null ? totA : '—') + '</span></div>' +
            '<div class="stor-div"></div>' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd" style="color:#4ade80;font-weight:800">' + (totV != null ? totV : '—') + '</span></div>' +
            '</td>';
        });
      } else {
        // Resp_acquisti: solo il proprio emporio, modificabile
        const emp = mioEmpCodice;
        STOR_ANNI.forEach((y, yi) => {
          const stored = storicoManuale[riga.codice]?.[emp]?.[y] || {};
          const acq = stored.a != null ? stored.a : null;
          const vnd = stored.v != null ? stored.v : null;
          const bL = (yi === 0) ? 'border-left:2px solid #94a3b8;' : '';
          const bR = (yi === STOR_ANNI.length - 1) ? 'border-right:2px solid #94a3b8;' : '';
          html += '<td class="td-stor" style="' + bL + bR + ';min-width:52px">' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span>' +
            '<input class="stor-input" type="number" min="0" value="' + (acq ?? '') + '" ' +
            'onchange="saveStoricoManuale(\'' + esc(riga.codice) + '\',\'' + emp + '\',' + y + ',\'a\',this.value,\'' + riga.id + '\')" title="Acquistato ' + y + '"></div>' +
            '<div class="stor-div"></div>' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span>' +
            '<input class="stor-input stor-input-v" type="number" min="0" value="' + (vnd ?? '') + '" ' +
            'onchange="saveStoricoManuale(\'' + esc(riga.codice) + '\',\'' + emp + '\',' + y + ',\'v\',this.value,\'' + riga.id + '\')" title="Venduto ' + y + '"></div>' +
            '</td>';
        });
      }

      const incPct = gEurTotal > 0 && euroImp > 0 ? (euroImp / gEurTotal * 100).toFixed(1) + '%' : '';
      html += '<td class="td-tot-eur" id="tot-eur-' + riga.id + '">' + (euroImp > 0 ? fmtEuro(euroImp) : '') + '</td>';
      html += '<td class="td-inc" id="inc-' + riga.id + '">' + incPct + '</td>';
      html += '</tr>';
    });

    // Riga subtotale
    html += '<tr class="tr-subtotal" data-fk="' + fk + '">';
    html += '<td colspan="7" style="text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.04em">TOTALE ' + esc(forn) + '</td>';
    let subTot = 0, subEur = 0;
    emporiVis.forEach(emp => {
      const so = subEmpOrd[emp.codice] || 0;
      subTot += so;
      html += '<td style="text-align:center;font-family:\'Nunito\',monospace;color:#16A34A;font-weight:700">' + (so || '') + '</td>';
    });
    grp.forEach(r => {
      emporiVis.forEach(emp => {
        subEur += (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0);
      });
    });
    if (hasTotOrd) {
      html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#16A34A;background:#f0fdf4">' + (subTot || '') + '</td>';
    }
    // Subtotale storico per fornitore (CR, CA, VI + TOT per anno)
    if (_iAmAdmin) {
      STOR_ANNI.forEach(y => {
        let totA = 0, totV = 0;
        ['CR','CA','VI'].forEach(sede => {
          const storA = { CR: STORICO_CR, CA: STORICO_CA, VI: STORICO_VI }[sede];
          const storV = { CR: STORICO_CR_VEND, CA: STORICO_CA_VEND, VI: STORICO_VI_VEND }[sede];
          let tA = 0, tV = 0;
          grp.forEach(r => { tA += storA[r.codice]?.[y] || 0; tV += storV[r.codice]?.[y] || 0; });
          totA += tA; totV += tV;
          html += '<td style="text-align:center;background:#f1f5f9;padding:2px 1px">' +
            '<div style="font-size:9px;color:#64748b;font-weight:700;line-height:1.4">' + (tA || '—') + '</div>' +
            '<div style="height:1px;background:#e2e8f0;margin:0 2px"></div>' +
            '<div style="font-size:9px;color:#16a34a;font-weight:700;line-height:1.4">' + (tV || '—') + '</div>' +
            '</td>';
        });
        html += '<td style="text-align:center;background:#e8f5ec;padding:2px 1px">' +
          '<div style="font-size:9px;color:#166534;font-weight:800;line-height:1.4">' + (totA || '—') + '</div>' +
          '<div style="height:1px;background:#bbf7d0;margin:0 2px"></div>' +
          '<div style="font-size:9px;color:#16a34a;font-weight:800;line-height:1.4">' + (totV || '—') + '</div>' +
          '</td>';
      });
    } else {
      STOR_ANNI.forEach(y => {
        let tA = 0, tV = 0;
        grp.forEach(r => {
          tA += storicoManuale[r.codice]?.[mioEmpCodice]?.[y]?.a || 0;
          tV += storicoManuale[r.codice]?.[mioEmpCodice]?.[y]?.v || 0;
        });
        html += '<td style="text-align:center;background:#f1f5f9;padding:2px 1px">' +
          '<div style="font-size:9px;color:#64748b;font-weight:700;line-height:1.4">' + (tA || '—') + '</div>' +
          '<div style="height:1px;background:#e2e8f0;margin:0 2px"></div>' +
          '<div style="font-size:9px;color:#16a34a;font-weight:700;line-height:1.4">' + (tV || '—') + '</div>' +
          '</td>';
      });
    }
    const subIncPct = gEurTotal > 0 && subEur > 0 ? (subEur / gEurTotal * 100).toFixed(1) + '%' : '';
    html += '<td style="text-align:right;font-family:\'Nunito\',monospace;color:#166534;background:#f0fdf4">' + (subEur > 0 ? fmtEuro(subEur) : '') + '</td>';
    html += '<td style="text-align:right;font-size:10px;font-weight:700;color:#0369a1;background:#e0f2fe">' + subIncPct + '</td>';
    html += '</tr>';
  });

  // Righe archiviati (prodotti non in questo preordine)
  if (mostraStoricoProd && righeArchiviati.length > 0) {
    html += '<tr class="tr-archivio-sep"><td colspan="' + totalCols + '">Prodotti non inclusi in questo preordine</td></tr>';
    righeArchiviati.forEach(riga => {
      const storBySede = {
        CR: { a: STORICO_CR[riga.codice] || {}, v: STORICO_CR_VEND[riga.codice] || {} },
        CA: { a: STORICO_CA[riga.codice] || {}, v: STORICO_CA_VEND[riga.codice] || {} },
        VI: { a: STORICO_VI[riga.codice] || {}, v: STORICO_VI_VEND[riga.codice] || {} },
      };
      const fotoSrc = getFotoSrc(riga.codice);
      const fotoPos = getFotoPos(riga.codice);
      html += '<tr class="tr-archivio">';
      html += '<td class="td-info col-s0" style="text-align:left">' +
        (fotoSrc ? '<img src="' + fotoSrc + '" style="width:32px;height:32px;object-fit:cover;object-position:' + fotoPos + ';border-radius:4px;vertical-align:middle;margin-right:4px">' : '') +
        '<span style="font-size:10px;font-family:monospace">' + esc(riga.codice) + '</span></td>';
      html += '<td class="td-info col-s1" style="text-align:left;font-size:10px">' + esc(riga.categoria || '') + '</td>';
      html += '<td class="td-info col-s2" style="text-align:left;font-size:10px">' + esc(riga.prodotto || '') + '</td>';
      html += '<td class="td-info" style="text-align:center;font-size:10px">' + (riga.conf || '') + '</td>';
      html += '<td class="td-info" style="text-align:center;font-size:10px">' + (riga.pvp_corrente ? fmtEuro(riga.pvp_corrente) : '') + '</td>';
      html += '<td class="td-info" style="text-align:center;font-size:10px">' + (riga.pvp_consigliato ? fmtEuro(riga.pvp_consigliato) : '') + '</td>';
      html += '<td class="td-info" style="text-align:center;font-size:10px">' + (riga.pvp_m361 ? fmtEuro(riga.pvp_m361) : '') + '</td>';
      for (let i = 0; i < nEmp; i++) html += '<td></td>';
      if (hasTotOrd) html += '<td></td>';
      if (_iAmAdmin) {
        STOR_ANNI.forEach((y, yi) => {
          let totA = null, totV = null;
          ['CR','CA','VI'].forEach((sede, si) => {
            const s   = storBySede[sede];
            const acq = s.a[y];
            const vnd = s.v[y];
            const bL  = (si === 0) ? 'border-left:2px solid #94a3b8;' : '';
            html += '<td class="td-stor" style="' + bL + '">' +
              '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq">' + (acq != null ? acq : '—') + '</span></div>' +
              '<div class="stor-div"></div>' +
              '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd">' + (vnd != null ? vnd : '—') + '</span></div>' +
              '</td>';
            if (acq != null) totA = (totA || 0) + acq;
            if (vnd != null) totV = (totV || 0) + vnd;
          });
          const bR = yi === STOR_ANNI.length - 1 ? 'border-right:2px solid #94a3b8;' : '';
          html += '<td class="td-stor" style="background:#081d10;' + bR + '">' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq" style="color:#6ee7b7;font-weight:800">' + (totA != null ? totA : '—') + '</span></div>' +
            '<div class="stor-div"></div>' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd" style="color:#4ade80;font-weight:800">' + (totV != null ? totV : '—') + '</span></div>' +
            '</td>';
        });
      } else {
        const emp = mioEmpCodice;
        STOR_ANNI.forEach((y, yi) => {
          const stored = storicoManuale[riga.codice]?.[emp]?.[y] || {};
          const acq = stored.a != null ? stored.a : null;
          const vnd = stored.v != null ? stored.v : null;
          const bL = (yi === 0) ? 'border-left:2px solid #94a3b8;' : '';
          const bR = (yi === STOR_ANNI.length - 1) ? 'border-right:2px solid #94a3b8;' : '';
          html += '<td class="td-stor" style="' + bL + bR + '">' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-a">A</span><span class="stor-acq">' + (acq != null ? acq : '—') + '</span></div>' +
            '<div class="stor-div"></div>' +
            '<div class="stor-row"><span class="stor-lbl stor-lbl-v">V</span><span class="stor-vnd">' + (vnd != null ? vnd : '—') + '</span></div>' +
            '</td>';
        });
      }
      html += '<td></td><td></td>';
      html += '</tr>';
    });
  }

  tbody.innerHTML = html;

  let foot = '<tr><td colspan="7" style="text-align:right;font-size:10px;letter-spacing:.06em">TOTALE GENERALE →</td>';
  let gTot = 0, gEur = 0;
  emporiVis.forEach(emp => {
    const eo = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const ee = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0), 0);
    gTot += eo; gEur += ee;
    foot += '<td style="text-align:center;color:#4ade80;font-family:\'Nunito\',monospace;font-weight:700">' + (eo || '') + '</td>';
  });
  if (hasTotOrd) {
    foot += '<td style="text-align:right;color:#4ade80;font-family:\'Nunito\',monospace;font-size:13px;background:#0f3d1e">' + (gTot || '') + '</td>';
  }
  // Storico footer: totale pezzi (A/V) per sede + colonna TOT per anno
  if (_iAmAdmin) {
    STOR_ANNI.forEach((y, yi) => {
      const isLastYear = yi === STOR_ANNI.length - 1;
      let gA = 0, gV = 0, gEur = 0;
      ['CR','CA','VI'].forEach((sede, si) => {
        const bL = si === 0 ? 'border-left:2px solid #4a5568;' : '';
        const storA = { CR: STORICO_CR, CA: STORICO_CA, VI: STORICO_VI }[sede];
        const storV = { CR: STORICO_CR_VEND, CA: STORICO_CA_VEND, VI: STORICO_VI_VEND }[sede];
        let tA = 0, tV = 0;
        righeFiltered.forEach(r => {
          tA += storA[r.codice]?.[y] || 0;
          tV += storV[r.codice]?.[y] || 0;
        });
        gA += tA; gV += tV;
        foot += '<td style="text-align:center;background:#1e293b;padding:2px 1px;vertical-align:middle;' + bL + '">' +
          '<div style="font-size:9px;color:#94a3b8;font-weight:700;line-height:1.4">' + (tA || '—') + '</div>' +
          '<div style="height:1px;background:#334155;margin:1px 2px"></div>' +
          '<div style="font-size:9px;color:#4ade80;font-weight:700;line-height:1.4">' + (tV || '—') + '</div>' +
          '</td>';
      });
      righeFiltered.forEach(r => { gEur += (STORICO_CR[r.codice]?.[y] || 0) * (parseFloat(r.pvp_corrente) || 0); });
      const bR = isLastYear ? 'border-right:2px solid #4a5568;' : '';
      foot += '<td style="text-align:center;background:#0a2318;padding:2px 1px;vertical-align:middle;' + bR + '">' +
        '<div style="font-size:9px;color:#6ee7b7;font-weight:800;line-height:1.4">' + (gA || '—') + '</div>' +
        '<div style="height:1px;background:#14532d;margin:1px 2px"></div>' +
        '<div style="font-size:9px;color:#4ade80;font-weight:800;line-height:1.4">' + (gV || '—') + '</div>' +
        (gEur > 0 ? '<div style="font-size:8px;color:#fbbf24;font-weight:700;line-height:1.3">' + fmtEuro(gEur) + '</div>' : '') +
        '</td>';
    });
  } else {
    const emp = mioEmpCodice;
    STOR_ANNI.forEach((y, yi) => {

// ── UPDATE ROW TOTALS ─────────────────────────────────────────────────
function updateRowTotals(rigaId) {
  const riga = righe.find(r => r.id === rigaId);
  const pvp  = parseFloat(riga?.pvp_corrente) || 0;
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  let tot = 0;
  emporiVis.forEach(emp => {
    tot += parseFloat(quantitaMap[rigaId]?.[emp.codice]?.ordine_corrente) || 0;
  });

  const conf = parseFloat(riga?.conf) || 0;
  const totInvalid = tot > 0 && conf > 0 && tot % conf !== 0;
  const eO = document.getElementById('tot-ord-' + rigaId);
  const eE = document.getElementById('tot-eur-' + rigaId);
  if (eO) {
    eO.textContent = tot || '';
    eO.classList.toggle('inv-val', totInvalid);
    eO.title = totInvalid ? '⚠ Non multiplo di conf (' + conf + ')' : '';
  }
  if (eE) eE.textContent = tot > 0 && pvp > 0 ? fmtEuro(tot * pvp) : '';
}

// ── STORICO MANUALE (resp_acquisti) ───────────────────────────────────
async function saveStoricoManuale(codice, empCodice, anno, tipo, value, rigaId) {
  const v = (value === '' || value == null) ? null : (parseInt(value) || 0);
  if (!storicoManuale[codice]) storicoManuale[codice] = {};
  if (!storicoManuale[codice][empCodice]) storicoManuale[codice][empCodice] = {};
  if (!storicoManuale[codice][empCodice][anno]) storicoManuale[codice][empCodice][anno] = {};
  storicoManuale[codice][empCodice][anno][tipo === 'a' ? 'a' : 'v'] = v;

  const acq = storicoManuale[codice][empCodice][anno].a ?? null;
  const vnd = storicoManuale[codice][empCodice][anno].v ?? null;

  const { error } = await DB.from('preordini_storico_manuale').upsert(
    { codice, emporio_codice: empCodice, anno, acquistato: acq, venduto: vnd, updated_at: new Date().toISOString() },
    { onConflict: 'codice,emporio_codice,anno' }
  );
  if (error) console.error('Errore salvataggio storico:', error.message);
}

// ── ORG MAPPING (codici preordini → organizzazione) ───────────────────
const EMP_ORG_MAP = {
  CR: 'meridiano361', CA: 'meridiano361', VI: 'meridiano361', RE: 'meridiano361',
  MN: 'mappamondo', MNU: 'mappamondo', MND: 'mappamondo',
};
const ORGS_INFO = {
  meridiano361: { nome: 'MERIDIANO361', colore: '#1e293b', light: '#f1f5f9' },
  mappamondo:   { nome: 'Mappamondo',   colore: '#1d4ed8', light: '#eff6ff' },
};

function empOriByOrg(emporiList) {
  const map = {};
  emporiList.forEach(e => {
    const org = EMP_ORG_MAP[e.codice] || 'altro';
    if (!map[org]) map[org] = [];
    map[org].push(e);
  });
  return map;
}

function analizzaCondizioniOrg(orgKey, emporiOrg) {
  // Calcola il totale aggregato per tutti gli empori dell'org
  const totEuro = righe.reduce((sum, r) => {
    const pvp = parseFloat(r.pvp_corrente) || 0;
    const ocSum = emporiOrg.reduce((s, emp) =>
      s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    return sum + ocSum * pvp;
  }, 0);

  const tiers = (campagna?.scaglioni && Array.isArray(campagna.scaglioni) && campagna.scaglioni.length > 0)
    ? [...campagna.scaglioni].filter(t => t.min || t.pct).sort((a, b) => b.min - a.min).concat([{ min: 0, pct: 0 }])
    : SCONTO_TIERS;
  const tier = tiers.find(t => totEuro >= t.min) || tiers[tiers.length - 1];

  // Regola collo a livello org: se almeno un emporio ordina una referenza,
  // almeno uno degli empori dell'org deve avere qty >= conf per quella referenza.
  let colloOk = true;
  if (campagna?.regola_collo) {
    outer: for (const r of righe) {
      const conf = parseFloat(r.conf) || 0;
      if (conf <= 0) continue;
      const hasQty = emporiOrg.some(emp =>
        (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) > 0
      );
      if (!hasQty) continue;
      const anyRespects = emporiOrg.some(emp =>
        (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) >= conf
      );
      if (!anyRespects) { colloOk = false; break outer; }
    }
  }

  const soglieStatus = (campagna?.soglie_categoria || []).map(soglia => {
    const tot = righe.reduce((sum, r) => {
      if (soglia.categoria && (r.categoria || '').toLowerCase() !== (soglia.categoria || '').toLowerCase()) return sum;
      const pvp = parseFloat(r.pvp_corrente) || 0;
      const ocSum = emporiOrg.reduce((s, emp) =>
        s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
      return sum + ocSum * pvp;
    }, 0);
    return { ...soglia, tot, ok: tot >= (soglia.importo_min || 0) };
  });

  const scontoApplicabile = !campagna?.regola_collo || colloOk;
  const pct   = scontoApplicabile ? (tier.pct || 0) : 0;
  const netto = totEuro * (1 - pct / 100);
  const sconto = totEuro - netto;
  return { totEuro, pct, tier, netto, sconto, colloOk, soglieStatus, scontoApplicabile };
}

// ── SCONTO BANNER ─────────────────────────────────────────────────────
function analizzaCondizioni(empCodice) {
  const totEuro = righe.reduce((sum, r) => {
    const oc  = parseFloat(quantitaMap[r.id]?.[empCodice]?.ordine_corrente) || 0;
    const pvp = parseFloat(r.pvp_corrente) || 0;
    return sum + oc * pvp;
  }, 0);

  // Scaglioni
  const tiers = (campagna?.scaglioni && Array.isArray(campagna.scaglioni) && campagna.scaglioni.length > 0)
    ? [...campagna.scaglioni].filter(t => t.min || t.pct).sort((a, b) => b.min - a.min).concat([{ min: 0, pct: 0 }])
    : SCONTO_TIERS;
  const tier = tiers.find(t => totEuro >= t.min) || tiers[tiers.length - 1];

  // Regola collo: ogni referenza con qty>0 deve avere qty >= conf
  let colloOk = true;
  let colloViolazioni = 0;
  if (campagna?.regola_collo) {
    for (const r of righe) {
      const oc   = parseFloat(quantitaMap[r.id]?.[empCodice]?.ordine_corrente) || 0;
      const conf = parseFloat(r.conf) || 0;
      if (oc > 0 && conf > 0 && oc < conf) { colloOk = false; colloViolazioni++; }
    }
  }

  // Soglie per categoria
  const soglieStatus = (campagna?.soglie_categoria || []).map(soglia => {
    const tot = righe.reduce((sum, r) => {
      if (soglia.categoria && (r.categoria || '').toLowerCase() !== (soglia.categoria || '').toLowerCase()) return sum;
      const oc  = parseFloat(quantitaMap[r.id]?.[empCodice]?.ordine_corrente) || 0;
      const pvp = parseFloat(r.pvp_corrente) || 0;
      return sum + oc * pvp;
    }, 0);
    return { ...soglia, tot, ok: tot >= (soglia.importo_min || 0) };
  });

  // Lo sconto si applica solo se regola_collo è rispettata (quando abilitata)
  const scontoApplicabile = !campagna?.regola_collo || colloOk;
  const pct   = scontoApplicabile ? (tier.pct || 0) : 0;
  const netto = totEuro * (1 - pct / 100);
  const sconto = totEuro - netto;

  return { totEuro, pct, tier, netto, sconto, colloOk, colloViolazioni, soglieStatus, scontoApplicabile };
}

function calcolaSconto(empCodice) {
  const { totEuro, pct } = analizzaCondizioni(empCodice);
  return { totEuro, pct };
}

// ── QTY VALIDATION ────────────────────────────────────────────────────
function validaQty(val, conf) {
  if (val === 0 || !conf || conf <= 0) return { ok: true };
  if (val % conf === 0) return { ok: true };
  return { ok: false, inf: Math.floor(val / conf) * conf || conf, sup: Math.ceil(val / conf) * conf };
}

function showQtyWarn(input, val, conf, rigaId, empCode) {
  const res = validaQty(val, conf);
  if (res.ok) { hideQtyWarn(); return; }
  pendingVal = { rigaId, empCode, input, val, conf, inf: res.inf, sup: res.sup };
  document.getElementById('qty-warn-msg').textContent =
    val + ' non è multiplo di ' + conf + '. Suggerito: ' + res.inf + ' o ' + res.sup;
  const warn = document.getElementById('qty-warn');
  const rect = input.getBoundingClientRect();
  warn.style.top  = (rect.bottom + 6) + 'px';
  warn.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  warn.classList.remove('hidden');
}

function hideQtyWarn() {
  document.getElementById('qty-warn').classList.add('hidden');
  pendingVal = null;
}

function correggiQty() {
  if (!pendingVal) return;
  const { input, rigaId, empCode, conf, inf, sup, val } = pendingVal;
  const corrected = Math.abs(val - inf) <= Math.abs(val - sup) ? inf : sup;
  input.value = corrected;
  hideQtyWarn();
  commitQty(rigaId, empCode, corrected, input, conf);
}

function forzaQty() {
  if (!pendingVal) return;
  const { rigaId, empCode, val, input, conf } = pendingVal;
  hideQtyWarn();
  commitQty(rigaId, empCode, val, input, conf);
}

function onQty(rigaId, empCode, input, conf) {
  hideQtyWarn();
  const val = parseFloat(input.value) || 0;
  clearTimeout(saveTimers['warn-' + rigaId + '-' + empCode]);
  if (conf > 0 && val > 0 && val % conf !== 0) {
    saveTimers['warn-' + rigaId + '-' + empCode] = setTimeout(
      () => showQtyWarn(input, val, conf, rigaId, empCode), 600);
  } else {
    commitQty(rigaId, empCode, val, input, conf);
  }
}

function commitQty(rigaId, empCode, val, input, conf) {
  if (!quantitaMap[rigaId]) quantitaMap[rigaId] = {};
  if (!quantitaMap[rigaId][empCode]) quantitaMap[rigaId][empCode] = { ordine_corrente: 0 };
  quantitaMap[rigaId][empCode].ordine_corrente = val;

  const td = document.getElementById('td-oc-' + rigaId + '-' + empCode);
  if (td) {
    if (val > 0) td.className = (conf > 0 && val % conf !== 0) ? 'td-ord inv-val' : 'td-ord has-val';
    else td.className = 'td-ord';
  }

  updateRowTotals(rigaId);
  aggiornaScontoBanner();

  clearTimeout(saveTimers['qty-' + rigaId + '-' + empCode]);
  setSave('💾 Salvando…', 'saving');
  saveTimers['qty-' + rigaId + '-' + empCode] = setTimeout(() => saveQty(rigaId, empCode), 800);
}

function onQtyKey(e, input) {
  const key = e.key;
  if (key === 'Escape') { input.value = input._prev ?? input.value; hideQtyWarn(); input.blur(); return; }

  const rid  = input.dataset.rid;
  const col  = parseInt(input.dataset.col);
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);
  const nCols = emporiVis.length;

  if (key === 'Tab') {
    e.preventDefault(); hideQtyWarn();
    if (e.shiftKey) {
      if (col > 0) navCell(rid, col - 1, 0); else navCell(rid, nCols - 1, -1);
    } else {
      if (col < nCols - 1) navCell(rid, col + 1, 0); else navCell(rid, 0, 1);
    }
  } else if (key === 'Enter' || key === 'ArrowDown') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, 1);
  } else if (key === 'ArrowUp') {
    e.preventDefault(); hideQtyWarn(); navCell(rid, col, -1);
  } else if (key === 'ArrowRight') {
    if (input.selectionStart === input.value.length && col < nCols - 1) { e.preventDefault(); navCell(rid, col + 1, 0); }
  } else if (key === 'ArrowLeft') {
    if (input.selectionStart === 0 && col > 0) { e.preventDefault(); navCell(rid, col - 1, 0); }
  }
}

function navCell(currentRid, targetCol, rowDelta) {
  let targetRid = currentRid;
  if (rowDelta !== 0) {
    const idx  = righe.findIndex(r => r.id === currentRid);
    const next = idx + rowDelta;
    if (next < 0 || next >= righe.length) return;
    targetRid = righe[next].id;
  }
  const t = document.querySelector('[data-rid="' + targetRid + '"][data-col="' + targetCol + '"]');
  if (t) { t.focus(); t.select(); }
}

async function saveQty(rigaId, empCode) {
  const key = rigaId + '-' + empCode;
  if (insertLocks[key]) return;
  const q = quantitaMap[rigaId]?.[empCode];
  if (!q) return;
  const val = q.ordine_corrente || 0;
  let error;
  if (q.id) {
    ({ error } = await DB.from('preordini_quantita')
      .update({ ordine_corrente: val }).eq('id', q.id));
  } else {
    insertLocks[key] = true;
    const { data, error: e } = await DB.from('preordini_quantita')
      .insert({ riga_id: rigaId, emporio_codice: empCode, ordine_corrente: val })
      .select().single();
    insertLocks[key] = false;
    error = e;
    if (data) quantitaMap[rigaId][empCode].id = data.id;
  }
  if (error) setSave('✗ Errore', 'err');
  else { setSave('✓ Salvato', 'saved'); setTimeout(clearSave, 2000); }
}

      const pvpVend = parseFloat(r.pvp_m361) || parseFloat(r.pvp_consigliato) || pvpAcq;
      emporiVis.forEach(emp => {
        const qty = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
        totAcq          += qty * pvpAcq;
        totRicavoIvaInc += qty * pvpVend;
      });
    });
    let projHtml = '';
    if (totRicavoIvaInc > 0) {
      const totRicavoIvaEscl = totRicavoIvaInc / IVA;
      const margine          = totRicavoIvaEscl - totAcq;
      const marginePct       = totRicavoIvaEscl > 0 ? (margine / totRicavoIvaEscl * 100).toFixed(1) : 0;
      const mCol = margine >= 0 ? '#16a34a' : '#dc2626';
      projHtml = '<div style="border:2px solid #bbf7d0;border-radius:12px;padding:16px;margin-bottom:14px;background:#f0fdf4">' +
        '<div style="font-size:12px;font-weight:900;color:#166534;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">📈 Proiezione vendita (se vendi tutto)</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">' +

        '<div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:14px">' +
        '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Acquisto (IVA escl.)</div>' +
        '<div style="font-size:18px;font-weight:900;color:#1e293b">' + fmtEuro(totAcq) + '</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Costo d\'acquisto × quantità ordinate</div>' +
        '</div>' +

        '<div style="background:white;border:1px solid #bfdbfe;border-radius:10px;padding:14px">' +
        '<div style="font-size:10px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Ricavo IVA incl.</div>' +
        '<div style="font-size:18px;font-weight:900;color:#1d4ed8">' + fmtEuro(totRicavoIvaInc) + '</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px">PVP M361 × quantità ordinate</div>' +
        '</div>' +

        '<div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:14px">' +
        '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Ricavo IVA escl. (÷ 1,10)</div>' +
        '<div style="font-size:18px;font-weight:900;color:#1e293b">' + fmtEuro(totRicavoIvaEscl) + '</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Applicata IVA 10% alimentari</div>' +
        '</div>' +

        '<div style="background:white;border:2px solid ' + mCol + '40;border-radius:10px;padding:14px">' +
        '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Margine lordo (IVA escl.)</div>' +
        '<div style="font-size:18px;font-weight:900;color:' + mCol + '">' + fmtEuro(margine) + '</div>' +
        '<div style="font-size:13px;font-weight:800;color:' + mCol + ';margin-top:2px">' + marginePct + '% sul ricavo</div>' +
        '<div style="font-size:10px;color:#94a3b8;margin-top:2px">Ricavo IVA escl. − Costo acquisto</div>' +
        '</div>' +

        '</div></div>';
    }
    commEl.innerHTML = projHtml;
  }

  if (hasCond && emporiVis.length > 0) {
    const tiers = (campagna.scaglioni?.filter(t => t.min || t.pct) || []).sort((a, b) => a.min - b.min);
    const orgGroups = empOriByOrg(emporiVis);
    let cardHtml = '';

    Object.entries(orgGroups).forEach(([orgKey, empsOrg]) => {
      const orgInfo = ORGS_INFO[orgKey] || { nome: orgKey, colore: '#64748b', light: '#f8fafc' };
      const orgCond = analizzaCondizioniOrg(orgKey, empsOrg);

      cardHtml += '<div style="border:2px solid ' + orgInfo.colore + '30;border-radius:12px;padding:14px;margin-bottom:14px;background:' + orgInfo.light + '">';
      // Org header + totale
      cardHtml += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
      cardHtml += '<span style="font-size:12px;font-weight:900;color:' + orgInfo.colore + ';background:' + orgInfo.colore + '15;padding:3px 10px;border-radius:6px">' + orgInfo.nome + '</span>';
      cardHtml += '<span style="font-size:13px;font-weight:800;color:#1e293b">TOT: ' + fmtEuro(orgCond.totEuro) + '</span>';
      if (orgCond.pct > 0) {
        cardHtml += '<span style="font-size:12px;color:#16a34a;font-weight:700">→ -' + orgCond.pct + '% = ' + fmtEuro(orgCond.netto) + '</span>';
        cardHtml += '<span style="font-size:11px;color:#86efac">(risparmi ' + fmtEuro(orgCond.sconto) + ')</span>';
      } else {
        cardHtml += '<span style="font-size:11px;color:#94a3b8">nessuno sconto raggiunto</span>';
      }
      cardHtml += '</div>';

      // Grid per-emporio
      cardHtml += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">';
      empsOrg.forEach(emp => {
      const cond = analizzaCondizioni(emp.codice);
      const totEuro = cond.totEuro;
      // Sconto e collo determinati a livello org, non per singolo emporio
      const pct    = orgCond.scontoApplicabile ? (orgCond.tier?.pct || 0) : 0;
      const sconto = totEuro * pct / 100;
      const netto  = totEuro - sconto;
      const colloOk = orgCond.colloOk;
      const { soglieStatus } = cond;

      cardHtml += '<div style="background:white;border:1px solid #e2e8f0;border-radius:10px;padding:14px;font-size:12px">';
      cardHtml += '<div style="font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">' + esc(emp.codice) + (emp.nome ? ' · ' + esc(emp.nome) : '') + '</div>';

      // Totali
      cardHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#64748b">Imponibile totale</span><strong>' + fmtEuro(totEuro) + '</strong></div>';
      if (pct > 0) {
        cardHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:#64748b">Sconto (' + pct + '%)</span><strong style="color:#16a34a">- ' + fmtEuro(sconto) + '</strong></div>';
        cardHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-top:6px;border-top:1px solid #e2e8f0"><span style="font-weight:700">Totale netto</span><strong style="font-size:14px;color:#16a34a">' + fmtEuro(netto) + '</strong></div>';
      } else {
        cardHtml += '<div style="display:flex;justify-content:space-between;margin-bottom:10px;color:#94a3b8;font-size:11px"><span>Nessuno sconto raggiunto</span></div>';
      }

      // Scaglioni progressi
      if (tiers.length > 0) {
        cardHtml += '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">Scaglioni sconto</div>';
        tiers.forEach(t => {
          const reached = totEuro >= t.min && t.pct > 0;
          const mancano = !reached && t.min > 0 ? t.min - totEuro : 0;
          const ico = reached ? '✓' : (mancano < 500 && mancano > 0 ? '◎' : '○');
          const col = reached ? '#16a34a' : (mancano < 500 && mancano > 0 ? '#d97706' : '#94a3b8');
          cardHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">';
          cardHtml += '<span style="color:' + col + ';font-weight:700">' + ico + ' ' + t.pct + '% da ' + fmtEuro(t.min) + '</span>';
          if (!reached && mancano > 0) cardHtml += '<span style="font-size:10px;color:#94a3b8">mancano ' + fmtEuro(mancano) + '</span>';
          cardHtml += '</div>';
        });
      }

      // Soglie categoria
      if (soglieStatus.length > 0) {
        cardHtml += '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 5px">Obiettivi per categoria</div>';
        soglieStatus.forEach(s => {
          const mancano = !s.ok && s.importo_min > 0 ? s.importo_min - s.tot : 0;
          cardHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">';
          cardHtml += '<span style="color:' + (s.ok ? '#16a34a' : '#dc2626') + ';font-weight:700">' + (s.ok ? '✓' : '✗') + ' ' + esc(s.label || s.categoria || '—') + '</span>';
          cardHtml += '<span style="font-size:10px;color:#64748b">' + fmtEuro(s.tot) + ' / ' + fmtEuro(s.importo_min) + '</span>';
          cardHtml += '</div>';
          if (!s.ok && s.descrizione) cardHtml += '<div style="font-size:10px;color:#94a3b8;margin-bottom:2px;padding-left:14px">' + esc(s.descrizione) + '</div>';
        });
      }

      // Minimo ordine
      if (campagna.min_ordine) {
        const ok = totEuro >= campagna.min_ordine;
        cardHtml += '<div style="display:flex;justify-content:space-between;margin-top:6px">';
        cardHtml += '<span style="color:' + (ok ? '#16a34a' : '#dc2626') + ';font-weight:700">' + (ok ? '✓' : '✗') + ' Minimo ordine ' + fmtEuro(campagna.min_ordine) + '</span>';
        if (!ok) cardHtml += '<span style="font-size:10px;color:#94a3b8">mancano ' + fmtEuro(campagna.min_ordine - totEuro) + '</span>';
        cardHtml += '</div>';
      }

      // Regola collo (valutata sull'organizzazione, non sul singolo emporio)
      if (campagna.regola_collo) {
        const col = colloOk ? '#16a34a' : '#dc2626';
        cardHtml += '<div style="color:' + col + ';font-weight:700;margin-top:6px">';
        cardHtml += (colloOk ? '✓' : '✗') + ' 1 collo per referenza (org)';
        cardHtml += '</div>';
        if (!colloOk) cardHtml += '<div style="font-size:10px;color:#94a3b8;margin-top:2px;padding-left:14px">Nessun emporio dell\'org raggiunge 1 collo su almeno una referenza — lo sconto non è applicato</div>';
      }

      cardHtml += '</div>';
      }); // end empsOrg.forEach
      cardHtml += '</div>'; // end grid
      // Scaglioni progress per org
      if (tiers.length > 0) {
        cardHtml += '<div style="margin-top:12px;padding-top:10px;border-top:1px solid ' + orgInfo.colore + '20">';
        cardHtml += '<div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">Scaglioni (' + orgInfo.nome + ')</div>';
        tiers.forEach(t => {
          const reached = orgCond.totEuro >= t.min && t.pct > 0;
          const mancano = !reached && t.min > 0 ? t.min - orgCond.totEuro : 0;
          const ico = reached ? '✓' : (mancano < 500 && mancano > 0 ? '◎' : '○');
          const col = reached ? '#16a34a' : (mancano < 500 && mancano > 0 ? '#d97706' : '#94a3b8');
          cardHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;font-size:11px">';
          cardHtml += '<span style="color:' + col + ';font-weight:700">' + ico + ' ' + t.pct + '% da ' + fmtEuro(t.min) + '</span>';
          if (!reached && mancano > 0) cardHtml += '<span style="color:#94a3b8">mancano ' + fmtEuro(mancano) + '</span>';
          cardHtml += '</div>';
        });
        cardHtml += '</div>';
      }
      cardHtml += '</div>'; // end org wrapper
    }); // end orgGroups.forEach
    commEl.innerHTML += cardHtml;
  }

  // ── Thead row 1: Categoria | [EMP colspan=2]... | TOT PZ | € IMP | % inc.
  let h1 = '<tr>';
  h1 += '<th rowspan="2" style="text-align:left;min-width:120px">Categoria</th>';
  emporiVis.forEach(e => {
    h1 += '<th colspan="2" class="th-emp-head">' + esc(e.codice) + '</th>';
  });
  if (hasTot) h1 += '<th rowspan="2" style="text-align:right;min-width:54px">TOT<br>PZ</th>';
  h1 += '<th rowspan="2" style="text-align:right;min-width:80px">€ IMP</th>';
  h1 += '<th rowspan="2" style="text-align:right;min-width:52px;color:#7dd3fc">% INC.</th>';
  h1 += '</tr>';

  // ── Thead row 2: PZ | € per ogni emporio
  let h2 = '<tr>';
  emporiVis.forEach(() => {
    h2 += '<th class="th-sub th-sub-pz">PZ</th>';
    h2 += '<th class="th-sub th-sub-eur">€</th>';
  });
  h2 += '</tr>';

  let html = '<thead>' + h1 + h2 + '</thead><tbody>';

  // Calcola dati per categoria (doppia passata per avere gEur per le %)
  let gTot = 0, gEur = 0;
  const catData = categorie.map(cat => {
    const grp = righe.filter(r => (r.categoria || '—') === cat);
    const empPz = {}, empEur = {};
    emporiVis.forEach(e => { empPz[e.codice] = 0; empEur[e.codice] = 0; });
    let tTot = 0, tEur = 0;
    grp.forEach(r => {
      const pvp = parseFloat(r.pvp_corrente) || 0;
      emporiVis.forEach(emp => {
        const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
        empPz[emp.codice]  += oc;
        empEur[emp.codice] += oc * pvp;
        tTot += oc;
        tEur += oc * pvp;
      });
    });
    gTot += tTot; gEur += tEur;
    return { cat, empPz, empEur, tTot, tEur };
  });

  catData.forEach(({ cat, empPz, empEur, tTot, tEur }) => {
    const incPct = gEur > 0 && tEur > 0 ? (tEur / gEur * 100).toFixed(1) + '%' : '—';
    html += '<tr>';
    html += '<td style="font-weight:600;color:#1e293b">' + esc(cat) + '</td>';
    emporiVis.forEach(emp => {
      const pz = empPz[emp.codice];
      const eu = empEur[emp.codice];
      html += '<td class="td-emp-pz">' + (pz || '—') + '</td>';
      html += '<td class="td-emp-eur">' + (eu > 0 ? fmtEuro(eu) : '—') + '</td>';
    });
    if (hasTot) html += '<td style="text-align:right;font-weight:700;color:#16A34A;font-family:\'Nunito\',monospace">' + (tTot || '—') + '</td>';
    html += '<td style="text-align:right;font-weight:700;color:#166534;font-family:\'Nunito\',monospace">' + (tEur > 0 ? fmtEuro(tEur) : '—') + '</td>';
    html += '<td style="text-align:right;font-weight:700;color:#0369a1;background:#e0f2fe">' + incPct + '</td>';
    html += '</tr>';
  });

  // Totale generale
  html += '<tr style="background:#1e293b;color:white;font-weight:700">';
  html += '<td>TOTALE</td>';
  emporiVis.forEach(emp => {
    const pz = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
    const eu = righe.reduce((s,r) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0) * (parseFloat(r.pvp_corrente) || 0), 0);
    const { pct } = calcolaSconto(emp.codice);
    html += '<td style="text-align:right;color:#4ade80;border-left:2px solid #334155;font-family:\'Nunito\',monospace">' +
      (pz || '—') + (pct > 0 ? '<span style="font-size:9px;color:#86efac;margin-left:3px">-' + pct + '%</span>' : '') + '</td>';
    html += '<td style="text-align:right;color:#86efac;font-size:11px;border-right:2px solid #334155;font-family:\'Nunito\',monospace">' +
      (eu > 0 ? fmtEuro(eu) : '—') + '</td>';
  });
  if (hasTot) html += '<td style="text-align:right;color:#4ade80;font-family:\'Nunito\',monospace">' + (gTot || '—') + '</td>';
  html += '<td style="text-align:right;color:#4ade80;font-family:\'Nunito\',monospace">' + (gEur > 0 ? fmtEuro(gEur) : '—') + '</td>';
  html += '<td style="text-align:right;color:#7dd3fc;font-weight:800">100%</td>';
  html += '</tr></tbody>';

  document.getElementById('summary-table').innerHTML = html;
}

// ── EXPORT CSV ────────────────────────────────────────────────────────
function exportCSV() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  const cols = ['Codice','Categoria','Prodotto','Conf','Costo i.e.'];
  emporiVis.forEach(e => { cols.push('ORD ' + e.codice); });
  if (_iAmAdmin && emporiVis.length > 1) cols.push('TOT ORD');
  ['CR','CA','VI'].forEach(s => {
    [2026,2025,2024].forEach(y => cols.push(s+' '+y+' Acq', s+' '+y+' Vnd'));
  });
  cols.push('€ IMP');

  const rows = [cols.join(';')];
  righe.forEach(r => {
    let totOrd = 0, totEur = 0;
    const empData = [];
    emporiVis.forEach(emp => {
      const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
      totOrd += oc;
      totEur += oc * (parseFloat(r.pvp_corrente) || 0);
      empData.push(oc || '');
    });
    const storBySede = {
      CR: { a: STORICO_CR[r.codice]||{}, v: STORICO_CR_VEND[r.codice]||{} },
      CA: { a: STORICO_CA[r.codice]||{}, v: STORICO_CA_VEND[r.codice]||{} },
      VI: { a: STORICO_VI[r.codice]||{}, v: STORICO_VI_VEND[r.codice]||{} },
    };
    const storCols = [];
    ['CR','CA','VI'].forEach(s => {
      [2026,2025,2024].forEach(y => {
        storCols.push(storBySede[s].a[y] ?? '', storBySede[s].v[y] ?? '');
      });
    });
    rows.push([
      csvQ(r.codice), csvQ(r.categoria), csvQ(r.prodotto),
      r.conf || '', r.pvp_corrente || '',
      ...empData,
      ...(_iAmAdmin && emporiVis.length > 1 ? [totOrd || ''] : []),
      ...storCols,
      totEur > 0 ? totEur.toFixed(2) : '',
    ].join(';'));
  });

  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (campagna?.nome || 'preordine').replace(/\s+/g,'_').toLowerCase() + '.csv';
  a.click();
}

function exportDemetra() {
  const emporiVis = _iAmAdmin
    ? emporiAttivi.filter(e => filtroEmpori.has(e.codice))
    : emporiAttivi.filter(e => e.codice === mioEmpCodice);

  if (emporiVis.length === 0) { alert('Nessun emporio selezionato.'); return; }

  if (emporiVis.length === 1) {
    _doExportDemetra(emporiVis, false);
    return;
  }

  // Più empori → mostra dialogo
  document.getElementById('demetra-dialog')?.remove();
  const empHtml = emporiVis.map(e =>
    '<label style="display:flex;align-items:center;gap:7px;margin-bottom:5px;cursor:pointer;font-size:13px">' +
    '<input type="checkbox" class="demetra-emp-cb" value="' + e.codice + '" checked style="width:15px;height:15px">' +
    e.nome + '</label>'
  ).join('');
  document.body.insertAdjacentHTML('beforeend',
    '<div id="demetra-dialog" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="if(event.target===this)this.remove()">' +
    '<div style="background:#fff;border-radius:12px;padding:24px;min-width:290px;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.25)">' +
    '<div style="font-size:15px;font-weight:800;color:#1e293b;margin-bottom:14px">Esporta Demetra</div>' +
    '<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px">Per quali empori?</div>' +
    empHtml +
    '<div style="height:1px;background:#f1f5f9;margin:12px 0"></div>' +
    '<label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;margin-bottom:16px">' +
    '<input type="checkbox" id="demetra-cb-totale" style="width:15px;height:15px">' +
    'Includi file totale (somma empori selezionati)</label>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button onclick="document.getElementById(\'demetra-dialog\').remove()" style="padding:7px 16px;border:1px solid #e2e8f0;border-radius:7px;background:#fff;cursor:pointer;font-size:13px;font-family:\'Nunito\',sans-serif">Annulla</button>' +
    '<button onclick="_confirmDemetra()" style="padding:7px 16px;border:none;border-radius:7px;background:#166534;color:#fff;cursor:pointer;font-size:13px;font-weight:700;font-family:\'Nunito\',sans-serif">Scarica</button>' +
    '</div></div></div>'
  );
  window._demetraEmporiVis = emporiVis;
}

function _confirmDemetra() {
  const emporiVis = window._demetraEmporiVis || [];
  const selezionati = emporiVis.filter(e =>
    document.querySelector('.demetra-emp-cb[value="' + e.codice + '"]')?.checked
  );
  const conTotale = document.getElementById('demetra-cb-totale')?.checked || false;
  document.getElementById('demetra-dialog')?.remove();
  if (!selezionati.length) { alert('Seleziona almeno un emporio.'); return; }
  _doExportDemetra(selezionati, conTotale);
}

function _doExportDemetra(selezionati, conTotale) {
  const baseName = (campagna?.nome || 'preordine').replace(/\s+/g,'_').toLowerCase();
  selezionati.forEach(emp => {
    const rows = ['Codice;Quantita'];
    righe.forEach(r => {
      const oc = parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0;
      if (oc > 0) rows.push(csvQ(r.codice) + ';' + oc);
    });
    if (rows.length === 1) return;
    const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = baseName + '_' + emp.codice.toLowerCase() + '_demetra.csv';
    a.click();
  });
  if (conTotale) {
    const rows = ['Codice;Quantita'];
    righe.forEach(r => {
      const tot = selezionati.reduce((s, emp) => s + (parseFloat(quantitaMap[r.id]?.[emp.codice]?.ordine_corrente) || 0), 0);
      if (tot > 0) rows.push(csvQ(r.codice) + ';' + tot);
    });
    if (rows.length > 1) {
      const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = baseName + '_totale_demetra.csv';
      a.click();
    }
  }
}
