<script>
(async function() {

  const em = (user.email || '').toLowerCase();

  if (!authorized) {

      authorized = !!(data?.length);

  if (!authorized) {
    document.getElementById('accesso-negato').style.display = '';

  }

  document.getElementById('main-content').style.display = '';
