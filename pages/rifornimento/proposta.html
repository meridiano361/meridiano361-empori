<script>
const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';

const db = supabase.createClient(SUPA_URL, SUPA_KEY);

const user   = JSON.parse(localStorage.getItem('m361_user') || 'null');
const admin  = ['admin','dipendente'].includes(user?.ruolo);
const params = new URLSearchParams(window.location.search);
const propId = parseInt(params.get('id'));

let proposta = null;     // header proposta
let catalogo = [];       // tutti i prodotti
let righe    = {};       // { product_code: { qty, notes, id } }
let isEditable = false;
let saveTimer  = null;
let pendingSave = {};    // { product_code: true } prodotti da salvare
let sortState  = { field: null, dir: 'asc' };  // field: null | 'code' | 'desc' | 'pvp'

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  if (!propId) { showErr('ID proposta mancante.'); return; }

  const [{ data: prop, error: e1 }, { data: cat, error: e2 }, { data: rig, error: e3 }] =
    await Promise.all([
      db.from('rifornimento_proposte').select('*').eq('id', propId).single(),
      db.from('rifornimento_catalogo').select('*').eq('active', true).order('sort_order'),
      db.from('rifornimento_proposte_righe').select('*').eq('proposal_id', propId),
    ]);

  if (e1) { showErr('Proposta non trovata.'); return; }
  if (e2) { showErr('Errore catalogo: ' + e2.message); return; }

  proposta = prop;
  catalogo = cat || [];
  (rig || []).forEach(r => {
    righe[r.product_code] = { qty: r.quantity, notes: r.notes || '', id: r.id };
  });

  isEditable = (proposta.status === 'bozza' || proposta.status === 'inviata') &&
    (admin || proposta.emporio === user?.emporio);

  renderToolbar();
  populateFilters();
  renderTable();
  updateSommario();

  // Notifica "nuovo ordine" delegata da proposte.html per evitare race condition con navigazione
  if (params.get('notify_ordine') === '1') {
    const emp      = decodeURIComponent(params.get('notify_emp') || proposta.emporio || '');
    const mittente = decodeURIComponent(params.get('notify_mitt') || user?.nome || 'Operatore');
    _notificaRespAcquistiOrdine(emp, mittente).catch(() => {});
    // Pulisce i params dall'URL senza ricaricare la pagina
    const cleanUrl = window.location.pathname + '?id=' + propId;
    history.replaceState(null, '', cleanUrl);
  }
}

function showErr(msg) {
  document.getElementById('content').innerHTML =
    `<div class="text-center py-12 text-red-500 text-sm">${msg}</div>`;
}

}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
}

  if (admin && proposta.status === 'letta') {
    actions.innerHTML += `

      </button>
      <button onclick="setStatus('archiviata')"
        class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition-colors">
        Archivia
      </button>`;
  }
  if (admin && proposta.status === 'evasa') {
    actions.innerHTML += `
      <button onclick="setStatus('archiviata')"
        class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition-colors">

      </button>`;
  }
  if (!admin && proposta.status === 'bozza') {

        class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition-colors">

  }

  if (admin) {

            d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2
               m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5
               a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>

// ── FILTRI ────────────────────────────────────────────────────────
function populateFilters() {
  const fornitori = [...new Set(catalogo.map(p => p.fornitore).filter(Boolean))].sort();
  const selForn = document.getElementById('f-forn');
  selForn.innerHTML = '<option value="">Tutti i fornitori</option>';
  fornitori.forEach(f => {
    const o = document.createElement('option');
    o.value = f; o.textContent = f;
    selForn.appendChild(o);
  });
  refreshCatSelect();
}

function refreshCatSelect() {
  const fornSel = document.getElementById('f-forn').value;
  const cats = [...new Set(
    catalogo
      .filter(p => !fornSel || p.fornitore === fornSel)
      .map(p => p.category)
      .filter(Boolean)
  )].sort();
  const sel = document.getElementById('f-cat');
  const prev = sel.value;
  sel.innerHTML = '<option value="">Tutte le categorie</option>';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  if (cats.includes(prev)) sel.value = prev;
}

// ── ASSORTIMENTO per negozio ──────────────────────────────────────
function getAss(prod) {
  const emp = (proposta.emporio || '').toLowerCase();
  if (emp.includes('cas')) return prod.assortment_casalmaggiore;
  if (emp.includes('via')) return prod.assortment_viadana;
  return prod.assortment_cremona;
}
function assLabel(v) {
  if (v === true)  return '<span class="td-ass si">SI</span>';
  if (v === false) return '<span class="td-ass no">NO</span>';
  return '<span class="td-ass nat">—</span>';
}

// ── SORT ──────────────────────────────────────────────────────────
function setSort(field) {
  if (sortState.field === field) {
    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortState = { field, dir: 'asc' };
  }
  renderTable();
}

function sortIcon(field) {
  if (sortState.field !== field)
    return '<span style="color:#cbd5e1;font-size:9px;margin-left:2px">↕</span>';
  return `<span style="font-size:9px;margin-left:2px">${sortState.dir === 'asc' ? '↑' : '↓'}</span>`;
}

function sortProds(arr) {
  if (!sortState.field) return arr;
  return [...arr].sort((a, b) => {
    let va, vb;
    if (sortState.field === 'code') { va = a.product_code || ''; vb = b.product_code || ''; }
    else if (sortState.field === 'desc') { va = a.description || '';  vb = b.description || ''; }
    else if (sortState.field === 'pvp')  { va = Number(a.pvp) || 0;   vb = Number(b.pvp) || 0; }
    if (typeof va === 'string') return sortState.dir === 'asc'
      ? va.localeCompare(vb, 'it', { sensitivity: 'base' })
      : vb.localeCompare(va, 'it', { sensitivity: 'base' });
    return sortState.dir === 'asc' ? va - vb : vb - va;
  });
}

// ── RENDER TABELLA ────────────────────────────────────────────────
function getFilteredProducts() {
  const cerca   = document.getElementById('f-cerca').value.toLowerCase().trim();
  const forn    = document.getElementById('f-forn').value;
  const cat     = document.getElementById('f-cat').value;
  const soloAss = document.getElementById('f-solo-ass').checked;
  const soloQty = document.getElementById('f-solo-qty').checked;

  return catalogo.filter(p => {
    if (forn && p.fornitore !== forn) return false;
    if (cat && p.category !== cat) return false;
    if (soloAss && getAss(p) === false) return false;
    if (soloQty && !righe[p.product_code]?.qty) return false;
    if (cerca) {
      const hay = (p.product_code + ' ' + p.description + ' ' + p.category).toLowerCase();
      if (!hay.includes(cerca)) return false;
    }
    return true;
  });
}

function renderTable() {
  const prods = getFilteredProducts();

  if (!prods.length) {
    document.getElementById('content').innerHTML =
      `<div class="text-center py-12 text-slate-400 text-sm">Nessun prodotto trovato.</div>`;
    return;
  }

  const byForn = {};
  prods.forEach(p => {
    const forn = p.fornitore || p.source_sheet || 'Altro';
    const cat  = p.category  || 'Altro';
    if (!byForn[forn]) byForn[forn] = {};
    if (!byForn[forn][cat]) byForn[forn][cat] = [];
    byForn[forn][cat].push(p);
  });

  const readonly = !isEditable;
  let html = '';

  if (readonly && proposta.status !== 'bozza') {
    html += `<div class="readonly-notice">
      Richiesta in stato <strong>${statusLabel(proposta.status)}</strong> — sola lettura.
    </div>`;
  }

  // Unica tabella → un solo <thead> sticky, senza overflow:hidden che rompe lo sticky
  html += `<div style="overflow-x:auto"><table class="tabella">
    <thead><tr>
      <th style="width:9%;cursor:pointer;user-select:none" onclick="setSort('code')">Codice${sortIcon('code')}</th>
      <th style="width:22%;cursor:pointer;user-select:none" onclick="setSort('desc')">Descrizione${sortIcon('desc')}</th>
      <th style="width:10%">Marchio</th>
      <th style="width:9%;cursor:pointer;user-select:none" onclick="setSort('pvp')">PVP €${sortIcon('pvp')}</th>
      <th style="width:7%">Conf</th>
      <th style="width:7%">Ass.</th>
      <th style="width:11%">Qtà</th>
      <th class="col-note" style="width:16%">Note</th>
    </tr></thead>
    <tbody>`;

  Object.entries(byForn).forEach(([forn, byCat]) => {
    const fornSlug      = slugify(forn);
    const allFornProds  = Object.values(byCat).flat();
    const qtyInForn     = allFornProds.filter(p => righe[p.product_code]?.qty > 0).length;

    html += `<tr onclick="toggleForn('${fornSlug}')">
      <td colspan="8" style="padding:0">
        <div style="background:#1e293b;color:white;padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none">
          <svg id="forn-chev-${fornSlug}" style="width:14px;height:14px;flex-shrink:0;transition:transform .2s;transform:rotate(-90deg)"
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/>
          </svg>
          <span style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;flex:1">${escHtml(forn)}</span>
          <span id="forn-badge-${fornSlug}" style="background:#334155;color:${qtyInForn?'#f59e0b':'#94a3b8'};padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700">
            ${qtyInForn ? qtyInForn + ' compilati · ' : ''}${allFornProds.length} prodotti
          </span>
        </div>
      </td>
    </tr>`;

    Object.entries(byCat).forEach(([cat, catProds]) => {
      const catSlug  = slugCat(cat);
      const qtyInCat = catProds.filter(p => righe[p.product_code]?.qty > 0).length;

      html += `<tr class="forn-rows-${fornSlug} forn-cat-row-${fornSlug}" style="display:none">
        <td colspan="8" style="padding:0">
          <div class="cat-header" onclick="toggleCat(this)" data-cat="${catSlug}" data-forn="${fornSlug}">
            <svg class="w-3 h-3 mr-2 cat-chevron transition-transform" style="transform:rotate(-90deg)" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"/>
            </svg>
            ${escHtml(cat)}
            <span class="cat-badge${qtyInCat ? ' has-qty' : ''}">${qtyInCat ? qtyInCat + ' / ' : ''}${catProds.length}</span>
          </div>
        </td>
      </tr>`;

      sortProds(catProds).forEach(p => {
        const r      = righe[p.product_code] || { qty: 0, notes: '' };
        const hasQty = r.qty > 0;
        const ass    = getAss(p);
        const pack   = p.pack_size && p.pack_size > 1 ? p.pack_size : 1;
        const rowCls = ['cat-prod-' + catSlug, 'forn-rows-' + fornSlug, hasQty ? 'has-qty' : '', ass === false ? 'no-assort' : ''].filter(Boolean).join(' ');
        const pvp    = p.pvp != null ? `€ ${Number(p.pvp).toFixed(2)}` : '—';
        const conf   = pack > 1 ? `×${pack}` : '—';

        const qtyField = readonly
          ? `<span class="font-bold ${hasQty ? 'text-amber-600' : 'text-slate-300'}">${hasQty ? r.qty : '—'}</span>`
          : `<input type="number" min="0" step="${pack}"
               class="qty-input${hasQty ? ' filled' : ''}"
               data-code="${p.product_code}"
               data-catslug="${catSlug}"
               data-forn="${fornSlug}"
               data-pack="${pack}"
               value="${hasQty ? r.qty : ''}"
               placeholder="0"
               oninput="onQtyChange(this)"
               onblur="onQtyBlur(this)">`;

        const noteField = readonly
          ? `<span class="text-xs text-slate-500">${r.notes || ''}</span>`
          : `<input type="text" class="note-input"
               data-code="${p.product_code}"
               value="${escHtml(r.notes || '')}"
               placeholder="—"
               oninput="onNoteChange(this)">`;

        const marchioLabel = p.marchio ? escHtml(p.marchio) + (p.linea ? ` <span style="color:#7c3aed;font-size:10px">${escHtml(p.linea)}</span>` : '') : '—';
        html += `<tr class="${rowCls}" id="row-${p.product_code}" style="display:none">
          <td class="td-code">${p.product_code}</td>
          <td class="td-desc">${escHtml(p.description)}</td>
          <td style="font-size:11px;color:#2563eb;font-weight:600">${marchioLabel}</td>
          <td class="td-pvp">${pvp}</td>
          <td class="td-conf">${conf}</td>
          <td>${assLabel(ass)}</td>
          <td>${qtyField}</td>
          <td class="col-note">${noteField}</td>
        </tr>`;
      });
    });
  });

  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
}

function toggleForn(fornSlug) {
  const catRows = document.querySelectorAll('.forn-cat-row-' + fornSlug);
  const allRows = document.querySelectorAll('.forn-rows-' + fornSlug);
  const chev    = document.getElementById('forn-chev-' + fornSlug);
  const hidden  = catRows.length > 0 && catRows[0].style.display === 'none';
  if (hidden) {
    // apri: mostra solo le intestazioni categoria (non i prodotti)
    catRows.forEach(r => r.style.display = '');
  } else {
    // chiudi: nasconde tutto (categorie + prodotti) e riporta chevron cat a chiuso
    allRows.forEach(r => r.style.display = 'none');
    catRows.forEach(r => {
      const c = r.querySelector('.cat-chevron');
      if (c) c.style.transform = 'rotate(-90deg)';
    });
  }
  if (chev) chev.style.transform = hidden ? '' : 'rotate(-90deg)';
}

function slugCat(cat)    { return cat.replace(/[^a-z0-9]/gi, '_').toLowerCase(); }
function slugify(s)      { return s.replace(/[^a-z0-9]/gi, '_').toLowerCase(); }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── TOGGLE SEZIONE ────────────────────────────────────────────────
function toggleCat(header) {
  const catSlug = header.dataset.cat;
  const rows    = document.querySelectorAll('.cat-prod-' + catSlug);
  if (!rows.length) return;
  const isHidden = rows[0].style.display === 'none';
  rows.forEach(r => r.style.display = isHidden ? '' : 'none');
  const chev = header.querySelector('.cat-chevron');
  if (chev) chev.style.transform = isHidden ? '' : 'rotate(-90deg)';
}

// ── QTÀ / NOTE INPUT ─────────────────────────────────────────────
function onQtyChange(input) {
  const code = input.dataset.code;
  const val  = parseInt(input.value) || 0;
  const pack = parseInt(input.dataset.pack) || 1;

  // Validazione: deve essere multiplo di pack_size
  if (val > 0 && pack > 1 && val % pack !== 0) {
    input.style.borderColor = '#dc2626';
    input.style.background  = '#fef2f2';
    input.title = `Inserire un multiplo di ${pack} (es. ${pack}, ${pack*2}, ${pack*3}…)`;
    return; // non salva finché il valore non è valido
  }
  input.style.borderColor = '';
  input.style.background  = '';
  input.title = '';

  if (!righe[code]) righe[code] = { qty: 0, notes: '' };
  righe[code].qty = val;
  input.classList.toggle('filled', val > 0);
  const row = document.getElementById('row-' + code);
  if (row) row.classList.toggle('has-qty', val > 0);
  updateCatBadge(input.dataset.catslug);
  pendingSave[code] = true;
  scheduleSave();
  updateSommario();
}

function onQtyBlur(input) {
  const val  = parseInt(input.value) || 0;
  const pack = parseInt(input.dataset.pack) || 1;
  if (val > 0 && pack > 1 && val % pack !== 0) {
    // Arrotonda al multiplo superiore più vicino
    input.value = Math.ceil(val / pack) * pack;
    onQtyChange(input);
  }
}

function onNoteChange(input) {
  const code = input.dataset.code;
  if (!righe[code]) righe[code] = { qty: 0, notes: '' };
  righe[code].notes = input.value;
  pendingSave[code] = true;
  scheduleSave();
}

function updateCatBadge(catSlug) {
  document.querySelectorAll('.cat-header').forEach(h => {
    const badge = h.querySelector('.cat-badge');
    if (!badge) return;
    const slug   = h.dataset.cat;
    const rows   = document.querySelectorAll('.cat-prod-' + slug);
    const total  = rows.length;
    const filled = Array.from(rows).filter(r => {
      const inp = r.querySelector('.qty-input');
      return inp && parseInt(inp.value) > 0;
    }).length;
    badge.textContent = filled ? `${filled} / ${total}` : String(total);
    badge.classList.toggle('has-qty', filled > 0);
  });
  // Aggiorna anche i badge fornitore
  document.querySelectorAll('[id^="forn-badge-"]').forEach(badge => {
    const fornSlug = badge.id.replace('forn-badge-', '');
    const rows     = document.querySelectorAll(`tr.forn-rows-${fornSlug}[id^="row-"]`);
    const total    = rows.length;
    const filled   = Array.from(rows).filter(r => {
      const inp = r.querySelector('.qty-input');
      return inp && parseInt(inp.value) > 0;
    }).length;
    badge.style.color = filled ? '#f59e0b' : '#94a3b8';
    badge.textContent = (filled ? filled + ' compilati · ' : '') + total + ' prodotti';
  });
}

// ── AUTOSAVE ──────────────────────────────────────────────────────
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => salva(false), 1200);
}

async function salva(manual = false) {
  if (!isEditable) return;
  clearTimeout(saveTimer);
  const codes = manual ? Object.keys(righe) : Object.keys(pendingSave);
  pendingSave = {};
  if (!codes.length && !manual) return;

  showBadge('saving', 'Salvataggio...');

  // Salva solo le righe toccate (upsert per product_code)
  const toUpsert = codes
    .filter(code => righe[code] !== undefined)
    .map(code => ({
      proposal_id:       propId,
      catalog_product_id: catalogo.find(p => p.product_code === code)?.id || null,
      product_code:      code,
      description:       catalogo.find(p => p.product_code === code)?.description || code,
      quantity:          righe[code].qty || 0,
      notes:             righe[code].notes || '',
    }));

  if (!toUpsert.length) { showBadge('saved', 'Salvato'); return; }

  const { error } = await db
    .from('rifornimento_proposte_righe')
    .upsert(toUpsert, { onConflict: 'proposal_id,product_code' });

  if (error) { showBadge('err', 'Errore: ' + error.message.slice(0,60)); return; }

  // Aggiorna updated_at proposta
  await db.from('rifornimento_proposte').update({ updated_at: new Date().toISOString() }).eq('id', propId);

  showBadge('saved', 'Salvato');
}

async function invia() {
  // Forzo salvataggio prima
  await salva(true);
  const qtaCompilate = Object.values(righe).filter(r => r.qty > 0).length;
  if (!qtaCompilate) {
    if (!confirm('Non hai inserito nessuna quantità. Vuoi inviare comunque?')) return;
  }
  const { error } = await db.from('rifornimento_proposte').update({
    status:       'inviata',
    submitted_at: new Date().toISOString(),
    updated_at:   new Date().toISOString(),
  }).eq('id', propId);
  if (error) { alert('Errore: ' + error.message); return; }
  proposta.status = 'inviata';
  proposta.submitted_at = new Date().toISOString();
  isEditable = false;
  renderToolbar();
  renderTable();

  // Notifica push ai responsabili acquisti (await per evitare cancellazione in mid-flight)
  await _notificaRespAcquisti().catch(() => {});
}

async function _notificaRespAcquisti() {
  const emporio = proposta.emporio || '';
  const { data: resps } = await db
    .from('operatori')
    .select('id')
    .eq('is_resp_acquisti', true)
    .eq('emporio', emporio);

  if (!resps?.length) return;

  const ids = resps.map(r => r.id);
  const mittente = user?.nome || 'Operatore';

  await fetch(`${SUPA_URL}/functions/v1/send-notification`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPA_KEY}`, 'apikey': SUPA_KEY },
    body: JSON.stringify({
      operatore_ids: ids,
      target:        emporio.toLowerCase(),
      titolo:        'Meridiano 361',
      testo:         `Proposta rifornimento — ${emporio}, inviata da ${mittente}`,
      tipo:          'ordini',
      url:           `/pages/rifornimento/proposte.html`,
    }),
  });
}

  const { data: resps } = await db
    .from('operatori')
    .select('id')
    .eq('is_resp_acquisti', true)

}

async function setStatus(newStatus) {
  const { error } = await db.from('rifornimento_proposte').update({
    status:     newStatus,
    updated_at: new Date().toISOString(),
  }).eq('id', propId);
  if (error) { alert('Errore: ' + error.message); return; }
  proposta.status = newStatus;
  isEditable = false;
  renderToolbar();
  renderTable();
}

async function evadi() {
  const nota = prompt('Note per il responsabile del negozio (lascia vuoto se non hai note da aggiungere):');
  if (nota === null) return; // annullato
  const now = new Date().toISOString();
  const { error } = await db.from('rifornimento_proposte').update({
    status:        'evasa',
    note_evasione: nota.trim() || null,
    evasa_at:      now,
    updated_at:    now,
  }).eq('id', propId);
  if (error) { alert('Errore: ' + error.message); return; }
  proposta.status        = 'evasa';
  proposta.note_evasione = nota.trim() || null;
  proposta.evasa_at      = now;
  isEditable = false;
  renderToolbar();
  renderTable();
  await _notificaEvasa(nota.trim()).catch(() => {});
}

async function _notificaEvasa(nota) {
  const emporio = proposta.emporio || '';
  const { data: ops } = await db.from('operatori').select('id').eq('emporio', emporio);
  if (!ops?.length) return;
  const testo = nota
    ? `Proposta rifornimento evasa ✓ — ${emporio}. Note: ${nota}`
    : `La tua proposta rifornimento è stata evasa ✓ — ${emporio}`;
  await fetch(`${SUPA_URL}/functions/v1/send-notification`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPA_KEY}`, 'apikey': SUPA_KEY },
    body: JSON.stringify({
      operatore_ids: ops.map(r => r.id),
      target:        emporio.toLowerCase(),
      titolo:        'Meridiano 361',
      testo,
      tipo:          'ordini',
      url:           `/pages/rifornimento/proposte.html`,
    }),
  });
}

// ── EXPORT ────────────────────────────────────────────────────────
function getExportData() {
  const flat = [];
  const byForn = {};
  catalogo.forEach(p => {
    const r = righe[p.product_code];
    if (!r?.qty || r.qty <= 0) return;
    const forn = p.fornitore || 'Altro';
    const cat  = p.category  || 'Altro';
    if (!byForn[forn]) byForn[forn] = {};
    if (!byForn[forn][cat]) byForn[forn][cat] = [];
    const row = { fornitore: forn, categoria: cat, codice: p.product_code || '',
      descrizione: p.description || '', pvp: p.pvp != null ? Number(p.pvp) : null,
      confezione: p.pack_size || null, qty: r.qty, note: r.notes || '' };
    byForn[forn][cat].push(row);
    flat.push(row);
  });
  return { flat, byForn };
}

function exportFilename(ext) {
  const emp = (proposta.emporio || 'proposta').replace(/[^a-zA-Z0-9]/g, '_');
  const d = new Date(proposta.created_at || Date.now());
  const ds = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `proposta_${emp}_${ds}.${ext}`;
}

function downloadBlob(content, filename, mime) {
  const a = Object.assign(document.createElement('a'),
    { href: URL.createObjectURL(new Blob([content], { type: mime })), download: filename });
  a.click(); URL.revokeObjectURL(a.href);
}

function exportTxt() {
  const { flat, byForn } = getExportData();
  if (!flat.length) { alert('Nessuna quantità compilata.'); return; }
  const SEP = '═'.repeat(52);
  let t = `PROPOSTA DI ORDINE\nNegozio : ${proposta.emporio || '—'}\nData    : ${fmtDate(proposta.created_at)}\nCreata da: ${proposta.created_by || '—'}\nStato   : ${statusLabel(proposta.status)}\n`;
  let totConf = 0;
  Object.entries(byForn).forEach(([forn, byCat]) => {
    t += `\n${SEP}\n${forn.toUpperCase()}\n${SEP}\n`;
    Object.entries(byCat).forEach(([cat, prods]) => {
      t += `\n  ── ${cat} ──\n`;
      prods.forEach(p => {
        const code = p.codice.padEnd(8);
        const desc = p.descrizione.substring(0, 38).padEnd(39);
        const pvp  = (p.pvp != null ? `€${p.pvp.toFixed(2)}` : '—').padEnd(9);
        const conf = (p.confezione ? `×${p.confezione}` : '—').padEnd(5);
        t += `  ${code}${desc}${pvp}${conf}qtà: ${p.qty}${p.note ? '  [' + p.note + ']' : ''}\n`;
        totConf += p.qty;
      });
    });
  });
  t += `\n${'─'.repeat(52)}\nTotale confezioni ordinate: ${totConf}\n`;
  downloadBlob(t, exportFilename('txt'), 'text/plain;charset=utf-8');
}

function exportCsv() {
  const { flat } = getExportData();
  if (!flat.length) { alert('Nessuna quantità compilata.'); return; }
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  let csv = 'Fornitore,Categoria,Codice,Descrizione,"PVP (€)",Confezione,Quantità,Note\r\n';
  flat.forEach(p => {
    csv += [q(p.fornitore), q(p.categoria), q(p.codice), q(p.descrizione),
      p.pvp != null ? p.pvp.toFixed(2) : '', p.confezione ?? '', p.qty, q(p.note)].join(',') + '\r\n';
  });
  downloadBlob('﻿' + csv, exportFilename('csv'), 'text/csv;charset=utf-8');
}

function exportXls() {
  const go = () => {
    const { flat } = getExportData();
    if (!flat.length) { alert('Nessuna quantità compilata.'); return; }
    const wsData = [['Fornitore','Categoria','Codice','Descrizione','PVP (€)','Confezione','Quantità','Note']];
    flat.forEach(p => wsData.push([p.fornitore, p.categoria, p.codice, p.descrizione,
      p.pvp ?? '', p.confezione ?? '', p.qty, p.note]));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:20},{wch:25},{wch:10},{wch:40},{wch:10},{wch:12},{wch:10},{wch:25}];
    XLSX.utils.book_append_sheet(wb, ws, 'Proposta');
    XLSX.writeFile(wb, exportFilename('xlsx'));
  };
  if (window.XLSX) { go(); return; }
  const s = Object.assign(document.createElement('script'),
    { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', onload: go });
  document.head.appendChild(s);
}

// ── SOMMARIO ──────────────────────────────────────────────────────
function updateSommario() {
  const righeArr = Object.values(righe).filter(r => r.qty > 0);
  document.getElementById('s-righe').textContent = righeArr.length;
  document.getElementById('s-qty').textContent   = righeArr.reduce((s, r) => s + (r.qty || 0), 0);
}

// ── SAVE BADGE ────────────────────────────────────────────────────
let badgeTimer;
function showBadge(cls, msg) {
  const b = document.getElementById('save-badge');
  b.className = cls; b.textContent = msg;
  clearTimeout(badgeTimer);
  if (cls === 'saved') badgeTimer = setTimeout(() => { b.style.display='none'; b.className=''; }, 2000);
}

// ── FILTRI eventi ─────────────────────────────────────────────────
document.getElementById('f-cerca').addEventListener('input', renderTable);
document.getElementById('f-forn').addEventListener('change', () => { refreshCatSelect(); renderTable(); });
document.getElementById('f-cat').addEventListener('change', renderTable);
document.getElementById('f-solo-ass').addEventListener('change', renderTable);
document.getElementById('f-solo-qty').addEventListener('change', renderTable);

init();
</script>
