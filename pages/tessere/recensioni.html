<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" href="/faviconm361.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="../../assets/style/nav-style.css">
<link rel="preconnect" href="https://hsalynvxazxqtmsvjrzc.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" as="script">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recensioni Tessera</title>
<script src="../../scripts/nav-script.js"></script>
<style>
:root{--red:#B5453A;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s700:#334155;--s800:#1e293b;--gold:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'CenturyGothic','Century Gothic',sans-serif;background:#f8fafc}
.page-wrap{position:fixed;top:64px;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:16px;max-width:100%}
.inner{max-width:600px;margin:0 auto}
/* Filtro emporio */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select{padding:8px 12px;border:1.5px solid var(--s200);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--s800);background:#fff;cursor:pointer}
.filter-bar button{padding:8px 16px;background:var(--red);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
/* Summary card */
.summary-card{background:#fff;border-radius:16px;padding:20px 20px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);margin-bottom:16px}
.summary-avg{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avg-stars{font-size:36px;font-weight:900;color:var(--s800)}
.avg-label{font-size:11px;color:var(--s400);font-weight:600;margin-top:2px}
.stars-row{display:flex;gap:2px;font-size:22px}
.star-on{color:var(--gold)}
.star-off{color:var(--s200)}
.summary-count{font-size:13px;color:var(--s500);font-weight:600}
/* Breakdown bars */
.breakdown{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:12px;font-weight:700;color:var(--s700);width:14px;text-align:right}
.bar-track{flex:1;background:var(--s100);border-radius:99px;height:8px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}
.bar-count{font-size:11px;color:var(--s400);font-weight:600;width:24px;text-align:right}
/* List */
.section-title{font-size:11px;font-weight:800;color:var(--s400);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;margin-top:4px}
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec-item{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:10px}
.rec-stars{font-size:16px;white-space:nowrap}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:800;color:var(--s800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-date{font-size:11px;color:var(--s400);font-weight:600;margin-top:2px}
.rec-emp{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.empty-msg{text-align:center;color:var(--s400);font-size:14px;font-weight:600;padding:40px 0}
/* Loading */
.loading{text-align:center;color:var(--s400);font-size:13px;padding:30px 0}
/* Delete btn */
.rec-del{background:none;border:none;color:var(--s300);font-size:16px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0}
.rec-del:active{color:#ef4444}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="inner">
    <div class="filter-bar" id="filter-bar" style="display:none">
      <select id="sel-emporio">
        <option value="">Tutti gli empori</option>
        <option value="cremona">Cremona</option>
        <option value="casalmaggiore">Casalmaggiore</option>
        <option value="viadana">Viadana</option>
        <option value="reggio emilia">Reggio Emilia</option>
      </select>
      <button onclick="carica()">Aggiorna</button>
    </div>

    <div id="summary-wrap" style="display:none">
      <div class="summary-card">
        <div class="summary-avg">
          <div>
            <div class="avg-stars" id="avg-num">—</div>
            <div class="stars-row" id="avg-stars-row"></div>
            <div class="avg-label" id="avg-label">Nessuna recensione</div>
          </div>
          <div style="flex:1"></div>
          <div style="text-align:right">
            <div style="font-size:22px;font-weight:900;color:var(--s800)" id="count-num">0</div>
            <div class="avg-label">recensioni</div>
          </div>
        </div>
        <div class="breakdown" id="breakdown"></div>
      </div>

      <div class="section-title">Ultime recensioni</div>
      <div class="rec-list" id="rec-list"></div>
    </div>

    <div class="loading" id="loading-msg">Caricamento...</div>
    <div class="empty-msg" id="empty-msg" style="display:none">Nessuna recensione trovata.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzYWx5bnZ4YXp4cXRtc3ZqcnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ3MjcsImV4cCI6MjA5MzMwMDcyN30.JW4nsMrrfuI8BTg4bn2v74seVJ-_prfxZ1PQp5T18a8';

let _sb, _user, _isAdmin, _emporio;

function _getUser() {
  try { return JSON.parse(localStorage.getItem('m361_user') || 'null'); } catch(e) { return null; }
}

function init() {
  _user    = _getUser();
  _isAdmin = _user && (['admin','dipendente'].includes(_user.ruolo) || ['emilio.mazzolari@gmail.com','e.mazzolari@meridiano361.it'].includes((_user.email||'').toLowerCase()));
  _emporio = _user?.emporio || null;

  if (!_user) {
    sessionStorage.setItem('m361_return_url', location.href);
    location.href = '/pages/login/index.html';
    return;
  }

  _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  // Mostra filtro emporio solo agli admin
  const fb = document.getElementById('filter-bar');
  if (_isAdmin) { fb.style.display = ''; }

  // Pre-seleziona l'emporio dell'operatore non-admin
  if (!_isAdmin && _emporio) {
    document.getElementById('sel-emporio').value = _emporio;
  }

  carica();
}

async function carica() {
  document.getElementById('loading-msg').style.display = '';
  document.getElementById('summary-wrap').style.display = 'none';
  document.getElementById('empty-msg').style.display = 'none';

  const selEmp = document.getElementById('sel-emporio').value;
  const filtroEmp = _isAdmin ? selEmp : (_emporio || '');

  let q = _sb.from('tessera_recensioni')
    .select('id,tessera_token,emporio,nome_cliente,rating,created_at,updated_at')
    .order('updated_at', { ascending: false });

  if (filtroEmp) q = q.eq('emporio', filtroEmp);

  const { data, error } = await q;

  document.getElementById('loading-msg').style.display = 'none';

  if (error || !data || data.length === 0) {
    document.getElementById('empty-msg').style.display = '';
    return;
  }

  renderReport(data);
}

function renderReport(rows) {
  const total = rows.length;
  const avg   = rows.reduce((s, r) => s + r.rating, 0) / total;
  const counts = [0,0,0,0,0]; // indice 0=1★ ... 4=5★
  rows.forEach(r => counts[r.rating - 1]++);

  // Numero medio
  document.getElementById('avg-num').textContent = avg.toFixed(1);
  document.getElementById('count-num').textContent = total;

  // Stelle medie visuali
  const starsRow = document.getElementById('avg-stars-row');
  starsRow.innerHTML = Array.from({length:5},(_,i) => {
    if (i < Math.floor(avg)) return `<span class="star-on">★</span>`;
    if (i < avg) return `<span class="star-on" style="opacity:.6">★</span>`;
    return `<span class="star-off">★</span>`;
  }).join('');

  const labels = ['Scarso','Nella media','Buono','Molto buono','Eccellente'];
  const nearest = Math.round(avg) - 1;
  document.getElementById('avg-label').textContent = `${labels[nearest] || ''} · ${total} ${total===1?'recensione':'recensioni'}`;

  // Breakdown bars (5 → 1)
  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '';
  for (let i = 5; i >= 1; i--) {
    const c   = counts[i - 1];
    const pct = total > 0 ? Math.round((c / total) * 100) : 0;
    breakdown.innerHTML += `
      <div class="bar-row">
        <div class="bar-label">${i}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-count">${c}</div>
      </div>`;
  }

  // Lista recensioni
  const list = document.getElementById('rec-list');
  list.innerHTML = '';
  if (rows.length === 0) {
    list.innerHTML = '<div class="empty-msg" style="display:block">Nessuna ancora.</div>';
  } else {
    rows.forEach(r => {
      const starsHtml = Array.from({length:5},(_,i)=>
        `<span style="color:${i<r.rating?'#f59e0b':'#e2e8f0'}">★</span>`
      ).join('');
      const dt = new Date(r.updated_at || r.created_at);
      const dataFmt = dt.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
      const empLabel = r.emporio ? r.emporio.charAt(0).toUpperCase()+r.emporio.slice(1) : '';
      list.innerHTML += `
        <div class="rec-item" id="ri-${r.id}">
          <div class="rec-stars">${starsHtml}</div>
          <div class="rec-info">
            <div class="rec-name">${r.nome_cliente || 'Anonimo'}</div>
            <div class="rec-date">${dataFmt}${empLabel && _isAdmin ? ` · <span class="rec-emp">${empLabel}</span>` : ''}</div>
          </div>
          ${_isAdmin ? `<button class="rec-del" onclick="eliminaRec('${r.id}')" title="Elimina">✕</button>` : ''}
        </div>`;
    });
  }

  document.getElementById('summary-wrap').style.display = '';
}

async function eliminaRec(id) {
  if (!confirm('Eliminare questa recensione?')) return;
  const { error } = await _sb.from('tessera_recensioni').delete().eq('id', id);
  if (!error) {
    const el = document.getElementById('ri-' + id);
    if (el) el.remove();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
