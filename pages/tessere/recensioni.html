<!DOCTYPE html>
<html lang="it">
<head>
<link rel="icon" href="/faviconm361.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="../../assets/style/nav-style.css">
<link rel="preconnect" href="https://hsalynvxazxqtmsvjrzc.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" as="script">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recensioni Tessera</title>
<script src="../../scripts/nav-script.js"></script>
<style>
:root{--red:#B5453A;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s700:#334155;--s800:#1e293b;--gold:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'CenturyGothic','Century Gothic',sans-serif;background:#f8fafc}
.page-wrap{position:fixed;top:64px;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:16px;max-width:100%}
.inner{max-width:700px;margin:0 auto}
/* Toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input[type=date]{padding:8px 12px;border:1.5px solid var(--s200);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;color:var(--s800);background:#fff;cursor:pointer}
.toolbar button{padding:8px 16px;background:var(--red);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.toolbar-sep{flex:1}
/* Summary */
.summary-card{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.sum-avg-block{display:flex;align-items:center;gap:12px}
.sum-avg-num{font-size:38px;font-weight:900;color:var(--s800);line-height:1}
.sum-stars{display:flex;gap:1px;font-size:20px;margin-bottom:3px}
.sum-count{font-size:12px;color:var(--s400);font-weight:600}
.sum-sep{width:1px;background:var(--s200);align-self:stretch;margin:0 4px}
.breakdown{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
.bar-row{display:flex;align-items:center;gap:7px}
.bar-label{font-size:11px;font-weight:700;color:var(--s700);width:12px;text-align:right}
.bar-track{flex:1;background:var(--s100);border-radius:99px;height:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--gold);border-radius:99px}
.bar-count{font-size:11px;color:var(--s400);font-weight:600;width:22px;text-align:right}
/* Table */
.section-label{font-size:11px;font-weight:800;color:var(--s400);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.rec-table-wrap{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px}
.rec-table{width:100%;border-collapse:collapse}
.rec-table th{text-align:left;padding:10px 14px;background:var(--s50);font-size:11px;font-weight:800;color:var(--s500);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--s200);cursor:pointer;white-space:nowrap;user-select:none}
.rec-table th.sort-asc::after{content:' ↑'}
.rec-table th.sort-desc::after{content:' ↓'}
.rec-table td{padding:10px 14px;border-bottom:1px solid var(--s100);font-size:13px;color:var(--s800);vertical-align:middle}
.rec-table tr:last-child td{border-bottom:none}
.rec-table tr:hover td{background:var(--s50)}
.td-stars{font-size:15px;white-space:nowrap}
.td-name{font-weight:700}
.td-emp{font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.td-del{background:none;border:none;color:var(--s300);font-size:14px;cursor:pointer;padding:2px 4px}
.td-del:active{color:#ef4444}
/* Empty / loading */
.center-msg{text-align:center;color:var(--s400);font-size:14px;font-weight:600;padding:40px 0}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="inner">

    <div class="toolbar">
      <select id="sel-emporio">
        <option value="">Tutti gli empori</option>
        <option value="cremona">Cremona</option>
        <option value="casalmaggiore">Casalmaggiore</option>
        <option value="viadana">Viadana</option>
        <option value="reggio emilia">Reggio Emilia</option>
      </select>
      <input type="date" id="f-dal" title="Dal">
      <input type="date" id="f-al"  title="Al">
      <button onclick="carica()">Aggiorna</button>
    </div>

    <div id="summary-card" class="summary-card" style="display:none">
      <div class="sum-avg-block">
        <div class="sum-avg-num" id="avg-num">—</div>
        <div>
          <div class="sum-stars" id="avg-stars"></div>
          <div class="sum-count" id="avg-count"></div>
        </div>
      </div>
      <div class="sum-sep"></div>
      <div class="breakdown" id="breakdown"></div>
    </div>

    <div class="section-label">Dettaglio recensioni</div>
    <div class="rec-table-wrap" id="table-wrap" style="display:none">
      <table class="rec-table">
        <thead>
          <tr>
            <th id="th-data"    onclick="sortBy('data_acquisto')">Data spesa</th>
            <th id="th-cliente" onclick="sortBy('nome_cliente')">Cliente</th>
            <th>Stelle</th>
            <th id="th-emp"     class="col-emp">Emporio</th>
            <th id="th-ins"     onclick="sortBy('created_at')">Inserita il</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rec-tbody"></tbody>
      </table>
    </div>

    <div class="center-msg" id="loading-msg">Caricamento...</div>
    <div class="center-msg" id="empty-msg"   style="display:none">Nessuna recensione trovata.</div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL = 'https://hsalynvxazxqtmsvjrzc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzYWx5bnZ4YXp4cXRtc3ZqcnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjQ3MjcsImV4cCI6MjA5MzMwMDcyN30.JW4nsMrrfuI8BTg4bn2v74seVJ-_prfxZ1PQp5T18a8';

let _sb, _user, _isAdmin, _emporio;
let _rows = [];
let _sortCol = 'data_acquisto', _sortDir = 'desc';

function _getUser() {
  try { return JSON.parse(localStorage.getItem('m361_user') || 'null'); } catch(e) { return null; }
}

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function starsHtml(n) {
  return Array.from({length:5}, (_,i) =>
    `<span style="color:${i<n?'#f59e0b':'#e2e8f0'}">★</span>`
  ).join('');
}

function init() {
  _user    = _getUser();
  _isAdmin = _user && (['admin','dipendente'].includes(_user.ruolo) ||
             ['emilio.mazzolari@gmail.com','e.mazzolari@meridiano361.it']
               .includes((_user.email||'').toLowerCase()));
  _emporio = _user?.emporio || null;

  if (!_user) {
    sessionStorage.setItem('m361_return_url', location.href);
    location.href = '/pages/login/index.html';
    return;
  }

  _sb = supabase.createClient(SUPA_URL, SUPA_KEY);

  if (!_isAdmin) {
    document.getElementById('sel-emporio').value = _emporio || '';
    document.getElementById('sel-emporio').disabled = true;
    document.getElementById('th-emp').style.display = 'none';
    document.querySelectorAll('.col-emp').forEach(el => el.style.display = 'none');
  }

  // Default date range: ultimo mese
  const today = new Date().toISOString().split('T')[0];
  const monthAgo = new Date(Date.now() - 30*24*3600*1000).toISOString().split('T')[0];
  document.getElementById('f-dal').value = monthAgo;
  document.getElementById('f-al').value  = today;
  document.getElementById('f-dal').max   = today;
  document.getElementById('f-al').max    = today;

  carica();
}

async function carica() {
  document.getElementById('loading-msg').style.display = '';
  document.getElementById('summary-card').style.display = 'none';
  document.getElementById('table-wrap').style.display   = 'none';
  document.getElementById('empty-msg').style.display    = 'none';

  const selEmp = document.getElementById('sel-emporio').value;
  const dal    = document.getElementById('f-dal').value;
  const al     = document.getElementById('f-al').value;
  const emp    = _isAdmin ? selEmp : (_emporio || '');

  let q = _sb.from('tessera_recensioni')
    .select('id,tessera_token,emporio,nome_cliente,rating,data_acquisto,created_at')
    .order('data_acquisto', { ascending: false })
    .order('created_at',    { ascending: false });

  if (emp)  q = q.eq('emporio', emp);
  if (dal)  q = q.gte('data_acquisto', dal);
  if (al)   q = q.lte('data_acquisto', al);

  const { data, error } = await q;

  document.getElementById('loading-msg').style.display = 'none';

  if (error || !data || data.length === 0) {
    document.getElementById('empty-msg').style.display = '';
    return;
  }

  _rows = data;
  renderSummary(data);
  renderTable();
}

function renderSummary(rows) {
  const total  = rows.length;
  const avg    = rows.reduce((s, r) => s + r.rating, 0) / total;
  const counts = [0,0,0,0,0];
  rows.forEach(r => counts[r.rating - 1]++);

  document.getElementById('avg-num').textContent = avg.toFixed(1);
  document.getElementById('avg-stars').innerHTML = Array.from({length:5},(_,i) =>
    `<span style="color:${i < avg ? '#f59e0b' : '#e2e8f0'}">★</span>`
  ).join('');
  document.getElementById('avg-count').textContent = `${total} ${total===1?'recensione':'recensioni'}`;

  const bd = document.getElementById('breakdown');
  bd.innerHTML = '';
  for (let i = 5; i >= 1; i--) {
    const c = counts[i-1];
    const pct = total > 0 ? Math.round((c/total)*100) : 0;
    bd.innerHTML += `
      <div class="bar-row">
        <div class="bar-label">${i}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-count">${c}</div>
      </div>`;
  }

  document.getElementById('summary-card').style.display = '';
}

function sortBy(col) {
  if (_sortCol === col) _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
  else { _sortCol = col; _sortDir = 'desc'; }
  renderTable();
}

function renderTable() {
  // Update sort indicators
  ['data_acquisto','nome_cliente','created_at'].forEach(c => {
    const el = document.getElementById('th-' + (c === 'data_acquisto' ? 'data' : c === 'nome_cliente' ? 'cliente' : 'ins'));
    if (!el) return;
    el.className = c === _sortCol ? ('sort-' + _sortDir) : '';
  });

  const sorted = [..._rows].sort((a, b) => {
    const va = a[_sortCol] || '';
    const vb = b[_sortCol] || '';
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return _sortDir === 'asc' ? cmp : -cmp;
  });

  const tbody = document.getElementById('rec-tbody');
  tbody.innerHTML = '';
  sorted.forEach(r => {
    const empLabel = r.emporio ? r.emporio.charAt(0).toUpperCase()+r.emporio.slice(1) : '—';
    tbody.innerHTML += `
      <tr id="ri-${r.id}">
        <td>${fmtDate(r.data_acquisto)}</td>
        <td class="td-name">${r.nome_cliente || 'Anonimo'}</td>
        <td class="td-stars">${starsHtml(r.rating)}</td>
        <td class="td-emp col-emp"${_isAdmin ? '' : ' style="display:none"'}>${empLabel}</td>
        <td style="color:var(--s400);font-size:12px">${fmtDate(r.created_at)}</td>
        <td>${_isAdmin ? `<button class="td-del" onclick="elimina('${r.id}')" title="Elimina">✕</button>` : ''}</td>
      </tr>`;
  });

  document.getElementById('table-wrap').style.display = '';
}

async function elimina(id) {
  if (!confirm('Eliminare questa recensione?')) return;
  const { error } = await _sb.from('tessera_recensioni').delete().eq('id', id);
  if (!error) {
    _rows = _rows.filter(r => r.id !== id);
    renderSummary(_rows);
    renderTable();
    if (_rows.length === 0) {
      document.getElementById('summary-card').style.display = 'none';
      document.getElementById('table-wrap').style.display   = 'none';
      document.getElementById('empty-msg').style.display    = '';
    }
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
